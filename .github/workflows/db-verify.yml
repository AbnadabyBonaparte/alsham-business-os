          [ "$C" = "0" ] || { echo "::error::o módulo esg deveria ter consumes vazio: [$C]"; exit 1; }
          echo "esg — domain esg, consumes vazio (Lei 7)."

      # ⭐⭐ A física do esg no banco aplicado — o LANÇAMENTO IMUTÁVEL (a lição
      # do pcost/timesheet, sabotada de várias formas antes de entrar):
      - name: a física do esg está de pé (leitura imutável, metric_type CHECK, quantity >= 0)
        run: |
          # SABOTAGEM 1: o cliente NÃO pode reescrever nem apagar — só INSERT,SELECT.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='esg' and table_name='readings'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::esg.readings tem privilégios além de INSERT/SELECT: [$G]"; exit 1; }
          # SABOTAGEM 2: nenhuma policy de UPDATE nem DELETE na leitura.
          P=$($PSQL -tAc "select coalesce(string_agg(distinct p.polcmd::text, ','), '') from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='esg' and c.relname='readings' and p.polcmd in ('w','d');")
          [ -z "$P" ] || { echo "::error::apareceu policy de UPDATE/DELETE em esg.readings: [$P]"; exit 1; }
          # SABOTAGEM 3: o gatilho de imutabilidade recusa reescrita até para o dono.
          T=$($PSQL -tAc "select count(*) from pg_trigger t
                            join pg_class c on c.oid=t.tgrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='esg' and c.relname='readings'
                             and t.tgname='esg_readings_immutable' and not t.tgisinternal;")
          [ "$T" = "1" ] || { echo "::error::o gatilho de imutabilidade sumiu de esg.readings"; exit 1; }
          # SABOTAGEM 4: NÃO existe coluna de status nem updated_at (é fato consumado, sem ciclo).
          S=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='esg' and table_name='readings'
                             and column_name in ('status','updated_at');")
          [ "$S" = "0" ] || { echo "::error::esg.readings ganhou status/updated_at — a leitura não tem ciclo"; exit 1; }
          # SABOTAGEM 5: o metric_type SÓ aceita as quatro dimensões do método (física, não enum do produto).
          BADT=$($PSQL -tAc "select count(*) from pg_type t
                              join pg_namespace n on n.oid=t.typnamespace
                             where n.nspname='esg' and t.typtype='e';")
          [ "$BADT" = "0" ] || { echo "::error::nasceu enum em esg — o tipo é CHECK, não enum do produto"; exit 1; }
          OKT=$($PSQL -tAc "select count(*) from information_schema.check_constraints cc
                              join information_schema.constraint_column_usage u
                                on u.constraint_name=cc.constraint_name and u.constraint_schema=cc.constraint_schema
                             where u.table_schema='esg' and u.table_name='readings' and u.column_name='metric_type';")
          [ "$OKT" -ge "1" ] || { echo "::error::esg.readings.metric_type perdeu o CHECK das quatro dimensões"; exit 1; }
          # SABOTAGEM 6: quantity >= 0 — o DIVERGE assinado (nem o <>0 do pcost, nem o >0 estrito do timesheet).
          OKQ=$($PSQL -tAc "select count(*) from information_schema.check_constraints cc
                              join information_schema.constraint_column_usage u
                                on u.constraint_name=cc.constraint_name and u.constraint_schema=cc.constraint_schema
                             where u.table_schema='esg' and u.table_name='readings' and u.column_name='quantity'
                               and cc.check_clause ilike '%>=%0%';")
          [ "$OKQ" -ge "1" ] || { echo "::error::esg.readings.quantity perdeu o CHECK quantity >= 0"; exit 1; }
          echo "esg — leitura imutável (INSERT,SELECT + gatilho), sem ciclo, metric_type CHECK, quantity >= 0."

      # ⭐ ONDA DEZESSEIS — os dois cartões são DOMAIN rnd (Pesquisa &
      # Desenvolvimento), o território novo. Projetos de pesquisa são o `proj` e
      # Portfólio tecnológico é o `pfolio` — DECLARADOS FORA (anti-duplicação).
      - name: os dois módulos da Onda Dezesseis são domain rnd, consumes vazio
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
