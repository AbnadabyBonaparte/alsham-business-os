      # ONDA DEZOITO (Fase 2) — ABRE o Vertical 🛒 Varejo & Supermercados
      # (Módulos 71–74), o SEGUNDO bloco vertical do catálogo (o primeiro desde
      # Shopping Centers). Quatro módulos: pdv (a venda comercial, não o
      # documento fiscal — Lei 3), catalog (o cadastro do que se vende),
      # cashregister (o turno da gaveta, open→closed) e loyalty (o livro de
      # pontos, imutável). As outras 3 capacidades ficam FORA: Estoque de varejo
      # (=inv genérico), Promoções (dobrada no desconto do pdv), Marketplace
      # próprio (integração futura). `consumes` vazio — sem redeploy do apps/api.
      - name: aplicar 0086_pdv.sql
