      # ⭐ ONDA VINTE (Fase 3) — o Vertical ☀️ ENERGIA (o terceiro bloco
      # vertical). Quatro módulos: plant (usinas + geração distribuída
      # consolidada), subscription (a fatia da geração — active→cancelled
      # terminal), genreading (a leitura imutável — a identidade do esg) e
      # creditbalance (o livro de créditos — a identidade do loyalty, com a
      # recusa argumentada pela física da compensação). As outras 4 capacidades
      # ficam FORA: Geração distribuída (consolidada no plant), Manutenção de
      # usina (=mnt), Contratos de energia (=ctr), Comercialização e leads (=lead).
