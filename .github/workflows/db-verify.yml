      # ⭐ idea: a física do kanban (etapas + move), mas SEM project_id (a ideia
      # existe antes do projeto). ip: tipo num CHECK (4 categorias de PI), ciclo
      # terminal sem reabertura (a física do proj/nc). Vínculos por ID SOLTO.
