name: db-verify

# O SENTINELA em forma de CI.
#
# Sobe um Postgres 17 limpo, aplica as migrations na ordem, aplica o seed duas
# vezes (para provar idempotência) e roda o teste de isolamento com usuário
# real. Toda mudança futura de schema que quebrar o isolamento é barrada aqui,
# antes de chegar na main.
#
# É a diferença entre "RLS escrita" e "RLS que funciona" — e é a lição paga do
# suna-core (Balanço de Tecnologia §5), que nasceu com RLS aberta e virou P0.
#
# Nada aqui toca banco remoto, projeto Supabase ou segredo. O banco é efêmero
# e morre com o job.

on:
  push:
    branches: ['**']
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: schema aplica, isola e não vaza
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 17: a mesma versão dos 12 bancos do império
        # (Balanço Supabase — "todos Postgres 17 no Supabase").
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_verify
      # Qualquer erro de SQL derruba o passo. Sem falha silenciosa.
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      # ---------------------------------------------------------------------
      # 1. APLICAR — a prova que o parser não dá
      # ---------------------------------------------------------------------
      - name: shim do Supabase (auth.users, auth.uid, papéis)
        run: $PSQL -f supabase/tests/00_supabase_shim.sql

      - name: aplicar 0001_core.sql
        run: $PSQL -f supabase/migrations/0001_core.sql

      - name: aplicar 0002_recon.sql
        run: $PSQL -f supabase/migrations/0002_recon.sql

      - name: aplicar 0003_billing.sql
        run: $PSQL -f supabase/migrations/0003_billing.sql

      # `0001` e `0002` estão CONGELADAS (CLAUDE.md §5.4.1) — aplicadas em
      # produção. O CI segue aplicando do zero, e é justamente por isso que ele
      # NÃO detectaria uma edição nelas: correção é migration nova.
      - name: aplicar 0004_marketing.sql
        run: $PSQL -f supabase/migrations/0004_marketing.sql

      - name: aplicar 0005_courier_cron.sql
        run: $PSQL -f supabase/migrations/0005_courier_cron.sql

      - name: aplicar 0006_install.sql
        run: $PSQL -f supabase/migrations/0006_install.sql

      # ⭐ ETAPA 10 — e as duas são SEPARADAS de propósito.
      #
      # `0007` só cria objeto em `ap`; `0008` só cria objeto em `recon`. Cada
      # migration tem um schema dono. Escrever a função `recon.*` dentro do
      # arquivo do módulo de Contas a Pagar obrigaria a guarda "módulo não
      # conhece módulo" a aprender uma exceção — e guarda com exceção é guarda
      # que um dia aceita tudo.
      - name: aplicar 0007_ap.sql
        run: $PSQL -f supabase/migrations/0007_ap.sql

      - name: aplicar 0008_recon_ap_projection.sql
        run: $PSQL -f supabase/migrations/0008_recon_ap_projection.sql

      # ⭐ ETAPA 11 — o Módulo 4, Relacionamentos (CRM base).
      - name: aplicar 0009_crm.sql
        run: $PSQL -f supabase/migrations/0009_crm.sql

      # ⭐ ETAPA 12 — o Módulo 5, Contas a Receber: o espelho consciente do 3.
      - name: aplicar 0010_ar.sql
        run: $PSQL -f supabase/migrations/0010_ar.sql

      - name: aplicar 0011_recon_receivables.sql
        run: $PSQL -f supabase/migrations/0011_recon_receivables.sql

      - name: aplicar 0012_recon_match_decided.sql
        run: $PSQL -f supabase/migrations/0012_recon_match_decided.sql

      - name: aplicar 0013_ar_apply_recon_match.sql
        run: $PSQL -f supabase/migrations/0013_ar_apply_recon_match.sql

      - name: aplicar 0014_ap_apply_recon_match.sql
        run: $PSQL -f supabase/migrations/0014_ap_apply_recon_match.sql

      - name: aplicar 0017_po.sql
        run: $PSQL -f supabase/migrations/0017_po.sql

      # ⭐ O Módulo 6 — a esteira que o TENANT desenha. Nenhuma etapa é enum:
      # elas são linhas de `ops.pipeline_stages`, e a guarda anti-viés do
      # pacote procura pelos nomes do enunciado dentro deste arquivo.
      - name: aplicar 0018_ops.sql
        run: $PSQL -f supabase/migrations/0018_ops.sql

      # ⭐ A FORJA — IA Base, capacidade do CORE (Taxonomia §3). Escreve em
      # `core` porque não é módulo: não aparece na Store, e qualquer módulo
      # pede geração sem conhecê-la.
      - name: aplicar 0019_forge.sql
        run: $PSQL -f supabase/migrations/0019_forge.sql

      # E a coluna que a esteira ganha para marcar o rascunho de máquina —
      # migration do MÓDULO, separada da do Core, como o par 0007/0008.
      - name: aplicar 0020_ops_machine_draft.sql
        run: $PSQL -f supabase/migrations/0020_ops_machine_draft.sql

      # ⭐ O PAINEL EXECUTIVO — leitura ESTREITA, do tenant. Nenhuma tabela
      # nova: o Painel lê, não guarda. E a `core.courier_status()` continua
      # fechada — há guarda adiante que reprova conceder aquela função.
      - name: aplicar 0021_tenant_panel.sql
        run: $PSQL -f supabase/migrations/0021_tenant_panel.sql

      # ⛔ E o EXECUTE que o Postgres concede a PUBLIC por padrão — o buraco
      # que uma sabotagem da Etapa 15 descobriu: apagar um `grant` e a guarda
      # não reclamar, porque o privilégio vinha de `PUBLIC`. Oito funções
      # `security definer` eram chamáveis por `anon`.
      - name: aplicar 0022_revoke_public_execute.sql
        run: $PSQL -f supabase/migrations/0022_revoke_public_execute.sql

      # ⭐ MISSÃO TRINA — o Módulo 8: o estoque como LIVRO imutável. O saldo é
      # view com security_invoker; não existe coluna de saldo, e há guarda
      # adiante conferindo isso no banco aplicado.
      - name: aplicar 0023_inv.sql
        run: $PSQL -f supabase/migrations/0023_inv.sql

      # ⭐ O Módulo 9: a proposta com identidade por DOCUMENTO — a mesa
      # congela o conteúdo, o aceite carimba quem/quando, e os fins são
      # terminais.
      - name: aplicar 0024_quote.sql
        run: $PSQL -f supabase/migrations/0024_quote.sql

      # ⭐ O Módulo 10: a Lei das Etapas, segunda aplicação — estágios do
      # tenant, movimento LIVRE com trilha imutável, desfecho terminal com
      # razão. Nenhum enum de estágio, e há guarda adiante.
      - name: aplicar 0025_deal.sql
        run: $PSQL -f supabase/migrations/0025_deal.sql

      # ⭐ O Módulo 11: o evento UNIVERSAL (Domain marketing) — a lista abre
      # ao publicar, a lotação recusa claro, a presença carimba quem/quando.
      # Nada do ofício do vertical (ingresso, QR, line-up) — há guarda.
      - name: aplicar 0026_evt.sql
        run: $PSQL -f supabase/migrations/0026_evt.sql

      # ⭐⭐ O Módulo 12: a régua — projeção alimentada por FATO (padrão E10,
      # quarta aplicação), a Lei das Etapas pela terceira vez, e o ato
      # registrado. O módulo NÃO envia nada.
      - name: aplicar 0027_dun.sql
        run: $PSQL -f supabase/migrations/0027_dun.sql

      # ⭐ MISSÃO QUADRA — o Módulo 13: contratos com os termos originais
      # CONGELADOS em vigor; o vigente é calculado dos atos imutáveis
      # (reajuste, renovação). Encerrar é calendário; rescindir exige razão.
      - name: aplicar 0028_ctr.sql
        run: $PSQL -f supabase/migrations/0028_ctr.sql

      # ⭐ O Módulo 14: o livro do inv NO DINHEIRO — lançamentos imutáveis,
      # sinal do tipo, categoria do tenant, saldo em view. CAIXA realizado:
      # o futuro é recusado (previsão é Orçamento).
      - name: aplicar 0029_cash.sql
        run: $PSQL -f supabase/migrations/0029_cash.sql

      # ⭐ O Módulo 15: o caso que reabre do resolvido (identidade pelo
      # PEDIDO — a terceira resposta, entre ops e quote), fechado terminal,
      # conversa imutável, categoria E prioridade como dado do tenant.
      - name: aplicar 0030_care.sql
        run: $PSQL -f supabase/migrations/0030_care.sql

      # ⭐ O Módulo 16: o livro do fato consumado — o REGISTRO nasce imutável
      # (a física que diverge do care de propósito), tratativa em atos
      # eternos, encerramento com desfecho escrito, terminal.
      - name: aplicar 0031_occ.sql
        run: $PSQL -f supabase/migrations/0031_occ.sql

      # ⭐ O Módulo 17: a ordem que volta da conclusão (o ops MANTIDO), o
      # relato obrigatório e a preventiva com a próxima devida calculada —
      # sem cron fingido.
      - name: aplicar 0032_mnt.sql
        run: $PSQL -f supabase/migrations/0032_mnt.sql

      # ⭐ MISSÃO PENTA — o Módulo 18: o livro de bens com a localização
      # vigente CALCULADA do livro de transferências (nunca coluna), o
      # "de onde" carimbado pelo servidor e a baixa terminal com razão.
      # A ponte do mnt (asset_id) continua SOLTA — nenhuma linha do 0032 muda.
      - name: aplicar 0033_pat.sql
        run: $PSQL -f supabase/migrations/0033_pat.sql

      # ⭐ O Módulo 19: o modelo é desenho do tenant; executar CONGELA por
      # cópia (gatilho); a resposta é ato que não se rasura; concluir exige
      # tudo respondido. Dois fins, ambos terminais.
      - name: aplicar 0034_chk.sql
        run: $PSQL -f supabase/migrations/0034_chk.sql

      # ⭐ O Módulo 20: a física na CONSTRAINT — exclusion (gist) parcial
      # sobre (espaço, período): o conflito cai no banco, a cancelada libera
      # sozinha, o passado é permitido (fato consumado).
      - name: aplicar 0035_spc.sql
        run: $PSQL -f supabase/migrations/0035_spc.sql

      # ⭐ O Módulo 21: o livro da portaria — entrada e saída carimbadas pelo
      # servidor, o registro que não se rasura (correção é registro novo),
      # a passagem que não volta — e o documento que não passeia no correio.
      - name: aplicar 0036_vis.sql
        run: $PSQL -f supabase/migrations/0036_vis.sql

      # ⭐ O Módulo 22: a fila de entrada do comercial — origem TEXTO LIVRE,
      # ciclo curto com a volta à fila, desfechos terminais com carimbo e o
      # vínculo SOLTO (id + nome carimbado, pela tela) com crm e deal.
      - name: aplicar 0037_lead.sql
        run: $PSQL -f supabase/migrations/0037_lead.sql

      # ⭐ MISSÃO SEXTA — o Módulo 23: a ambição declarada — a trave congela
      # na ativação, o andamento é livro imutável de check-ins, o progresso
      # é o ÚLTIMO check-in (view), e fechar a época é decisão de gente com
      # número na mesa.
      - name: aplicar 0038_goal.sql
        run: $PSQL -f supabase/migrations/0038_goal.sql

      # ⭐ O Módulo 24: o mural do tenant — publicar congela a palavra dada,
      # corrigir é comunicado novo com o título carimbado pelo servidor, a
      # ciência é ato próprio/único/eterno e o arquivado é terminal.
      - name: aplicar 0039_comm.sql
        run: $PSQL -f supabase/migrations/0039_comm.sql

      # ⭐ O Módulo 25: o calendário editorial — canal e fluxo do tenant
      # (Lei das Etapas, 4ª aplicação), o plano que muda livre e o fim que
      # congela com a data real do servidor ao lado da planejada.
      - name: aplicar 0040_edcal.sql
        run: $PSQL -f supabase/migrations/0040_edcal.sql

      # ⭐ O Módulo 26: a biblioteca de mídia — CATÁLOGO, não cofre (o
      # onde-vive em texto livre), o acervo que volta do arquivo (o DIVERGE
      # do pat) e o livro de uso imutável com vínculo solto.
      - name: aplicar 0041_media.sql
        run: $PSQL -f supabase/migrations/0041_media.sql

      # ⭐ O Módulo 27: as pesquisas — a régua 0-10 como física do método
      # (CHECK argumentado), o placar como view calculada do livro, closed
      # terminal (o DIVERGE do care) e anon sem grant nenhum.
      - name: aplicar 0042_nps.sql
        run: $PSQL -f supabase/migrations/0042_nps.sql

      # ⭐ MISSÃO SETE — o Bloco Financeiro. O Módulo 28: centros de custo
      # do tenant (voltam do arquivo), regras que fecham 100% (física) e o
      # rateio como ato de gente, sem perder centavo.
      - name: aplicar 0043_cc.sql
        run: $PSQL -f supabase/migrations/0043_cc.sql

      # ⭐ O Módulo 29: o teto que congela a trave (física do goal no dinheiro)
      # e o realizado calculado do livro do cash, projetado por evento
      # (`cash.entry.registered`). ⚠️ Consumidor — o apps/api precisa de
      # redeploy no apply (runbook §20).
      - name: aplicar 0044_bud.sql
        run: $PSQL -f supabase/migrations/0044_bud.sql

      # ⭐ O Módulo 30: cadastro de contas (voltam do arquivo) e livro por conta.
      # SOL ÚNICO — a conciliação é do recon; o saldo é view e PODE ser negativo
      # (cheque especial); a transferência é atômica. `consumes` vazio.
      - name: aplicar 0045_bank.sql
        run: $PSQL -f supabase/migrations/0045_bank.sql

      # ⭐ O Módulo 31: livro de atos imutáveis; a posição é a soma dos atos,
      # sem cotação de mercado (Lei 3/7); resgatar mais que a posição é
      # recusado (a terceira resposta). `consumes` vazio.
      - name: aplicar 0046_invest.sql
        run: $PSQL -f supabase/migrations/0046_invest.sql

      # ⭐⭐ O Módulo 32 (DRE Gerencial): NÃO fiscal (Lei 3); o plano de linhas é
      # do tenant; os valores nascem dos livros do cash E do cc (segundo
      # consumidor da onda, dois produtores); totais são views; linha sem
      # lançamento não aparece. ⚠️ Consumidor — apps/api precisa de redeploy.
      - name: aplicar 0047_dre.sql
        run: $PSQL -f supabase/migrations/0047_dre.sql

      # ⭐ MISSÃO OITO (Onda 5 — o BLOCO DE PESSOAS). Cinco módulos do Domain
      # RH, todos com `consumes` VAZIO (nenhum handler nesta onda) — sem
      # redeploy obrigatório do apps/api.
      # ⭐ O Módulo 33 (hr): o roster — cargo/departamento texto livre;
      # on_leave volta, terminated é terminal com razão (o DIVERGE do crm).
      - name: aplicar 0048_hr.sql
        run: $PSQL -f supabase/migrations/0048_hr.sql

      # ⭐ O Módulo 34 (shift): a física do spc reaproveitada para a PESSOA —
      # duas escalas não ocupam o mesmo colaborador no mesmo período
      # (exclusion, parcial); o passado é permitido.
      - name: aplicar 0049_shift.sql
        run: $PSQL -f supabase/migrations/0049_shift.sql

      # ⭐ O Módulo 35 (train): a identidade do evt aplicada ao treino —
      # turma publicada abre inscrição, presença é ato imutável carimbado.
      - name: aplicar 0050_train.sql
        run: $PSQL -f supabase/migrations/0050_train.sql

      # ⭐ O Módulo 36 (perf): avaliador × avaliado (o contraste com o goal);
      # a avaliação é ato imutável; o ciclo fechado é terminal.
      - name: aplicar 0051_perf.sql
        run: $PSQL -f supabase/migrations/0051_perf.sql

      # ⭐ O Módulo 37 (pol): política tem VERSÃO — a ciência é por (política,
      # versão): versão nova exige ciência de novo (o DIVERGE do comm).
      - name: aplicar 0052_pol.sql
        run: $PSQL -f supabase/migrations/0052_pol.sql

      # ---------------------------------------------------------------------
      # 2. SEED — e a prova de que reaplicar não muda nada
      # ---------------------------------------------------------------------
      - name: aplicar o seed de plataforma
        run: $PSQL -f supabase/seed/0001_platform.sql

      - name: reaplicar o seed e provar idempotência
        run: |
          SNAP="select (select count(*) from core.roles)||'/'||\
                       (select count(*) from core.role_permissions)||'/'||\
                       (select count(*) from core.module_registry)||'/'||\
                       (select count(*) from core.plan_limits)"
          ANTES=$($PSQL -tAc "$SNAP")
          $PSQL -q -f supabase/seed/0001_platform.sql
          $PSQL -q -f supabase/seed/0001_platform.sql
          DEPOIS=$($PSQL -tAc "$SNAP")
          echo "após 1x: $ANTES | após 3x: $DEPOIS"
          [ "$ANTES" = "$DEPOIS" ] || { echo "::error::seed NÃO é idempotente"; exit 1; }

      # ---------------------------------------------------------------------
      # 3. AS INVARIANTES DE SEGURANÇA — as mesmas do runbook
      # ---------------------------------------------------------------------
      - name: RLS ligada e forçada em toda tabela
        run: |
          FALTA=$($PSQL -tAc "
            select coalesce(string_agg(n.nspname||'.'||c.relname, ', '), '')
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol') and c.relkind = 'r'
               and (not c.relrowsecurity or not c.relforcerowsecurity);")
          [ -z "$FALTA" ] || { echo "::error::sem RLS enable+force: $FALTA"; exit 1; }
          $PSQL -c "select n.nspname as schema, count(*) as tabelas
                      from pg_class c join pg_namespace n on n.oid=c.relnamespace
                     where n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol') and c.relkind='r'
                     group by 1 order by 1;"

      - name: nenhuma policy USING (true)
        run: |
          ABERTAS=$($PSQL -tAc "
            select coalesce(string_agg(c.relname||'.'||p.polname, ', '), '')
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol')
               and pg_get_expr(p.polqual, p.polrelid) = 'true';")
          [ -z "$ABERTAS" ] || { echo "::error::policy aberta (lição paga do suna-core): $ABERTAS"; exit 1; }

      - name: nada exposto em public, nada para anon
        run: |
          PUB=$($PSQL -tAc "select count(*) from pg_class c
                              join pg_namespace n on n.oid=c.relnamespace
                             where n.nspname='public' and c.relkind='r';")
          [ "$PUB" = "0" ] || { echo "::error::$PUB tabela(s) em public — expostas via API"; exit 1; }
          ANON=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                              where grantee='anon' and table_schema in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol');")
          [ "$ANON" = "0" ] || { echo "::error::anon tem $ANON grant(s) no Business OS"; exit 1; }

      - name: o seed não semeou tenant nem usuário
        run: |
          N=$($PSQL -tAc "select (select count(*) from core.tenants)
                               + (select count(*) from auth.users);")
          [ "$N" = "0" ] || { echo "::error::o seed de catálogo criou $N linha(s) de tenant/usuário"; exit 1; }

      # ---------------------------------------------------------------------
      # 4. ISOLAMENTO COM USUÁRIO REAL — a prova que o suna-core nunca teve
      # ---------------------------------------------------------------------
      - name: teste de isolamento multi-tenant
        run: $PSQL -f supabase/tests/01_rls_isolation.sql

      # A contabilidade de uso é o dado que vira DINHEIRO. Vazamento aqui é o
      # concorrente lendo o volume de operação do vizinho.
      - name: teste de isolamento da contabilidade de uso
        run: $PSQL -f supabase/tests/02_usage_isolation.sql

      # ⭐ A PROVA DA ETAPA 7, no banco e não só no TypeScript.
      #
      # Os testes do pacote provam a LÓGICA do consumo com uma projeção de
      # mentira. Este prova o EFEITO: o fato entra uma vez, a reentrega não
      # repete, a decisão de um tenant não carimba a campanha do outro, e o
      # cliente não consegue forjar a própria aprovação de verba.
      #
      # A terceira importa porque `record_spend_decision` é SECURITY DEFINER —
      # e função SECURITY DEFINER escrita sem cuidado é exatamente como se
      # atravessa a RLS sem perceber.
      - name: teste do consumo entre módulos (Módulo 2)
        run: $PSQL -f supabase/tests/03_marketing_consumption.sql

      # A visão de saúde tem de responder assim que o arquivo é aplicado — ela
      # é como o dono descobre que o correio parou. Uma visão que só existe no
      # papel não avisa ninguém de nada.
      # ⭐ A PROVA DA ETAPA 9: instalar dá acesso, desinstalar NÃO apaga dado.
      - name: teste do instalador em runtime
        run: $PSQL -f supabase/tests/04_install_module.sql

      # ⭐⭐ A PROVA DA ETAPA 10: O TRIÂNGULO.
      #
      # O Módulo 3 emite; o Módulo 1 — o mais antigo, o que ninguém escreveu
      # para escutar — projeta. Onze cenários, e três deles são o que nenhum
      # teste de pacote alcança:
      #
      #   · a origem gravada vem do ENVELOPE, não de constante — um produtor
      #     fictício (`erp-bridge`) grava a origem DELE;
      #   · o mesmo `DOC-TRI-0001` nos dois tenants não se mistura;
      #   · um usuário real NÃO executa `recon.record_external_payable`, que é
      #     SECURITY DEFINER — dar essa caneta à tela deixaria o cliente forjar
      #     um título "vindo de outro módulo" por dentro da RLS.
      - name: teste do triângulo (Módulo 3 → Módulo 1)
        run: $PSQL -f supabase/tests/05_ap_triangle.sql

      # ⭐ A PROVA DA ETAPA 11: o Módulo 4 no banco.
      #
      # Nove cenários, e três deles são o que nenhum teste de pacote alcança:
      #
      #   · a interação é IMUTÁVEL — negada até para quem roda como DONO DO
      #     BANCO, que é onde as outras duas camadas não valem;
      #   · arquivar a contraparte NÃO leva o histórico junto;
      #   · a chave estrangeira COMPOSTA impede a interação de apontar para a
      #     contraparte de outro tenant. Sem ela, a RLS de leitura esconderia o
      #     estrago em vez de impedi-lo — o dado errado existiria, calado.
      - name: teste do Módulo 4 (isolamento, imutabilidade, histórico)
        run: $PSQL -f supabase/tests/06_crm_isolation.sql

      # ⭐⭐ A PROVA DA ETAPA 12: o espelho, com o contraste no mesmo banco.
      #
      # Sete cenários, e o que nenhum teste de pacote alcança é o par 5 / 5.1:
      # **receber a maior PASSA no `ar`, e pagar a maior é RECUSADO no `ap`** —
      # as duas afirmações rodam contra o mesmo Postgres, no mesmo arquivo. Se
      # alguém "uniformizar" os dois módulos, um dos dois cenários quebra.
      - name: teste do Módulo 5 (isolamento, transições e a divergência)
        run: $PSQL -f supabase/tests/07_ar_isolation.sql

      - name: teste triângulo crédito (ar emite → recon projeta)
        run: $PSQL -f supabase/tests/08_ar_recon_triangle.sql

      - name: teste ciclo fechado (recon confirma → ar liquida)
        run: $PSQL -f supabase/tests/09_ar_recon_settlement.sql

      - name: teste ciclo fechado (recon confirma → ap liquida)
        run: $PSQL -f supabase/tests/10_ap_recon_settlement.sql

      - name: teste do Módulo 6 (pedidos — isolamento, itens, permissões)
        run: $PSQL -f supabase/tests/11_po_isolation.sql

      # ⛔ CANCELAR É ESTADO, NUNCA DELETE — conferido no banco aplicado.
      - name: nenhuma porta de DELETE em ar.receivables
        run: |
          # Filtra o grantee: o DONO da tabela sempre tem DELETE, implicitamente
          # e sem como tirar. A regra é que o CLIENTE não tem a porta. (Lição da
          # Etapa 10, onde a primeira versão desta guarda reprovou o repositório
          # inteiro por contar o privilégio do owner.)
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='ar' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em ar ao cliente"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='ar' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em ar"; exit 1; }

      # ⭐⭐ O ESPELHO É CONSCIENTE — conferido NO BANCO, não no arquivo.
      #
      # O `ap` recusa pagar a maior; o `ar` aceita receber a maior. As duas
      # coisas são decisões, e as duas têm de continuar verdadeiras ao mesmo
      # tempo. Aqui elas são conferidas contra as constraints APLICADAS: um
      # "conserto por simetria" em qualquer um dos lados reprova.
      - name: a divergência do espelho continua de pé
        run: |
          AP=$($PSQL -tAc "select count(*) from pg_constraint c
                             join pg_class t on t.oid = c.conrelid
                             join pg_namespace n on n.oid = t.relnamespace
                            where n.nspname='ap' and c.conname='payables_no_overpay';")
          [ "$AP" = "1" ] || {
            echo "::error::o ap perdeu payables_no_overpay — o espelho perdeu o contraste"; exit 1; }
          AR=$($PSQL -tAc "select count(*) from pg_constraint c
                             join pg_class t on t.oid = c.conrelid
                             join pg_namespace n on n.oid = t.relnamespace
                            where n.nspname='ar'
                              and pg_get_constraintdef(c.oid) ilike '%received_amount_cents <= amount_cents%';")
          [ "$AR" = "0" ] || {
            echo "::error::o ar ganhou uma constraint de não receber a maior — ver 0010_ar.sql §2.1"; exit 1; }
          echo "espelho intacto: o ap recusa pagar a maior, o ar aceita receber a maior."

      # ⭐ O CATÁLOGO TEM SEIS CARTÕES — o quinto consome a baixa; o sexto (po)
      # nasce com consumes vazio (protocolo paralelo / Lei 7).
      # ⭐⭐ A PROVA DA ETAPA 13: a esteira é do TENANT, e a trilha é história.
      #
      # Dez cenários, e três deles não existem em teste de pacote nenhum:
      #
      #   · o CENÁRIO 1 escreve DUAS esteiras de ofícios diferentes — uma
      #     agência e uma manutenção predial — na mesma tabela, no mesmo banco.
      #     É a prova de que o módulo não é de marketing;
      #   · o CENÁRIO 3 prova que a permissão depende do DESENHO: o mesmo
      #     usuário passa da etapa comum e trava na que o tenant marcou como
      #     de aprovação — e a tentativa recusada NÃO deixa linha na trilha;
      #   · o CENÁRIO 8 APAGA uma etapa já percorrida e confere que a trilha
      #     continua legível. É a única prova possível de que o nome carimbado
      #     não é comentário bonito.
      - name: teste do Módulo 7 (esteira do tenant, trilha imutável, refazer)
        run: $PSQL -f supabase/tests/12_ops_isolation.sql

      # ⭐⭐ A PROVA DO MÓDULO 8: o livro imutável e o saldo honesto.
      #
      # Sete cenários, e três deles não existem em teste de pacote nenhum:
      #
      #   · o livro é IMUTÁVEL até para o dono do banco (camada 3);
      #   · o AJUSTE exige razão (constraint) E permissão própria — a
      #     assimetria user-a × user-b prova que quem conta não é quem confere;
      #   · o saldo NEGATIVO passa e a view soma sob a RLS de quem lê
      #     (security_invoker) — o Beta não soma o estoque do Alfa.
      - name: teste do Módulo 8 (livro imutável, ajuste com razão, saldo negativo)
        run: $PSQL -f supabase/tests/13_inv_isolation.sql

      # ⛔ O LIVRO NÃO TEM PORTA DE EDIÇÃO — conferido no banco aplicado.
      #
      # `inv.movements` aceita INSERT direto (o fato É o dado, como
      # `crm.interactions`) — mas UPDATE e DELETE não existem para o cliente,
      # e o saldo NÃO é coluna: é view que soma o livro.
      - name: o livro do estoque não se edita, e o saldo não é coluna
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='inv' and table_name='movements'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || {
            echo "::error::inv.movements tem privilégios além de INSERT/SELECT: [$G]"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='inv' and c.relname='movements'
                             and p.polcmd in ('w','d');")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de UPDATE/DELETE no livro"; exit 1; }
          T=$($PSQL -tAc "select count(*) from pg_trigger t
                            join pg_class c on c.oid=t.tgrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='inv' and c.relname='movements'
                             and t.tgname='movements_immutable' and not t.tgisinternal;")
          [ "$T" = "1" ] || { echo "::error::o gatilho de imutabilidade sumiu do livro"; exit 1; }
          # E o saldo é CONSEQUÊNCIA: nenhuma coluna de saldo em inv.items,
          # e a view soma com a RLS de quem lê.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='inv' and table_name='items'
                             and column_name in ('balance','quantity','quantity_on_hand','saldo');")
          [ "$C" = "0" ] || { echo "::error::inv.items ganhou coluna de saldo — o saldo é a soma do livro"; exit 1; }
          V=$($PSQL -tAc "select count(*) from pg_class c
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='inv' and c.relname='balances' and c.relkind='v'
                             and c.reloptions::text like '%security_invoker=true%';")
          [ "$V" = "1" ] || { echo "::error::inv.balances sem security_invoker — a view somaria todos os tenants"; exit 1; }

      - name: nenhuma porta de DELETE em inv
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='inv' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em inv ao cliente — arquivar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='inv' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em inv"; exit 1; }

      # ⭐⭐ A PROVA DO MÓDULO 9: a mesa congelada e o ato carimbado.
      #
      # Seis cenários, e três não existem em teste de pacote nenhum:
      #   · o conteúdo congela DEPOIS do envio, nas três operações;
      #   · o aceite carimba quem/quando pelo SERVIDOR, exige decide
      #     (assimetria user-a × user-b) e o fim é terminal contra o gatilho
      #     real;
      #   · expirar só passa com validade VENCIDA — calendário, nunca vontade.
      - name: teste do Módulo 9 (mesa congelada, ato carimbado, fins terminais)
        run: $PSQL -f supabase/tests/14_quote_isolation.sql

      # ⭐⭐ A PROVA DO MÓDULO 10: o mapa do tenant e o movimento livre.
      #
      # Seis cenários; os que nenhum teste de pacote alcança:
      #   · dois OFÍCIOS (loja e licitação) desenham funis na mesma tabela;
      #   · o movimento volta SEM rito — e cada movimento vira trilha com os
      #     nomes carimbados;
      #   · perder sem razão é recusado pela função E pelo porteiro;
      #   · o estágio percorrido se apaga e a trilha continua legível.
      - name: teste do Módulo 10 (funil do tenant, movimento livre, desfecho)
        run: $PSQL -f supabase/tests/15_deal_isolation.sql

      # ⭐ A Lei das Etapas, SEGUNDA aplicação, conferida no banco: nenhum
      # enum no schema deal, e a tabela de estágios com as colunas do desenho.
      - name: nenhum estágio de funil virou enum no banco
        run: |
          T=$($PSQL -tAc "select coalesce(string_agg(t.typname, ','), '')
                            from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='deal' and t.typtype='e';")
          [ -z "$T" ] || { echo "::error::nasceram tipos enumerados em deal: $T — o estágio é dado do tenant"; exit 1; }
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='deal' and table_name='funnel_stages'
                             and column_name in ('name','position');")
          [ "$C" = "2" ] || { echo "::error::deal.funnel_stages perdeu uma coluna do desenho"; exit 1; }
          # E a fronteira com o crm é SOLTA: party_id sem FK.
          FK=$($PSQL -tAc "select count(*) from pg_constraint c
                             join pg_class t on t.oid = c.conrelid
                             join pg_namespace n on n.oid = t.relnamespace
                            where n.nspname='deal' and c.contype='f'
                              and c.confrelid::regclass::text like 'crm.%';")
          [ "$FK" = "0" ] || { echo "::error::deal ganhou FK para crm — o vínculo é ID solto + nome carimbado"; exit 1; }

      - name: nenhuma porta de escrita em deal.opportunity_events
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ','), '')
                            from information_schema.role_table_grants
                           where table_schema='deal' and table_name='opportunity_events'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || {
            echo "::error::deal.opportunity_events tem privilégios além de SELECT: [$G]"; exit 1; }

      - name: o décimo cartão (deal) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='deal';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo deal declara $C consumo(s) — o vínculo proposta↔negociação está NÃO CONSTRUÍDO (spec §5)"
            exit 1; }
          echo "deal no catálogo com consumes vazio."

      # ⭐⭐ A PROVA DO MÓDULO 11: a lista honesta e a presença carimbada.
      - name: teste do Módulo 11 (lista publicada, lotação clara, presença)
        run: $PSQL -f supabase/tests/16_evt_isolation.sql

      # ⛔ O OFÍCIO DO VERTICAL NÃO ENTROU — conferido no banco aplicado.
      # O perigo da pedreira events-os é importar promessa: cada engine de lá
      # é tentação de virar coluna aqui.
      - name: o evento universal não virou o vertical
        run: |
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='evt'
                             and (column_name ~* 'ticket|price|qr|sponsor|lineup|badge'
                                  or column_name in ('email','phone'));")
          [ "$C" = "0" ] || { echo "::error::o schema evt ganhou coluna do ofício do vertical (ou canal congelado)"; exit 1; }
          T=$($PSQL -tAc "select coalesce(string_agg(t.typname, ','), '')
                            from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='evt' and t.typtype='e';")
          [ -z "$T" ] || { echo "::error::nasceram tipos enumerados em evt: $T"; exit 1; }

      - name: nenhuma porta de DELETE em evt
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='evt' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em evt ao cliente — cancelar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='evt' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em evt"; exit 1; }

      - name: o décimo primeiro cartão (evt) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='evt';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo evt declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "evt no catálogo com consumes vazio."

      # ⭐⭐ A PROVA DO MÓDULO 12: O TRIÂNGULO DA RÉGUA.
      #
      # Oito cenários, e os que nenhum teste de pacote alcança:
      #   · a origem gravada vem do ENVELOPE — um produtor fictício
      #     (`erp-bridge`) grava a origem DELE;
      #   · a BAIXA NA ORIGEM tira o título da régua SOZINHA, com o fato
      #     dun.title.left saindo — e o passo passa a ser recusado;
      #   · um usuário real NÃO executa dun.record_external_receivable —
      #     dar essa caneta à tela deixaria o cliente forjar título.
      - name: teste do triângulo da régua (ar emite → dun projeta → passo → baixa)
        run: $PSQL -f supabase/tests/17_dun_triangle.sql

      # ⛔ A PROJEÇÃO E O ATO NÃO TÊM PORTA DE ESCRITA — no banco aplicado.
      - name: a régua não se escreve à mão
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='dun' and table_name='titles'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || { echo "::error::dun.titles tem privilégios além de SELECT: [$G]"; exit 1; }
          E=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='dun' and table_name='step_executions'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$E" = "SELECT" ] || { echo "::error::dun.step_executions tem privilégios além de SELECT: [$E]"; exit 1; }
          # E a porta de projeção continua fechada ao cliente.
          A=$($PSQL -tAc "select count(*) from pg_proc p
                            join pg_namespace n on n.oid = p.pronamespace
                           where n.nspname='dun' and p.proname='record_external_receivable'
                             and (has_function_privilege('authenticated', p.oid, 'execute')
                               or has_function_privilege('anon', p.oid, 'execute'));")
          [ "$A" = "0" ] || { echo "::error::dun.record_external_receivable está concedida ao cliente"; exit 1; }
          # Uma régua ativa por tenant: o índice parcial existe.
          I=$($PSQL -tAc "select count(*) from pg_indexes
                           where schemaname='dun' and indexname='rulers_one_active';")
          [ "$I" = "1" ] || { echo "::error::o índice de régua única sumiu — a lei virou lembrança"; exit 1; }

      # ⭐ O 12º CARTÃO DECLARA OS TRÊS CONSUMOS QUE O HANDLER COBRE — a Lei 7
      # do jeito certo, conferida no banco.
      - name: o décimo segundo cartão (dun) declara os três consumos do handler
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='dun';")
          [ "$C" = "3" ] || {
            echo "::error::o módulo dun declara $C consumo(s) — esperado 3 (o handler cobre três)"
            exit 1; }
          for T in ar.receivable.registered ar.receivable.updated ar.receivable.cancelled; do
            OK=$($PSQL -tAc "select count(*) from core.module_registry,
                                  jsonb_array_elements(events_consumes) e
                              where module_id='dun' and e->>'type' = '$T';")
            [ "$OK" = "1" ] || { echo "::error::o cartão do dun não declara $T"; exit 1; }
          done
          echo "dun no catálogo com os três consumos do handler."

      # ⭐ A PROVA DO MÓDULO 13 NO BANCO: termos congelados, atos imutáveis,
      # calendário honesto — contra os gatilhos reais, com usuário real.
      - name: teste de contratos (ctr)
        run: $PSQL -f supabase/tests/18_ctr_isolation.sql

      # ⛔ OS DOIS LIVROS DO ctr NÃO TÊM PORTA DE ESCRITA — no banco aplicado.
      - name: os livros do contrato não se escrevem à mão
        run: |
          for T in adjustments renewals; do
            G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                              from information_schema.role_table_grants
                             where table_schema='ctr' and table_name='$T'
                               and grantee in ('anon','authenticated','PUBLIC');")
            [ "$G" = "SELECT" ] || { echo "::error::ctr.$T tem privilégios além de SELECT: [$G]"; exit 1; }
          done
          # E as views do termo vigente rodam com a RLS de quem lê.
          for V in contract_terms expiring; do
            SI=$($PSQL -tAc "select count(*) from pg_class c
                               join pg_namespace n on n.oid=c.relnamespace
                              where n.nspname='ctr' and c.relname='$V'
                                and c.reloptions::text like '%security_invoker=true%';")
            [ "$SI" = "1" ] || { echo "::error::ctr.$V perdeu security_invoker — a view atravessaria a RLS"; exit 1; }
          done
          # Nenhum enum nasceu no schema: tipo de contrato é texto livre.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='ctr' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema ctr — vocabulário de uma casa virou schema de todos"; exit 1; }
          # E não existe porta de DELETE em contrato: o desfecho é status.
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='ctr' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema ctr"; exit 1; }

      - name: o décimo terceiro cartão (ctr) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='ctr';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo ctr declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "ctr no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 14 NO BANCO: livro imutável, sinal do tipo,
      # futuro recusado, saldo sob RLS dentro da view.
      - name: teste do fluxo de caixa (cash)
        run: $PSQL -f supabase/tests/19_cash_isolation.sql

      # ⛔ O LIVRO-CAIXA NÃO TEM PORTA DE EDIÇÃO — no banco aplicado.
      - name: o livro-caixa não se rasura
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='cash' and table_name='entries'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::cash.entries tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          for V in balances monthly by_category; do
            SI=$($PSQL -tAc "select count(*) from pg_class c
                               join pg_namespace n on n.oid=c.relnamespace
                              where n.nspname='cash' and c.relname='$V'
                                and c.reloptions::text like '%security_invoker=true%';")
            [ "$SI" = "1" ] || { echo "::error::cash.$V perdeu security_invoker — a view somaria todos os tenants"; exit 1; }
          done
          # Nenhuma coluna de saldo nasceu em tabela do schema cash.
          B=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='cash'
                              and table_name in (select c.relname from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='cash' and c.relkind='r')
                              and column_name like '%balance%';")
          [ "$B" = "0" ] || { echo "::error::apareceu coluna de saldo no schema cash — o saldo é view"; exit 1; }
          # E a trava do futuro está em vigor no banco.
          F=$($PSQL -tAc "select count(*) from information_schema.check_constraints
                            where constraint_schema='cash' and constraint_name='entries_not_future';")
          [ "$F" = "1" ] || { echo "::error::a trava do futuro sumiu — previsão entraria como realizado"; exit 1; }

      - name: o décimo quarto cartão (cash) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='cash';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo cash declara $C consumo(s) — a regra contra a dupla contagem não foi desenhada (Lei 7)"
            exit 1; }
          echo "cash no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 15 NO BANCO: reabre do resolvido, fecha de vez,
      # conversa eterna, carimbo do servidor.
      - name: teste de atendimento (care)
        run: $PSQL -f supabase/tests/20_care_isolation.sql

      # ⛔ A CONVERSA NÃO TEM PORTA DE EDIÇÃO — no banco aplicado.
      - name: a conversa do caso não se edita
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='care' and table_name='interactions'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::care.interactions tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          SI=$($PSQL -tAc "select count(*) from pg_class c
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='care' and c.relname='overdue'
                              and c.reloptions::text like '%security_invoker=true%';")
          [ "$SI" = "1" ] || { echo "::error::care.overdue perdeu security_invoker"; exit 1; }
          # Nenhum enum: categoria e prioridade são tabelas do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='care' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema care — o vocabulário é do tenant"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='care' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema care"; exit 1; }

      - name: o décimo quinto cartão (care) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='care';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo care declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "care no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 16 NO BANCO: o relato que não se reescreve nem
      # pelo dono, o desfecho obrigatório e a tratativa eterna.
      - name: teste de ocorrências (occ)
        run: $PSQL -f supabase/tests/21_occ_isolation.sql

      # ⛔ O REGISTRO NÃO TEM PORTA DE UPDATE — no banco aplicado.
      - name: o fato consumado não se reescreve
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='occ' and table_name='occurrences'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::occ.occurrences tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          T=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='occ' and table_name='treatments'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$T" = "INSERT,SELECT" ] || { echo "::error::occ.treatments tem privilégios além de INSERT,SELECT: [$T]"; exit 1; }
          # Nenhum enum: a gravidade é tabela do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='occ' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema occ — a gravidade é do tenant"; exit 1; }
          # E a trava do futuro está em vigor no banco.
          F=$($PSQL -tAc "select count(*) from information_schema.check_constraints
                            where constraint_schema='occ' and constraint_name='occurrences_not_future';")
          [ "$F" = "1" ] || { echo "::error::a trava do futuro sumiu do occ — fato consumado não mora no futuro"; exit 1; }

      - name: o décimo sexto cartão (occ) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='occ';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo occ declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "occ no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 17 NO BANCO: relato obrigatório, done que volta,
      # trilha do gatilho e a próxima devida calculada sob RLS.
      - name: teste de manutenção (mnt)
        run: $PSQL -f supabase/tests/22_mnt_isolation.sql

      # ⛔ A TRILHA DA ORDEM É DO GATILHO — no banco aplicado.
      - name: a trilha da manutenção não se escreve à mão
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='mnt' and table_name='order_events'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || { echo "::error::mnt.order_events tem privilégios além de SELECT: [$G]"; exit 1; }
          SI=$($PSQL -tAc "select count(*) from pg_class c
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='mnt' and c.relname='preventive_queue'
                              and c.reloptions::text like '%security_invoker=true%';")
          [ "$SI" = "1" ] || { echo "::error::mnt.preventive_queue perdeu security_invoker"; exit 1; }
          # Nenhum enum: prioridade é tabela do tenant (o tipo é CHECK argumentado).
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='mnt' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema mnt"; exit 1; }
          # A recorrência continua presa à preventiva, no banco.
          R=$($PSQL -tAc "select count(*) from information_schema.check_constraints
                            where constraint_schema='mnt' and constraint_name='mnt_orders_recurrence_preventive';")
          [ "$R" = "1" ] || { echo "::error::a constraint recorrência-só-na-preventiva sumiu"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='mnt' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema mnt"; exit 1; }

      - name: o décimo sétimo cartão (mnt) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='mnt';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo mnt declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "mnt no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 18 NO BANCO: a vigente calculada, o "de onde"
      # do servidor, a baixa terminal e o livro eterno.
      - name: teste de patrimônio (pat)
        run: $PSQL -f supabase/tests/23_pat_isolation.sql

      # ⛔ O LIVRO DO LUGAR NÃO SE REESCREVE — no banco aplicado.
      - name: o livro de transferências do pat é eterno
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='pat' and table_name='transfers'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::pat.transfers tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          SI=$($PSQL -tAc "select count(*) from pg_class c
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='pat' and c.relname='asset_locations'
                              and c.reloptions::text like '%security_invoker=true%';")
          [ "$SI" = "1" ] || { echo "::error::pat.asset_locations perdeu security_invoker"; exit 1; }
          # Nenhum enum: a categoria é tabela do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='pat' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema pat"; exit 1; }
          # A vigente NÃO virou coluna — a view é a única fonte dela.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='pat' and table_name='assets'
                              and column_name='current_location';")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de localização vigente em pat.assets — ela é calculada"; exit 1; }
          # A etiqueta continua única por tenant, no banco.
          U=$($PSQL -tAc "select count(*) from pg_indexes
                            where schemaname='pat' and indexname='pat_assets_code_unique';")
          [ "$U" = "1" ] || { echo "::error::o índice único da etiqueta sumiu"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='pat' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema pat"; exit 1; }

      - name: o décimo oitavo cartão (pat) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='pat';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo pat declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "pat no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 19 NO BANCO: a prancheta congelada por cópia,
      # a resposta-ato e a conclusão que exige tudo respondido.
      - name: teste de checklists (chk)
        run: $PSQL -f supabase/tests/24_chk_isolation.sql

      # ⛔ A PRANCHETA É DO GATILHO — no banco aplicado.
      - name: a prancheta do chk não se escreve à mão
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='chk' and table_name='run_items'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT,UPDATE" ] || { echo "::error::chk.run_items tem privilégios além de SELECT,UPDATE: [$G]"; exit 1; }
          # Nenhum enum: a resposta é CHECK argumentado; o modelo é do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='chk' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema chk"; exit 1; }
          # A cópia continua por VALOR: nenhuma FK da prancheta para o desenho.
          F=$($PSQL -tAc "select count(*) from information_schema.table_constraints tc
                            join information_schema.constraint_column_usage ccu
                              on ccu.constraint_name = tc.constraint_name
                           where tc.table_schema='chk' and tc.table_name='run_items'
                             and tc.constraint_type='FOREIGN KEY'
                             and ccu.table_name='template_items';")
          [ "$F" = "0" ] || { echo "::error::apareceu FK da prancheta para o item de origem — a cópia é por valor"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='chk' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema chk"; exit 1; }

      - name: o décimo nono cartão (chk) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='chk';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo chk declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "chk no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 20 NO BANCO: a exclusion recusa o conflito, a
      # cancelada libera sozinha e o passado entra.
      - name: teste de espaços (spc)
        run: $PSQL -f supabase/tests/25_spc_isolation.sql

      # ⛔ A FÍSICA MORA NA CONSTRAINT — no banco aplicado.
      - name: a exclusion do spc está em vigor
        run: |
          X=$($PSQL -tAc "select count(*) from pg_constraint c
                            join pg_namespace n on n.oid=c.connamespace
                           where n.nspname='spc' and c.conname='spc_reservations_no_overlap'
                             and c.contype='x';")
          [ "$X" = "1" ] || { echo "::error::a exclusion constraint do spc sumiu — o conflito virou sorte"; exit 1; }
          # E é PARCIAL: a cancelada libera o período sozinha.
          P=$($PSQL -tAc "select count(*) from pg_constraint c
                            join pg_namespace n on n.oid=c.connamespace
                           where n.nspname='spc' and c.conname='spc_reservations_no_overlap'
                             and pg_get_constraintdef(c.oid) ilike '%booked%';")
          [ "$P" = "1" ] || { echo "::error::a exclusion deixou de ser parcial — cancelada não libera mais"; exit 1; }
          # Nenhum enum no schema.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='spc' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema spc"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='spc' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema spc"; exit 1; }

      - name: o vigésimo cartão (spc) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='spc';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo spc declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "spc no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 21 NO BANCO: carimbos do servidor, registro sem
      # rasura, passagem única — e o documento fora do envelope.
      - name: teste de visitas (vis)
        run: $PSQL -f supabase/tests/26_vis_isolation.sql

      # ⛔ O DOCUMENTO NÃO PASSEIA PELO CORREIO — no banco aplicado.
      - name: o envelope do vis não carrega dado pessoal
        run: |
          P=$($PSQL -tAc "select prosrc from pg_proc p
                            join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='vis' and p.proname='visit_payload';")
          echo "$P" | grep -q "visitor_name" || { echo "::error::o payload perdeu o nome"; exit 1; }
          echo "$P" | grep -q "visitor_document" && { echo "::error::o payload do vis carrega o documento — dado pessoal não passeia"; exit 1; }
          echo "$P" | grep -q "visitor_contact" && { echo "::error::o payload do vis carrega o contato — dado pessoal não passeia"; exit 1; }
          # Nenhum enum no schema.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='vis' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema vis"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='vis' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema vis"; exit 1; }

      - name: o vigésimo primeiro cartão (vis) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='vis';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo vis declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "vis no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 22 NO BANCO: a fila que volta, os desfechos
      # terminais, os vínculos soltos e o contato fora do envelope.
      - name: teste de leads (lead)
        run: $PSQL -f supabase/tests/27_lead_isolation.sql

      # ⛔ O VÍNCULO É SOLTO E O CONTATO FICA — no banco aplicado.
      - name: o lead não conhece o crm nem o deal — e o contato não passeia
        run: |
          F=$($PSQL -tAc "select count(*) from information_schema.table_constraints tc
                            join information_schema.constraint_column_usage ccu
                              on ccu.constraint_name = tc.constraint_name
                           where tc.table_schema='lead' and tc.constraint_type='FOREIGN KEY'
                             and ccu.table_schema in ('crm','deal');")
          [ "$F" = "0" ] || { echo "::error::apareceu FK do lead para crm/deal — o vínculo é solto"; exit 1; }
          P=$($PSQL -tAc "select prosrc from pg_proc p
                            join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='lead' and p.proname='lead_payload';")
          echo "$P" | grep -q "p.source" || { echo "::error::o payload perdeu a origem"; exit 1; }
          echo "$P" | grep -q "p.contact" && { echo "::error::o payload do lead carrega o contato — dado pessoal não passeia"; exit 1; }
          # Nenhum enum: a origem é texto livre.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='lead' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema lead — a origem é texto livre"; exit 1; }
          # A constraint do vínculo-só-no-qualificado está em vigor.
          Q=$($PSQL -tAc "select count(*) from information_schema.check_constraints
                            where constraint_schema='lead' and constraint_name='lead_leads_links_on_qualified';")
          [ "$Q" = "1" ] || { echo "::error::a constraint do vínculo-só-no-qualificado sumiu"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='lead' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema lead"; exit 1; }

      - name: o vigésimo segundo cartão (lead) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='lead';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo lead declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "lead no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 23 NO BANCO: trave congelada, livro eterno,
      # época com número na mesa e o progresso vindo da view.
      - name: teste de metas (goal)
        run: $PSQL -f supabase/tests/28_goal_isolation.sql

      # ⛔ O LIVRO DO ANDAMENTO NÃO SE REESCREVE — no banco aplicado.
      - name: o livro de check-ins do goal é eterno
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='goal' and table_name='checkins'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::goal.checkins tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          SI=$($PSQL -tAc "select count(*) from pg_class c
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='goal' and c.relname='goal_progress'
                              and c.reloptions::text like '%security_invoker=true%';")
          [ "$SI" = "1" ] || { echo "::error::goal.goal_progress perdeu security_invoker"; exit 1; }
          # O progresso NÃO virou coluna.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='goal' and table_name='goals'
                              and column_name in ('progress','current_value','last_value');")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de progresso em goal.goals — ele é calculado"; exit 1; }
          # Nenhum enum: a métrica é texto livre.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='goal' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema goal"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='goal' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema goal"; exit 1; }

      - name: o vigésimo terceiro cartão (goal) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='goal';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo goal declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "goal no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 24 NO BANCO: a palavra congelada, a ciência
      # própria/única/eterna, o arquivo terminal e o corpo fora do envelope.
      - name: teste de comunicados (comm)
        run: $PSQL -f supabase/tests/29_comm_isolation.sql

      # ⛔ A CIÊNCIA NÃO SE RETIRA — no banco aplicado.
      - name: a ciência do comm é própria, única e eterna
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='comm' and table_name='acks'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::comm.acks tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # A unicidade está em vigor: ciência não se dá duas vezes.
          U=$($PSQL -tAc "select count(*) from information_schema.table_constraints
                            where constraint_schema='comm' and constraint_name='comm_acks_once'
                              and constraint_type='UNIQUE';")
          [ "$U" = "1" ] || { echo "::error::sumiu a constraint comm_acks_once — a ciência em dobro entraria"; exit 1; }
          # O corpo NÃO passeia no envelope.
          P=$($PSQL -tAc "select prosrc from pg_proc p
                            join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='comm' and p.proname='notice_payload';")
          echo "$P" | grep -q "p.title" || { echo "::error::o payload do comm perdeu o título"; exit 1; }
          echo "$P" | grep -q "p.body" && { echo "::error::o payload do comm carrega o corpo — o envelope entrega o fato, não o mural"; exit 1; }
          # Nenhum enum: a audiência é texto livre.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='comm' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema comm"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='comm' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema comm"; exit 1; }

      - name: o vigésimo quarto cartão (comm) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='comm';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo comm declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "comm no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 25 NO BANCO: canal do tenant, fluxo desenhado,
      # plano livre sem trilha, fato congelado com a data real.
      - name: teste do calendário editorial (edcal)
        run: $PSQL -f supabase/tests/30_edcal_isolation.sql

      # ⛔ A TRILHA É DOS FATOS — no banco aplicado.
      - name: a trilha do edcal só se lê; o desenho é do tenant
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='edcal' and table_name='piece_events'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || { echo "::error::edcal.piece_events tem privilégios além de SELECT: [$G]"; exit 1; }
          # A ÚNICA porta de DELETE é a das etapas (o desenho é do tenant).
          D=$($PSQL -tAc "select coalesce(string_agg(distinct table_name, ',' order by table_name), '')
                            from information_schema.role_table_grants
                           where table_schema='edcal' and privilege_type='DELETE'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "stages" ] || { echo "::error::a porta de DELETE do edcal deveria ser só stages: [$D]"; exit 1; }
          # O texto de trabalho NÃO passeia no envelope.
          P=$($PSQL -tAc "select prosrc from pg_proc p
                            join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='edcal' and p.proname='piece_payload';")
          echo "$P" | grep -q "p.title" || { echo "::error::o payload do edcal perdeu o título"; exit 1; }
          echo "$P" | grep -q "p.brief" && { echo "::error::o payload do edcal carrega o texto de trabalho — o envelope entrega o fato, não a redação"; exit 1; }
          # Nenhum enum: canal e etapa são DADO do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='edcal' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema edcal"; exit 1; }
          # A flag de aprovação do ops NÃO veio — decisão de canon.
          A=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='edcal' and column_name='requires_approval';")
          [ "$A" = "0" ] || { echo "::error::requires_approval apareceu no edcal — a decisão era NÃO trazê-la (spec §0)"; exit 1; }

      - name: o vigésimo quinto cartão (edcal) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='edcal';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo edcal declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "edcal no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 26 NO BANCO: catálogo honesto, etiqueta viva,
      # livro eterno e a obra que volta do arquivo.
      - name: teste da biblioteca de mídia (media)
        run: $PSQL -f supabase/tests/31_media_isolation.sql

      # ⛔ O LIVRO DE USO NÃO SE RASURA — no banco aplicado.
      - name: o livro do media é eterno; só a etiqueta se desfaz
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='media' and table_name='usages'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::media.usages tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # As ÚNICAS portas de DELETE são as etiquetas (metadado vivo).
          D=$($PSQL -tAc "select coalesce(string_agg(distinct table_name, ',' order by table_name), '')
                            from information_schema.role_table_grants
                           where table_schema='media' and privilege_type='DELETE'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "asset_tags,tags" ] || { echo "::error::a porta de DELETE do media deveria ser só asset_tags,tags: [$D]"; exit 1; }
          # O vínculo do uso é SOLTO: reference_id sem FK.
          F=$($PSQL -tAc "select count(*) from information_schema.key_column_usage
                            where table_schema='media' and table_name='usages'
                              and column_name='reference_id';")
          [ "$F" = "0" ] || { echo "::error::reference_id ganhou FK — o vínculo do uso é solto"; exit 1; }
          # Nenhum enum: tipo é texto livre; etiqueta é tabela do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='media' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema media"; exit 1; }

      - name: o vigésimo sexto cartão (media) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='media';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo media declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "media no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 27 NO BANCO: régua do método, pergunta
      # congelada, livro eterno, placar calculado e anon do lado de fora.
      - name: teste de pesquisas (nps)
        run: $PSQL -f supabase/tests/32_nps_isolation.sql

      # ⛔ A OPINIÃO DADA É A OPINIÃO DADA — no banco aplicado.
      - name: o livro do nps é eterno; o placar é view; anon = nada
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='nps' and table_name='responses'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::nps.responses tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # O placar é VIEW com security_invoker — e NÃO virou coluna.
          SI=$($PSQL -tAc "select count(*) from pg_class c
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='nps' and c.relname='survey_score'
                              and c.reloptions::text like '%security_invoker=true%';")
          [ "$SI" = "1" ] || { echo "::error::nps.survey_score perdeu security_invoker"; exit 1; }
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='nps' and table_name='surveys'
                              and column_name in ('score','nps','average_score');")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de placar em nps.surveys — ele é calculado"; exit 1; }
          # ⛔ anon = NADA: nenhum grant de nada no schema inteiro.
          A=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='nps' and grantee='anon';")
          [ "$A" = "0" ] || { echo "::error::anon ganhou grant no schema nps — o link público é integração futura, não um grant"; exit 1; }
          # Nenhum enum: a régua é CHECK argumentado; a pergunta é do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='nps' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema nps"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='nps' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::alguém concedeu DELETE no schema nps"; exit 1; }

      - name: o vigésimo sétimo cartão (nps) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='nps';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo nps declara $C consumo(s) — sem handler, sem promessa (Lei 7)"
            exit 1; }
          echo "nps no catálogo com consumes vazio."

      # ⭐ A PROVA DO MÓDULO 28 NO BANCO: centro do tenant, regra a 100%,
      # rateio sem perda de centavo, livro imutável.
      - name: teste de centros de custo (cc)
        run: $PSQL -f supabase/tests/33_cc_isolation.sql

      # ⛔ O LIVRO DE RATEIO NÃO SE ESCREVE À MÃO — no banco aplicado.
      - name: o livro do cc é só leitura; a física do 100% está de pé
        run: |
          for T in executions allocations; do
            G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                              from information_schema.role_table_grants
                             where table_schema='cc' and table_name='$T'
                               and grantee in ('anon','authenticated','PUBLIC');")
            [ "$G" = "SELECT" ] || { echo "::error::cc.$T tem privilégios além de SELECT: [$G]"; exit 1; }
          done
          # A física do 100% está no porteiro da regra.
          P=$($PSQL -tAc "select prosrc from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='cc' and p.proname='guard_rule_transition';")
          echo "$P" | grep -q "10000" || { echo "::error::a física do 100% saiu do porteiro do cc"; exit 1; }
          # A origem do rateio é id solto: source_ref sem FK.
          F=$($PSQL -tAc "select count(*) from information_schema.key_column_usage
                            where table_schema='cc' and table_name='executions' and column_name='source_ref';")
          [ "$F" = "0" ] || { echo "::error::source_ref ganhou FK — a origem do rateio é id solto"; exit 1; }
          # Nenhum enum: centro é dado do tenant.
          E=$($PSQL -tAc "select count(*) from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='cc' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema cc"; exit 1; }
          # Só rule_lines tem DELETE (o desenho é do tenant).
          D=$($PSQL -tAc "select coalesce(string_agg(distinct table_name, ',' order by table_name), '')
                            from information_schema.role_table_grants
                           where table_schema='cc' and privilege_type='DELETE'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "rule_lines" ] || { echo "::error::a porta de DELETE do cc deveria ser só rule_lines: [$D]"; exit 1; }

      - name: o vigésimo oitavo cartão (cc) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='cc';")
          [ "$C" = "0" ] || { echo "::error::o módulo cc declara $C consumo(s) — sem handler, sem promessa (Lei 7)"; exit 1; }
          echo "cc no catálogo com consumes vazio."

      # ⭐⭐ A PROVA DO MÓDULO 29 NO BANCO: a trave que congela ao ativar, o
      # realizado calculado do livro projetado, a projeção só service_role.
      - name: teste de orçamentos (bud)
        run: $PSQL -f supabase/tests/34_bud_isolation.sql

      # ⭐ O REALIZADO É VIEW, NUNCA COLUNA — no banco aplicado.
      - name: o realizado do bud é calculado, e a projeção não é do cliente
        run: |
          # Nenhuma coluna de realizado/saldo em tabela — só a view calcula.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='bud'
                              and table_name in ('budgets','realized_movements')
                              and column_name in ('realized_cents','remaining_cents');")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de realizado/saldo no bud — é view, nunca coluna"; exit 1; }
          # A view existe e é security_invoker (não soma o gasto de outro tenant).
          V=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='bud' and c.relname='budget_realized' and c.relkind='v';")
          [ "$V" = "1" ] || { echo "::error::a view bud.budget_realized sumiu"; exit 1; }
          SI=$($PSQL -tAc "select c.reloptions::text from pg_class c join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='bud' and c.relname='budget_realized';")
          echo "$SI" | grep -q "security_invoker=true" || { echo "::error::bud.budget_realized não é security_invoker"; exit 1; }
          # ⛔ A projeção é só leitura para o cliente: só SELECT em realized_movements.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='bud' and table_name='realized_movements'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || { echo "::error::bud.realized_movements tem privilégios além de SELECT: [$G]"; exit 1; }
          # A categoria é texto livre — nenhum enum no schema bud.
          E=$($PSQL -tAc "select count(*) from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='bud' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema bud — a categoria é dado do tenant"; exit 1; }
          # Sem porta de DELETE no bud — fecha-se o período, não se apaga.
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                           where table_schema='bud' and privilege_type='DELETE'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "0" ] || { echo "::error::apareceu DELETE no bud — o período fecha, não se apaga"; exit 1; }

      # ⭐⭐ O 29º cartão consome cash.entry.registered — e NÃO é vazio. A Lei 7
      # no sentido oposto: o consumo declarado TEM handler (realized.ts).
      - name: o vigésimo nono cartão (bud) consome cash.entry.registered
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='bud';")
          [ "$C" = "1" ] || { echo "::error::o módulo bud deveria declarar 1 consumo (cash.entry.registered): [$C]"; exit 1; }
          T=$($PSQL -tAc "select events_consumes->0->>'type'
                            from core.module_registry where module_id='bud';")
          [ "$T" = "cash.entry.registered" ] || { echo "::error::o consumo do bud deveria ser cash.entry.registered: [$T]"; exit 1; }
          echo "bud no catálogo consumindo cash.entry.registered — com handler."

      # ⭐ A PROVA DO MÓDULO 30 NO BANCO: conta do tenant, livro imutável, saldo
      # que pode ser negativo (cheque especial) e a transferência atômica.
      - name: teste de contas bancárias (bank)
        run: $PSQL -f supabase/tests/35_bank_isolation.sql

      # ⭐ O SALDO É VIEW E PODE SER NEGATIVO; A CONCILIAÇÃO NÃO SE REFAZ.
      - name: o saldo do bank é calculado (e negativo permitido); SOL ÚNICO
        run: |
          # Nenhuma coluna de saldo — só a view calcula.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='bank'
                              and table_name in ('accounts','movements')
                              and column_name='balance_cents';")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de saldo no bank — é view, nunca coluna"; exit 1; }
          V=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='bank' and c.relname='balances' and c.relkind='v';")
          [ "$V" = "1" ] || { echo "::error::a view bank.balances sumiu"; exit 1; }
          SI=$($PSQL -tAc "select c.reloptions::text from pg_class c join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='bank' and c.relname='balances';")
          echo "$SI" | grep -q "security_invoker=true" || { echo "::error::bank.balances não é security_invoker"; exit 1; }
          # ⭐ Nenhuma constraint contra saldo negativo — cheque especial.
          B=$($PSQL -tAc "select count(*) from pg_constraint con join pg_namespace n on n.oid=con.connamespace
                           where n.nspname='bank' and pg_get_constraintdef(con.oid) ilike '%balance%>= 0%';")
          [ "$B" = "0" ] || { echo "::error::apareceu constraint contra saldo negativo — cheque especial é legítimo"; exit 1; }
          # ⛔ O livro é só SELECT/INSERT para o cliente — editar/apagar não existem.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='bank' and table_name='movements'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::bank.movements tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # A transferência é uma função (atômica), não um par de inserts na tela.
          F=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='bank' and p.proname='transfer';")
          [ "$F" = "1" ] || { echo "::error::a função bank.transfer sumiu — a transferência tem de ser atômica"; exit 1; }
          # SOL ÚNICO: o módulo não refaz a conciliação.
          M=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='bank' and c.relname ilike '%match%';")
          [ "$M" = "0" ] || { echo "::error::apareceu tabela de casamento no bank — a conciliação é do recon (Sol Único)"; exit 1; }

      - name: o trigésimo cartão (bank) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='bank';")
          [ "$C" = "0" ] || { echo "::error::o módulo bank declara $C consumo(s) — SOL ÚNICO, conciliação é do recon (Lei 7)"; exit 1; }
          echo "bank no catálogo com consumes vazio."

      # ⭐⭐ A PROVA DO MÓDULO 31 NO BANCO: livro de atos, posição sem cotação e
      # a terceira resposta (resgate não passa da posição).
      - name: teste de investimentos (invest)
        run: $PSQL -f supabase/tests/36_invest_isolation.sql

      # ⭐ A POSIÇÃO É VIEW SEM COTAÇÃO; O RESGATE CONFERE A POSIÇÃO.
      - name: a posição do invest é calculada, sem cotação; o resgate é barrado
        run: |
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='invest'
                              and table_name in ('holdings','movements')
                              and column_name='position_cents';")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de posição no invest — é view, nunca coluna"; exit 1; }
          V=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='invest' and c.relname='positions' and c.relkind='v';")
          [ "$V" = "1" ] || { echo "::error::a view invest.positions sumiu"; exit 1; }
          SI=$($PSQL -tAc "select c.reloptions::text from pg_class c join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='invest' and c.relname='positions';")
          echo "$SI" | grep -q "security_invoker=true" || { echo "::error::invest.positions não é security_invoker"; exit 1; }
          # ⭐ SEM COTAÇÃO: nenhuma coluna de taxa/preço de mercado.
          Q=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='invest'
                             and column_name in ('rate','market_price','quote_cents','benchmark');")
          [ "$Q" = "0" ] || { echo "::error::apareceu cotação no invest — a posição é a soma dos atos (Lei 3/7)"; exit 1; }
          # ⭐⭐ O gatilho confere a posição no resgate (a terceira resposta).
          G=$($PSQL -tAc "select prosrc from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='invest' and p.proname='guard_movement';")
          echo "$G" | grep -q "excede a posição" || { echo "::error::o gatilho do invest não barra resgate além da posição"; exit 1; }
          # ⛔ O livro é só SELECT/INSERT para o cliente.
          L=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='invest' and table_name='movements'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$L" = "INSERT,SELECT" ] || { echo "::error::invest.movements tem privilégios além de INSERT,SELECT: [$L]"; exit 1; }

      - name: o trigésimo primeiro cartão (invest) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='invest';")
          [ "$C" = "0" ] || { echo "::error::o módulo invest declara $C consumo(s) — rendimento é ato de gente (Lei 7)"; exit 1; }
          echo "invest no catálogo com consumes vazio."

      # ⭐⭐ A PROVA DO MÓDULO 32 NO BANCO: plano do tenant, valores dos dois
      # livros, resultado calculado e a linha sem lançamento que não aparece.
      - name: teste de DRE gerencial (dre)
        run: $PSQL -f supabase/tests/37_dre_isolation.sql

      # ⭐ TOTAIS SÃO VIEWS; NÃO É FISCAL; LINHA VAZIA NÃO APARECE.
      - name: os totais do dre são views; não é fiscal; inner join
        run: |
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='dre'
                              and table_name in ('lines','realized_entries')
                              and column_name in ('result_cents','revenue_cents','total_cents');")
          [ "$C" = "0" ] || { echo "::error::apareceu coluna de total no dre — os totais são views"; exit 1; }
          for V in statement result; do
            OK=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                             where n.nspname='dre' and c.relname='$V' and c.relkind='v';")
            [ "$OK" = "1" ] || { echo "::error::a view dre.$V sumiu"; exit 1; }
            SI=$($PSQL -tAc "select c.reloptions::text from pg_class c join pg_namespace n on n.oid=c.relnamespace
                              where n.nspname='dre' and c.relname='$V';")
            echo "$SI" | grep -q "security_invoker=true" || { echo "::error::dre.$V não é security_invoker"; exit 1; }
          done
          # ⭐ INNER JOIN na statement — linha sem lançamento não aparece (nps).
          DEF=$($PSQL -tAc "select pg_get_viewdef((select c.oid from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='dre' and c.relname='statement'));")
          echo "$DEF" | grep -qi "left join" && { echo "::error::dre.statement usa LEFT JOIN — linha vazia apareceria (nps)"; exit 1; } || true
          # ⛔ NÃO é fiscal.
          M=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='dre' and (column_name ilike '%sped%' or column_name ilike '%ecd%');")
          [ "$M" = "0" ] || { echo "::error::apareceu coluna fiscal no dre — é gerencial (Lei 3)"; exit 1; }
          # ⛔ A projeção é só leitura para o cliente.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='dre' and table_name='realized_entries'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || { echo "::error::dre.realized_entries tem privilégios além de SELECT: [$G]"; exit 1; }

      # ⭐⭐ O 32º cartão consome DOIS tipos — cash.entry.registered e cc.rateio.executed.
      - name: o trigésimo segundo cartão (dre) consome cash E cc
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='dre';")
          [ "$C" = "2" ] || { echo "::error::o módulo dre deveria declarar 2 consumos: [$C]"; exit 1; }
          T=$($PSQL -tAc "select string_agg(value->>'type', ',' order by value->>'type')
                            from core.module_registry, jsonb_array_elements(events_consumes)
                           where module_id='dre';")
          [ "$T" = "cash.entry.registered,cc.rateio.executed" ] || { echo "::error::os consumos do dre deveriam ser cash.entry.registered,cc.rateio.executed: [$T]"; exit 1; }
          echo "dre no catálogo consumindo cash.entry.registered e cc.rateio.executed — com handler."

      # =====================================================================
      # ⭐ MISSÃO OITO — o BLOCO DE PESSOAS no banco (Módulos 33–37)
      # =====================================================================
      - name: teste de colaboradores (hr)
        run: $PSQL -f supabase/tests/38_hr_isolation.sql

      - name: teste de escalas (shift)
        run: $PSQL -f supabase/tests/39_shift_isolation.sql

      - name: teste de treinamentos (train)
        run: $PSQL -f supabase/tests/40_train_isolation.sql

      - name: teste de avaliação (perf)
        run: $PSQL -f supabase/tests/41_perf_isolation.sql

      - name: teste de políticas (pol)
        run: $PSQL -f supabase/tests/42_pol_isolation.sql

      # ⭐ A física do shift é EXCLUSION sobre o COLABORADOR (não o espaço).
      - name: a escala do shift é exclusion parcial sobre o colaborador
        run: |
          E=$($PSQL -tAc "select pg_get_constraintdef(c.oid) from pg_constraint c
                            join pg_class t on t.oid=c.conrelid
                            join pg_namespace n on n.oid=t.relnamespace
                           where n.nspname='shift' and c.contype='x';")
          echo "$E" | grep -q "employee_id" || { echo "::error::a exclusion do shift não é sobre o colaborador"; exit 1; }
          echo "$E" | grep -q "scheduled" || { echo "::error::a exclusion do shift não é parcial (cancelada libera)"; exit 1; }

      # ⭐ A avaliação do perf é imutável (nem UPDATE nem DELETE concedidos).
      - name: a avaliação do perf é imutável
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='perf' and table_name='reviews' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::perf.reviews tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }

      # ⭐ A ciência do pol é por VERSÃO (unique version_id,user_id) — o DIVERGE do comm.
      - name: a ciência do pol é por versão, não por documento
        run: |
          U=$($PSQL -tAc "select count(*) from pg_constraint c
                            join pg_class t on t.oid=c.conrelid
                            join pg_namespace n on n.oid=t.relnamespace
                           where n.nspname='pol' and t.relname='acknowledgements' and c.contype='u'
                             and pg_get_constraintdef(c.oid) ilike '%version_id%user_id%';")
          [ "$U" = "1" ] || { echo "::error::a ciência do pol não é unique por (version_id,user_id) — o DIVERGE do comm sumiu"; exit 1; }
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='pol' and table_name='acknowledgements' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::pol.acknowledgements tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }

      # ⭐ Os cinco cartões da onda têm consumes VAZIO (Lei 7).
      - name: os cinco módulos do Bloco de Pessoas têm consumes vazio
        run: |
          for M in hr shift train perf pol; do
            C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='$M';")
            [ "$C" = "0" ] || { echo "::error::o módulo $M deveria ter consumes vazio: [$C]"; exit 1; }
          done
          echo "hr·shift·train·perf·pol — consumes vazio, sem handler (Lei 7)."

      - name: nenhuma porta de DELETE em quote.proposals
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='quote' and table_name='proposals'
                              and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em quote.proposals — retirar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='quote' and c.relname='proposals' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em quote.proposals"; exit 1; }

      - name: o nono cartão (quote) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='quote';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo quote declara $C consumo(s) — aceite→título está NÃO CONSTRUÍDO (spec §5)"
            exit 1; }
          echo "quote no catálogo com consumes vazio."

      - name: o oitavo cartão (inv) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='inv';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo inv declara $C consumo(s) — o caminho po→inv está NÃO CONSTRUÍDO (spec §5)"
            exit 1; }
          echo "inv no catálogo com consumes vazio."

      # ⭐⭐ A LEI DAS ETAPAS, CONFERIDA NO BANCO APLICADO.
      #
      # Nenhum tipo enumerado no schema `ops`. Se alguém "padronizar" as etapas
      # num `create type`, o produto passa a vender o processo de um cliente
      # para todos — e é a coisa mais fácil de fazer com boa intenção.
      - name: nenhuma etapa virou enum no banco
        run: |
          T=$($PSQL -tAc "select coalesce(string_agg(t.typname, ','), '')
                            from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='ops' and t.typtype='e';")
          [ -z "$T" ] || { echo "::error::nasceram tipos enumerados em ops: $T — a etapa é dado do tenant"; exit 1; }
          # E a tabela que sustenta a lei existe, com as duas colunas de desenho.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='ops' and table_name='pipeline_stages'
                             and column_name in ('name','position','requires_approval','skippable');")
          [ "$C" = "4" ] || { echo "::error::ops.pipeline_stages perdeu uma das colunas do desenho"; exit 1; }

      # ⛔ A TRILHA NÃO TEM PORTA DE ESCRITA — nem para inventar movimento.
      #
      # É a garantia que as outras tabelas imutáveis do repositório não têm:
      # `crm.interactions` aceita INSERT direto (o fato É o dado); aqui não,
      # porque o movimento tem de passar pela função que confere a permissão do
      # ato ANTES de registrá-lo.
      - name: nenhuma porta de escrita em ops.order_events
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ','), '')
                            from information_schema.role_table_grants
                           where table_schema='ops' and table_name='order_events'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || {
            echo "::error::ops.order_events tem privilégios além de SELECT para o cliente: [$G]"; exit 1; }
          P=$($PSQL -tAc "select coalesce(string_agg(p.polcmd::text, ','), '') from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='ops' and c.relname='order_events';")
          [ "$P" = "r" ] || { echo "::error::a trilha ganhou policy além de SELECT: [$P]"; exit 1; }
          # E o entregável: só SELECT e INSERT. Refazer é versão nova.
          D=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='ops' and table_name='deliverables'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "INSERT,SELECT" ] || {
            echo "::error::ops.deliverables tem privilégios além de INSERT/SELECT: [$D]"; exit 1; }

      # ⛔ A ÚNICA porta de DELETE do módulo é a da ETAPA — e a OS a segura.
      #
      # Redesenhar a esteira é tentativa e erro, e por isso a etapa se apaga. O
      # contrapeso é a chave `restrict` de `ops.orders`: a etapa onde há OS
      # parada NÃO se apaga. As duas coisas juntas, ou a lei vira buraco.
      - name: só a etapa tem DELETE, e a OS a protege
        run: |
          for T in pipelines orders order_events deliverables; do
            G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                              where table_schema='ops' and table_name='$T'
                                and privilege_type='DELETE'
                                and grantee in ('anon','authenticated','PUBLIC');")
            [ "$G" = "0" ] || { echo "::error::ops.$T ganhou porta de DELETE"; exit 1; }
          done
          A=$($PSQL -tAc "select confdeltype from pg_constraint
                           where conname='orders_stage_fk';")
          [ "$A" = "r" ] || {
            echo "::error::orders_stage_fk não é RESTRICT ([$A]) — apagar a etapa deixaria OS sem etapa"; exit 1; }

      # ⭐ O CATÁLOGO TEM CINCO CARTÕES, e o quinto consome ZERO.
      #
      # Lei 7: só declara consumo com handler. O ciclo fechou (`0012`/`0013` +
      # recon-settlement.ts): AR escuta `recon.match.decided`. Esta guarda
      # exige exatamente esse consumo — e só ele.
      - name: o quinto cartão declara a baixa que o handler cobre
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='ar';")
          [ "$C" = "1" ] || {
            echo "::error::o módulo ar declara $C consumo(s) — esperado 1 (recon.match.decided)"
            exit 1; }
          T=$($PSQL -tAc "select events_consumes->0->>'type'
                            from core.module_registry where module_id='ar';")
          [ "$T" = "recon.match.decided" ] || {
            echo "::error::consumo do ar é '$T' — esperado recon.match.decided"
            exit 1; }
          echo "ciclo fechado no catálogo: ar consome recon.match.decided."

      - name: o sexto cartão (po) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='po';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo po declara $C consumo(s) — esperado 0 (protocolo paralelo)"
            exit 1; }
          echo "po no catálogo com consumes vazio."

      # ⛔ A INTERAÇÃO É IMUTÁVEL, CONFERIDA NO BANCO APLICADO.
      #
      # Fato consumado não se edita. A decisão vive em três camadas, e esta
      # guarda confere as duas que são de privilégio — no banco, não no
      # arquivo: é a diferença entre a regra escrita e a regra em vigor.
      - name: nenhuma porta de escrita em crm.interactions
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(privilege_type, ','), '')
                            from information_schema.role_table_grants
                           where table_schema='crm' and table_name='interactions'
                             and privilege_type in ('UPDATE','DELETE')
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ -z "$G" ] || { echo "::error::alguém concedeu $G em crm.interactions — fato consumado não se edita"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and c.relname='interactions'
                             and p.polcmd in ('w','d');")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de UPDATE/DELETE em crm.interactions"; exit 1; }
          # E a terceira camada, que protege de nós mesmos: o gatilho que
          # recusa até para o dono do banco.
          T=$($PSQL -tAc "select count(*) from pg_trigger t
                            join pg_class c on c.oid=t.tgrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and c.relname='interactions'
                             and t.tgname='interactions_immutable' and not t.tgisinternal;")
          [ "$T" = "1" ] || { echo "::error::o gatilho de imutabilidade sumiu de crm.interactions"; exit 1; }
          echo "crm.interactions continua imutável nas três camadas."

      # ⛔ ARQUIVAR É ESTADO, NUNCA DELETE — nas duas tabelas do módulo.
      - name: nenhuma porta de DELETE em crm
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='crm' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em crm ao cliente"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em crm"; exit 1; }

      # ⭐ O CATÁLOGO TEM QUATRO CARTÕES, e o quarto consome ZERO.
      #
      # Não é enfeite: é a Lei 7 conferida no banco. Se alguém declarar consumo
      # no seed sem handler construído, a Store passa a anunciar uma integração
      # que não acontece — e ninguém veria erro nenhum.
      - name: o catálogo conta a verdade sobre quem consome o quê
        run: |
          $PSQL -c "select module_id, status,
                           jsonb_array_length(events_emits)    as emite,
                           jsonb_array_length(events_consumes) as consome
                      from core.module_registry order by module_id;"
          # ⚠️ **CONTA OS MÓDULOS REAIS, não a tabela inteira** — e a distinção
          # custou uma falha antes de entrar.
          #
          # `04_install_module.sql` insere módulos FICTÍCIOS no catálogo para
          # provar o instalador: um `rascunho` (para provar que draft não
          # aparece na vitrine) e um `terceiro` publicado (para provar o teto do
          # plano). Uma contagem ingênua de `status='published'` daria 7 e
          # reprovaria o repositório inteiro, por causa do fixture de outro
          # teste.
          #
          # Só apareceu porque os números foram conferidos contra o banco.
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where status='published'
                             and module_id in ('recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol');")
          [ "$N" = "32" ] || { echo "::error::o catálogo tem $N dos 32 módulos reais publicados"; exit 1; }
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='crm';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo crm declara $C consumo(s) no catálogo — e o handler não existe (Lei 7)"
            exit 1; }

      # ⛔ CANCELAR É ESTADO, NUNCA DELETE.
      #
      # Um título apagado é conta paga sem documento. A decisão está em duas
      # camadas — sem GRANT e sem policy — e esta guarda confere as duas no
      # BANCO APLICADO, não no arquivo: é a diferença entre a regra escrita e a
      # regra em vigor.
      - name: nenhuma porta de DELETE em ap.payables
        run: |
          # ⚠️ FILTRA O GRANTEE, e a primeira versão desta guarda não filtrava —
          # teria reprovado o repositório inteiro no primeiro run.
          #
          # `information_schema.role_table_grants` inclui os privilégios
          # IMPLÍCITOS do dono da tabela, e o dono sempre tem todos, inclusive
          # DELETE. Não há como tirar, e não faz sentido tentar: a regra é que o
          # CLIENTE não tem porta de DELETE, não que ninguém no banco tenha.
          #
          # Foi o único defeito que a contagem contra o banco revelou — e é
          # exatamente por isso que os números vêm do banco, nunca de cabeça.
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='ap' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em ap ao cliente — cancelar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='ap' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em ap"; exit 1; }
          echo "ap.payables continua sem porta de DELETE."

      - name: nenhuma porta de DELETE em po.orders
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='po' and table_name='orders'
                              and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em po.orders — cancelar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='po' and c.relname='orders' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em po.orders"; exit 1; }
          echo "po.orders continua sem porta de DELETE."

      # ⛔ O SEED NÃO CONCEDE PERMISSÃO DE MÓDULO.
      #
      # Ele concedia, ao papel de SISTEMA `admin`, como ponte até o instalador
      # existir. Papel de sistema vale em TODO tenant: qualquer tenant novo já
      # nascia com os módulos, sem instalar e sem ocupar vaga no plano.
      #
      # O instalador nasceu e a ponte saiu. Esta guarda existe para que ela não
      # volte por conveniência — o sintoma seria invisível com um tenant só.
      - name: nenhuma permissão de módulo em papel de sistema
        run: |
          VAZOU=$($PSQL -tAc "
            select coalesce(string_agg(permission_key, ', '), '')
              from core.role_permissions
             where tenant_id is null and module_id <> 'core';")
          [ -z "$VAZOU" ] || {
            echo "::error::o seed concedeu permissão de módulo a papel de sistema: $VAZOU"
            echo "isso vaza o módulo para TODO tenant, sem instalar e sem ocupar vaga no plano"
            exit 1; }
          echo "nenhum vazamento: permissão de módulo só existe onde alguém instalou."

      - name: a visão de saúde da fila responde
        run: |
          $PSQL -c "select * from core.courier_health order by status;"
          VEREDITO=$($PSQL -tAc "select veredito from core.courier_status();")
          echo "veredito: $VEREDITO"
          case "$VEREDITO" in
            OK|ATRASADO|PARADO|ATENCAO) ;;
            *) echo "::error::core.courier_status() devolveu algo inesperado: $VEREDITO"; exit 1 ;;
          esac
          # Nem a visão nem a função podem estar abertas: operação é assunto
          # de quem opera, e `core.event_outbox` não tem policy nenhuma.
          ABERTO=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                                where grantee in ('anon','authenticated')
                                  and table_name = 'courier_health';")
          [ "$ABERTO" = "0" ] || { echo "::error::a visão de saúde está exposta a $ABERTO papel(is)"; exit 1; }

      # ⭐ E A LEITURA DO PAINEL É ESTREITA — a global CONTINUA fechada.
      #
      # O jeito de o Painel Executivo (Etapa 15) nascer errado é um `grant
      # execute on function core.courier_status() to authenticated` — uma linha
      # que resolveria a tela e vazaria o volume de negócio dos vizinhos: um
      # cliente saberia, pelo número de pendentes, quando outro está
      # importando um extrato grande. A resposta certa foi função NOVA.
      - name: a saúde global continua fechada; a do tenant é estreita
        run: |
          for FN in courier_status tenant_courier_view; do
            ABERTA=$($PSQL -tAc "
              select count(*) from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
               where n.nspname='core' and p.proname='$FN'
                 and (has_function_privilege('authenticated', p.oid, 'execute')
                   or has_function_privilege('anon', p.oid, 'execute'));")
            [ "$ABERTA" = "0" ] || { echo "::error::core.$FN() está concedida — ela conta a fila de TODOS"; exit 1; }
          done

          for FN in tenant_courier_summary tenant_plan_usage; do
            OK=$($PSQL -tAc "
              select count(*) from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
               where n.nspname='core' and p.proname='$FN'
                 and has_function_privilege('authenticated', p.oid, 'execute');")
            [ "$OK" = "1" ] || { echo "::error::core.$FN() não está disponível ao tenant — o Painel não carrega"; exit 1; }
          done

          # ⛔ E a checagem de vínculo é a PRIMEIRA linha das três: função
          # `security definer` que confia no uuid recebido é RLS desligada com
          # outro nome.
          for FN in tenant_courier_view tenant_plan_usage; do
            $PSQL -tAc "select prosrc from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                         where n.nspname='core' and p.proname='$FN';" \
              | grep -q 'is_tenant_member' \
              || { echo "::error::core.$FN() não confere o vínculo do chamador"; exit 1; }
          done
          echo "o tenant vê o veredito e os números dele. A fila do vizinho, não."

      # ⛔ NENHUMA FUNÇÃO CHAMÁVEL POR QUEM NÃO FEZ LOGIN.
      #
      # Tabela nasce fechada; **função nasce ABERTA a `PUBLIC`**. Toda função
      # criada depois do `revoke ... on all functions` do seu schema herda esse
      # privilégio e ninguém percebe, porque o `grant` escrito logo abaixo dá a
      # impressão de que ele é a autorização — quando na verdade é decoração.
      #
      # ⚠️ Esta guarda existe porque a de cima MENTIU: a sabotagem "apagar o
      # grant do consumo do plano" passou verde. Ver `0022_revoke_public_execute.sql`.
      - name: nenhuma função de negócio aberta a anon
        run: |
          ABERTAS=$($PSQL -tAc "
            select coalesce(string_agg(n.nspname||'.'||p.proname, ', ' order by p.proname), '')
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol')
               and has_function_privilege('anon', p.oid, 'execute');")
          [ -z "$ABERTAS" ] || { echo "::error::função executável por anon: $ABERTAS"; exit 1; }

          # E o que o portal chama de verdade continua chamável — a guarda de
          # segurança não pode fechar a porta do cliente junto.
          for FN in install_module uninstall_module advance_order skip_stage send_back_order \
                    tenant_courier_summary tenant_plan_usage; do
            OK=$($PSQL -tAc "
              select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
               where p.proname = '$FN'
                 and n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol')
                 and has_function_privilege('authenticated', p.oid, 'execute');")
            [ "$OK" -ge 1 ] || { echo "::error::$FN() deixou de ser chamável pelo portal"; exit 1; }
          done
          echo "anon não executa nada; o portal continua executando o que precisa."

  correio:
    name: o correio contra Postgres de verdade
    runs-on: ubuntu-latest

    # ⭐ ESTE JOB EXISTE PORQUE MEMÓRIA NÃO PROVA CONCORRÊNCIA.
    #
    # Até a Etapa 7, todas as garantias do correio foram provadas contra um
    # `OutboxStore` de memória. Contra Postgres apareceram DOIS defeitos que o
    # mock não podia revelar:
    #
    #   1. a tomada não reivindicava nada — dois entregadores pegavam os
    #      mesmos eventos;
    #   2. um handler que falhava nunca era reexecutado, e o evento acabava
    #      gravado como `delivered` sem nunca ter sido entregue.
    #
    # Este job é o que impede que voltem.

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_correio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_correio
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bos_correio

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: montar o banco
        run: |
          $PSQL -q -f supabase/tests/00_supabase_shim.sql
          $PSQL -q -f supabase/migrations/0001_core.sql
          $PSQL -q -f supabase/migrations/0002_recon.sql
          $PSQL -q -f supabase/migrations/0003_billing.sql
          $PSQL -q -f supabase/migrations/0004_marketing.sql
          $PSQL -q -f supabase/migrations/0005_courier_cron.sql
          $PSQL -q -f supabase/migrations/0006_install.sql
          $PSQL -q -f supabase/migrations/0007_ap.sql
          $PSQL -q -f supabase/migrations/0008_recon_ap_projection.sql
          $PSQL -q -f supabase/migrations/0009_crm.sql
          $PSQL -q -f supabase/migrations/0010_ar.sql
          $PSQL -q -f supabase/migrations/0011_recon_receivables.sql
          $PSQL -q -f supabase/migrations/0012_recon_match_decided.sql
          $PSQL -q -f supabase/migrations/0013_ar_apply_recon_match.sql
          $PSQL -q -f supabase/migrations/0014_ap_apply_recon_match.sql
          $PSQL -q -f supabase/migrations/0017_po.sql
          # ⚠️ **ESTA LISTA É A SEGUNDA, e foi ela que quebrou na Etapa 15.**
          #
          # O job de schema aplica a cadeia inteira; este monta o banco com
          # uma lista PRÓPRIA, porque só precisa do que os testes de `apps/api`
          # tocam. O problema é que "o que os testes tocam" cresce sem avisar:
          # a Etapa 14 acrescentou `forge-service.test.ts`, que grava em
          # `core.ai_generations` — e a tabela nasce no `0019`, que não estava
          # aqui. O CI reprovou com `relation "core.ai_generations" does not
          # exist`, repetido em cada teste.
          #
          # Migration nova que crie objeto do Core entra NAS DUAS listas.
          $PSQL -q -f supabase/migrations/0018_ops.sql
          $PSQL -q -f supabase/migrations/0019_forge.sql
          $PSQL -q -f supabase/migrations/0020_ops_machine_draft.sql
          $PSQL -q -f supabase/migrations/0021_tenant_panel.sql
          $PSQL -q -f supabase/migrations/0022_revoke_public_execute.sql
          $PSQL -q -f supabase/migrations/0023_inv.sql
          $PSQL -q -f supabase/migrations/0024_quote.sql
          $PSQL -q -f supabase/migrations/0025_deal.sql
          $PSQL -q -f supabase/migrations/0026_evt.sql
          $PSQL -q -f supabase/migrations/0027_dun.sql
          $PSQL -q -f supabase/migrations/0028_ctr.sql
          $PSQL -q -f supabase/migrations/0029_cash.sql
          $PSQL -q -f supabase/migrations/0030_care.sql
          $PSQL -q -f supabase/migrations/0031_occ.sql
          $PSQL -q -f supabase/migrations/0032_mnt.sql
          $PSQL -q -f supabase/migrations/0033_pat.sql
          $PSQL -q -f supabase/migrations/0034_chk.sql
          $PSQL -q -f supabase/migrations/0035_spc.sql
          $PSQL -q -f supabase/migrations/0036_vis.sql
          $PSQL -q -f supabase/migrations/0037_lead.sql
          $PSQL -q -f supabase/migrations/0038_goal.sql
          $PSQL -q -f supabase/migrations/0039_comm.sql
          $PSQL -q -f supabase/migrations/0040_edcal.sql
          $PSQL -q -f supabase/migrations/0041_media.sql
          $PSQL -q -f supabase/migrations/0042_nps.sql
          $PSQL -q -f supabase/migrations/0043_cc.sql
          $PSQL -q -f supabase/migrations/0044_bud.sql
          $PSQL -q -f supabase/migrations/0045_bank.sql
          $PSQL -q -f supabase/migrations/0046_invest.sql
          $PSQL -q -f supabase/migrations/0047_dre.sql
          $PSQL -q -f supabase/seed/0001_platform.sql

      # ⚠️ Sem `DATABASE_URL` os testes do store se PULAM — de propósito, para
      # que ninguém os veja "passar" sem banco. Aqui a variável existe, então
      # pular seria bug: este passo reprova se algum teste for pulado, ou se
      # nenhum rodar.
      - name: o correio contra Postgres (store, concorrência, composição)
        run: |
          set -o pipefail
          pnpm test:api 2>&1 | tee /tmp/api.log
          PULADOS=$(grep -oP '^# skipped \K\d+' /tmp/api.log | head -1)
          PASSOU=$(grep -oP '^# pass \K\d+' /tmp/api.log | head -1)
          echo "passaram=$PASSOU pulados=$PULADOS"
          [ "${PULADOS:-0}" = "0" ] || { echo "::error::$PULADOS teste(s) pulados — o job ficaria verde sem provar nada"; exit 1; }
          # O piso sobe quando a suíte cresce. Na Etapa 10 o bloco do triângulo
          # acrescentou 9 testes; deixar o piso em 15 faria o job ficar verde
          # com o arquivo do triângulo inteiro fora da coleta.
          # A Etapa 14 acrescentou os 21 testes da forja; o piso sobe junto,
          # senão um arquivo inteiro pode sair da coleta sem o job notar.
          [ "${PASSOU:-0}" -gt 45 ] || { echo "::error::só $PASSOU teste(s) rodaram; o arquivo não foi coletado"; exit 1; }

  contract:
    name: manifesto, tipos e domínio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ SEM `version:` aqui, de propósito.
      #
      # A versão do pnpm tem UMA fonte só: `packageManager` no package.json da
      # raiz. Declarar `version: 9` aqui também fazia a action abortar com
      # "Multiple versions of pnpm specified" — e o job morria no setup, antes
      # de instalar qualquer coisa. Sol Único vale para ferramenta também.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trava a divergência entre o ModuleManifest e o seed do catálogo:
      # se a Store passar a anunciar algo que o código não faz, quebra aqui.
      - run: pnpm typecheck
      - run: pnpm test

      # A Lei 7 com o sinal trocado: negar o que já existe.
      #
      # As Etapas 4, 5 e 6 construíram parser, telas, correio e contabilidade
      # de uso — e SEIS documentos continuaram dizendo que nada disso existia,
      # inclusive dois de leitura obrigatória no VERTEX. Nenhuma guarda pegou,
      # porque defasagem não exige que ninguém escreva nada: basta não apagar.
      #
      # `pnpm test:docs` roda o autoteste da guarda (ela ainda morde?);
      # `pnpm verificar:docs` varre o repositório de verdade.
      - run: pnpm test:docs
      - run: pnpm verificar:docs

      # É isto que a Vercel roda. Se passa aqui, passa lá.
      - run: pnpm build:portal

      # ⭐ A REGRA DE OURO, VERIFICADA (CLAUDE.md §5.3).
      # `apps/` é a PELE. Se alguém escrever regra de negócio numa tela
      # "porque era mais rápido", o build continuaria passando — e a dívida
      # entraria em silêncio. Este passo não deixa.
      - name: nenhuma cor fora do canon em apps/
        run: |
          SOLTO=$(grep -rInE '#[0-9a-fA-F]{3,8}\b' apps --include='*.tsx' --include='*.ts' || true)
          if [ -n "$SOLTO" ]; then
            echo "::error::HEX solto em apps/ — toda cor vem de var(--bos-*)"; echo "$SOLTO"; exit 1
          fi
          CRUA=$(grep -rInE '\b(bg|text|border)-(white|black|gray|slate|zinc|neutral|stone|red|blue|green|amber|yellow|purple|pink|indigo)-?[0-9]*\b' apps --include='*.tsx' || true)
          if [ -n "$CRUA" ]; then
            echo "::error::classe de cor crua do Tailwind em apps/ — use os tokens bos-*"; echo "$CRUA"; exit 1
          fi

      - name: o motor não foi reimplementado em apps/
        run: |
          # A tela CHAMA o domínio; se um dia ela declarar o próprio, o
          # coração terá migrado para a pele. Inclui o parser: ler extrato é
          # regra de negócio (decide sinal, arredondamento, fuso, duplicata).
          if grep -rInE 'function (suggestMatches|scorePair|unmatchedLines|summarizeStatement|parseOfx|parseCsv|parseStatement|parseAmountToCents|parseDate)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::motor de domínio redeclarado em apps/ — ele vive em packages/"; exit 1
          fi
          # Procura a CHAMADA no CÓDIGO, ignorando linhas de comentário.
          #
          # Duas versões anteriores desta guarda passaram na sabotagem: a
          # primeira casava o nome em qualquer lugar; a segunda exigia
          # `suggestMatches(` mas o próprio JSDoc da página tem essa string
          # com parêntese. Guarda que não é testada contra sabotagem não é
          # guarda — é decoração.
          CODIGO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/conciliacao/page.tsx)
          echo "$CODIGO" | grep -Eq 'suggestMatches\(' \
            || { echo "::error::a tela de conciliação deixou de chamar o motor do pacote"; exit 1; }
          echo "$CODIGO" | grep -Eq 'unmatchedLines\(' \
            || { echo "::error::a tela deixou de usar unmatchedLines do pacote"; exit 1; }

          FECHA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/fechamento/page.tsx)
          echo "$FECHA" | grep -Eq 'summarizeStatement\(' \
            || { echo "::error::a tela de fechamento deixou de usar summarizeStatement do pacote"; exit 1; }

          IMPORTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/actions.ts)
          echo "$IMPORTA" | grep -Eq 'parseStatement\(' \
            || { echo "::error::a importação deixou de usar o parser do pacote — ler extrato é regra de negócio"; exit 1; }

          # Módulo 2: a máquina de estados da campanha é DECISÃO, e decisão
          # mora no pacote. Escrever `if (status === 'draft')` numa Server
          # Action é o jeito mais provável de a regra migrar para a pele.
          if grep -rInE 'function (planTransition|canTransition|budgetStatusFor)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a máquina de estados da campanha foi redeclarada em apps/"; exit 1
          fi
          MKT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/marketing-actions.ts)
          echo "$MKT" | grep -Eq 'planTransition\(' \
            || { echo "::error::a ação de campanha deixou de chamar o motor do pacote"; exit 1; }
          echo "$MKT" | grep -Eq 'budgetStatusFor\(' \
            || { echo "::error::a ação deixou de consultar a projeção de verba do pacote"; exit 1; }

          # E a tela não pode reinventar a regra de verba com um `if` próprio.
          if grep -rInE "budgetStatus\s*===?\s*'approved'" \
               apps/portal/src/app apps/portal/src/lib --include='*.ts' --include='*.tsx'; then
            echo "::error::a regra de liberação de verba apareceu em apps/ — ela é settings do tenant, decidida no pacote"; exit 1
          fi

          # Módulo 3: validação do título, ciclo de vida e a conta do saldo são
          # DECISÃO. A forma mais provável de migrarem para a pele é alguém
          # escrever `if (amountCents <= 0)` no Server Action "porque era mais
          # rápido", ou `t.dueDate < hoje` no componente da lista.
          if grep -rInE 'function (validateNewPayable|statusForSettlement|nextStatuses|outstandingCents|isOverdue|canCancel)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contas a pagar foi redeclarado em apps/"; exit 1
          fi
          AP=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ap-actions.ts)
          echo "$AP" | grep -Eq 'validateNewPayable\(' \
            || { echo "::error::a ação de contas a pagar deixou de validar pelo pacote"; exit 1; }
          echo "$AP" | grep -Eq 'canTransition\(' \
            || { echo "::error::a ação deixou de consultar o ciclo de vida do pacote"; exit 1; }
          LISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/payable-list.tsx)
          echo "$LISTA" | grep -Eq 'isOverdue\(' \
            || { echo "::error::a lista deixou de perguntar ao pacote o que está vencido"; exit 1; }
          # O jeito mais provável de a conta de atraso migrar para a tela.
          # ⚠️ Lê CÓDIGO, não prosa — pela QUARTA vez neste repositório.
          #
          # A primeira versão desta guarda reprovou o comentário do próprio
          # componente, que diz "se alguém escrever `t.dueDate < hoje` aqui, a
          # regra passa a existir em dois lugares". A guarda mordeu a
          # documentação que ela existe para proteger.
          #
          # O padrão já é conhecido (§ máquina de estados, § tenant, § Store), e
          # a correção é sempre a mesma: descartar as linhas de comentário.
          ATRASO=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'dueDate\s*<\s*(hoje|today|now)' apps 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$ATRASO" ]; then
            echo "::error::a regra de vencimento apareceu em apps/ — ela é isOverdue(), no pacote"
            echo "$ATRASO"; exit 1
          fi

          # Módulo 4: a busca da carteira, o resumo e o ciclo de vida são
          # DECISÃO. A forma mais provável de migrarem para a pele é alguém
          # escrever `p.displayName.includes(busca)` no componente da lista
          # "porque era mais rápido" — e aí a mesma pergunta passa a ter duas
          # respostas no dia em que a busca também acontecer no servidor.
          if grep -rInE 'function (validateNewParty|validateNewInteraction|matchesQuery|summarizeParties|normalizeTags)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de relacionamentos foi redeclarado em apps/"; exit 1
          fi
          CRM=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/crm-actions.ts)
          for FN in validateNewParty validateNewInteraction canTransition; do
            echo "$CRM" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de relacionamentos deixou de chamar $FN() do pacote"; exit 1; }
          done
          PLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/party-list.tsx)
          echo "$PLISTA" | grep -Eq '\bmatchesQuery\(' \
            || { echo "::error::a lista deixou de usar a busca do pacote"; exit 1; }
          # E o jeito mais provável de a busca migrar para a tela.
          BUSCA=$(grep -rIn --include='*.tsx' --include='*.ts' -E '(displayName|display_name)[^;]{0,40}\.(includes|indexOf|match)\(' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$BUSCA" ]; then
            echo "::error::a busca da carteira apareceu em apps/ — ela é matchesQuery(), no pacote"
            echo "$BUSCA"; exit 1
          fi

          # ⛔ E a tela NÃO reimplementa a imutabilidade da interação com um
          # `if`. Ela não oferece o botão porque a operação não existe — três
          # camadas de banco a recusam. Um caminho de edição em apps/ seria a
          # tela prometendo o que o schema nega.
          EDITA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "from\('interactions'\)[^;]{0,60}\.(update|delete)\(|updateInteraction|deleteInteraction" apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$EDITA" ]; then
            echo "::error::apareceu caminho de editar/apagar interação em apps/ — fato consumado não se edita"
            echo "$EDITA"; exit 1
          fi

          # Módulo 5: saldo, excedente e ciclo de vida são DECISÃO. E aqui há
          # uma armadilha específica do espelho: a conta do saldo escrita à mão
          # (`amountCents - receivedAmountCents`) devolve NEGATIVO no caso de
          # recebimento a maior, que é exatamente o que o pacote evita — e o
          # negativo entraria somando no total em aberto da tela.
          if grep -rInE 'function (validateNewReceivable|statusForReceipt|outstandingCents|overpaidCents|summarizeReceivables)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contas a receber foi redeclarado em apps/"; exit 1
          fi
          AR=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ar-actions.ts)
          for FN in validateNewReceivable canTransition; do
            echo "$AR" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de contas a receber deixou de chamar $FN() do pacote"; exit 1; }
          done
          RLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/receivable-list.tsx)
          for FN in outstandingCents overpaidCents isOverdue; do
            echo "$RLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de recebíveis deixou de usar $FN() do pacote"; exit 1; }
          done
          SALDO=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'amountCents\s*-\s*receivedAmountCents' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SALDO" ]; then
            echo "::error::o saldo a receber foi calculado em apps/ — ele é outstandingCents(), que nunca devolve negativo"
            echo "$SALDO"; exit 1
          fi

          # Módulo 6: ciclo de vida, soma de itens e validação são DECISÃO.
          # Formulário com linhas dinâmicas não autoriza recalcular total na pele.
          if grep -rInE 'function (validateNewOrder|statusForReceipt|sumItems|lineTotalCents|canSubmit|canReceive|nextStatuses)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de compras/pedidos foi redeclarado em apps/"; exit 1
          fi
          PO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/po-actions.ts)
          for FN in validateNewOrder canTransition canCancel canSubmit canReceive; do
            echo "$PO" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de compras deixou de chamar $FN() do pacote"; exit 1; }
          done
          OLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/order-list.tsx)
          for FN in canCancel canSubmit canReceive; do
            echo "$OLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de pedidos deixou de usar $FN() do pacote"; exit 1; }
          done
          # Módulo 6: a esteira, o quadro e o versionamento são DECISÃO.
          #
          # ⭐ A armadilha específica deste módulo é a MAIS FÁCIL de todas: um
          # `orders.filter(o => o.currentStageId === stage.id)` escrito direto
          # na tela monta o quadro e parece certo — e esquece a regra "OS
          # concluída não entra em coluna nenhuma", empilhando para sempre na
          # última coluna tudo o que já foi entregue.
          if grep -rInE 'function (buildBoard|nextStage|stagesBefore|nextVersion|permissionToAdvance|whyCannotAdvance|whyCannotSkip|validateStages|orderedStages)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio da esteira foi redeclarado em apps/"; exit 1
          fi
          OPS=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ops-actions.ts)
          for FN in validateStages validateNewOrder orderedStages whyCannotAdvance whyCannotSkip canTransition nextVersion; do
            echo "$OPS" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação da esteira deixou de chamar $FN() do pacote"; exit 1; }
          done
          QUADRO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/pipeline-board.tsx)
          echo "$QUADRO" | grep -Eq '\bbuildBoard\(' \
            || { echo "::error::o quadro deixou de usar buildBoard() — as colunas são as etapas do tenant"; exit 1; }
          COLUNA=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'currentStageId\s*===?\s*(stage|etapa)' apps 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$COLUNA" ]; then
            echo "::error::o quadro foi montado à mão em apps/ — é buildBoard(), que exclui OS fora da esteira"
            echo "$COLUNA"; exit 1
          fi

          # Módulo 8: o SALDO é a decisão. A armadilha específica é a mais
          # tentadora de todas: um `reduce` somando movimentos direto na tela
          # monta a lista e parece certo — e esquece o sinal do tipo, ou o
          # local, ou soma o arquivado. O saldo é buildBalances()/balanceFor(),
          # no pacote, e o sinal é signedQuantity().
          if grep -rInE 'function (buildBalances|balanceFor|balanceState|ledgerFor|signedQuantity|validateNewItem|validateNewMovement|permissionForMovement|summarizeInventory)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do estoque foi redeclarado em apps/"; exit 1
          fi
          INV=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/inv-actions.ts)
          for FN in validateNewItem validateNewMovement canTransition permissionForMovement; do
            echo "$INV" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do estoque deixou de chamar $FN() do pacote"; exit 1; }
          done
          IPAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/estoque/page.tsx)
          echo "$IPAGE" | grep -Eq '\bbuildBalances\(' \
            || { echo "::error::a tela do estoque deixou de usar buildBalances() do pacote"; exit 1; }
          IEXTRATO=$(grep -Ev '^\s*(\*|//|/\*)' 'apps/portal/src/app/estoque/[itemId]/page.tsx')
          for FN in ledgerFor balanceFor signedQuantity; do
            echo "$IEXTRATO" | grep -Eq "\b$FN\(" \
              || { echo "::error::o extrato deixou de usar $FN() do pacote"; exit 1; }
          done
          # O jeito mais provável de a soma migrar para a pele: o sinal do
          # tipo escrito à mão num componente.
          SOMA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "kind\s*===?\s*'out'\s*\?\s*-" apps 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SOMA" ]; then
            echo "::error::o sinal do movimento foi decidido em apps/ — ele é signedQuantity(), no pacote"
            echo "$SOMA"; exit 1
          fi

          # Módulo 9: o ciclo, a soma e a expiração são DECISÃO. A armadilha
          # específica: um `validUntil < hoje` escrito na tela decide a
          # expiração — e esquece que rascunho não expira e que sem validade
          # não expira nunca. É isExpirable(), no pacote.
          if grep -rInE 'function (validateNewProposal|canSend|canDecide|isExpirable|summarizeProposals|canEditContent)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de propostas foi redeclarado em apps/"; exit 1
          fi
          QT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/quote-actions.ts)
          for FN in validateNewProposal canSend canDecide canCancel canTransition isExpirable; do
            echo "$QT" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de propostas deixou de chamar $FN() do pacote"; exit 1; }
          done
          QLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/proposal-list.tsx)
          for FN in canSend canDecide canCancel isExpirable; do
            echo "$QLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de propostas deixou de usar $FN() do pacote"; exit 1; }
          done
          VALIDADE=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'validUntil\s*<\s*(hoje|today|now)' apps 2>/dev/null \
                     | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VALIDADE" ]; then
            echo "::error::a expiração foi decidida em apps/ — ela é isExpirable(), no pacote"
            echo "$VALIDADE"; exit 1
          fi

          # Módulo 10: o quadro e o forecast são DECISÃO. As armadilhas: montar
          # coluna à mão (a guarda de currentStageId === já cobre, herdada do
          # ops) e ponderar valor por probabilidade num componente.
          if grep -rInE 'function (buildFunnelBoard|weightedCents|validateNewOpportunity|validateFunnelStages|whyCannotLose|summarizeFunnel|isPastExpectedClose|activeFunnels)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do funil foi redeclarado em apps/"; exit 1
          fi
          DL=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/deal-actions.ts)
          for FN in validateNewOpportunity validateFunnelStages whyCannotLose canClose; do
            echo "$DL" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do funil deixou de chamar $FN() do pacote"; exit 1; }
          done
          DBOARD=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/funnel-board.tsx)
          echo "$DBOARD" | grep -Eq '\bbuildFunnelBoard\(' \
            || { echo "::error::o quadro do funil deixou de usar buildFunnelBoard()"; exit 1; }
          # ⚠️ `[a-zA-Z_.]*` antes de `prob`: a primeira versão exigia a
          # palavra logo após o `*`, e a sabotagem `o.valueCents *
          # o.probability` passou verde — o prefixo do objeto cegava a
          # guarda. Sabotada antes de entrar, corrigida antes de valer.
          PONDERA=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'valueCents\s*\*\s*[a-zA-Z_.]*prob' apps 2>/dev/null \
                    | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$PONDERA" ]; then
            echo "::error::o forecast foi ponderado em apps/ — ele é weightedCents(), no pacote"
            echo "$PONDERA"; exit 1
          fi

          # Módulo 11: a lotação e o calendário são DECISÃO. A armadilha: uma
          # conta de vagas escrita na tela (capacity - inscritos) esquece que
          # cancelada não ocupa vaga — e que sem teto NÃO HÁ conta.
          if grep -rInE 'function (remainingCapacity|isFull|canHold|canRegister|canAttend|validateNewEvent|validateNewRegistration|summarizeEvents|activeRegistrations)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de eventos foi redeclarado em apps/"; exit 1
          fi
          EV=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/evt-actions.ts)
          for FN in validateNewEvent validateNewRegistration canTransitionEvent canHold canRegister isFull; do
            echo "$EV" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de eventos deixou de chamar $FN() do pacote"; exit 1; }
          done
          ELISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/event-list.tsx)
          for FN in remainingCapacity isFull canHold canPublish canAttend; do
            echo "$ELISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de eventos deixou de usar $FN() do pacote"; exit 1; }
          done
          VAGAS=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'capacity\s*-\s*[a-zA-Z_.]*(regist|inscri)' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VAGAS" ]; then
            echo "::error::as vagas foram contadas em apps/ — é remainingCapacity(), no pacote"
            echo "$VAGAS"; exit 1
          fi

          # Módulo 12: a fila, o atraso e o PRÓXIMO PASSO são DECISÃO. A
          # armadilha: um `dueDate < hoje` na tela decide quem está vencido —
          # a mesma do ap, agora na régua (a guarda de dueDate acima já cobre
          # o literal; esta confere as chamadas).
          if grep -rInE 'function (isInQueue|daysOverdue|dueSteps|nextStep|positionOf|validateRulerSteps|outstandingCentsOf|summarizeQueue)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio da régua foi redeclarado em apps/"; exit 1
          fi
          DN=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/dun-actions.ts)
          for FN in validateRulerSteps isInQueue nextStep; do
            echo "$DN" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação da régua deixou de chamar $FN() do pacote"; exit 1; }
          done
          DFILA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/dun-queue.tsx)
          for FN in isInQueue daysOverdue nextStep positionOf outstandingCentsOf; do
            echo "$DFILA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a fila da régua deixou de usar $FN() do pacote"; exit 1; }
          done

          # ⭐ E a Lei das Etapas na PELE: nenhum nome de etapa escrito em apps/.
          # A tela desenha o que o tenant desenhou; ela não conhece "briefing".
          #
          # ⚠️ A busca é pela COMPARAÇÃO com o literal, e não por
          # `stageName === '...'`. A primeira versão desta guarda exigia o
          # nome da variável e uma sabotagem passou por baixo dela escrevendo
          # `s.name === 'briefing'` — o defeito real não escolhe o nome da
          # variável. Comparar QUALQUER coisa com o nome de uma etapa é o que
          # está proibido.
          ETAPA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "[=!]==?\s*['\"](briefing|criacao|criação|revisao|revisão|aprovacao|aprovação|veiculacao|veiculação)['\"]" apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$ETAPA" ]; then
            echo "::error::apareceu nome de etapa comparado em apps/ — a etapa é dado do tenant"
            echo "$ETAPA"; exit 1
          fi

          # Módulo 13: o TERMO VIGENTE e o calendário são DECISÃO. As
          # armadilhas: a tela escolher o "último reajuste" por conta própria,
          # ou comparar o fim de vigência com hoje num componente.
          if grep -rInE 'function (currentValueCents|currentEndsOn|daysToEnd|canEnd|canActivate|canAdjust|canRenew|whyCannotTerminate|whyCannotRenewTo|buildExpiryQueue|validateNewContract|summarizeContracts)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contratos foi redeclarado em apps/"; exit 1
          fi
          CT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ctr-actions.ts)
          for FN in validateNewContract canActivate canEnd whyCannotTerminate whyCannotRenewTo canAdjust; do
            echo "$CT" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de contratos deixou de chamar $FN() do pacote"; exit 1; }
          done
          CLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/contract-list.tsx)
          for FN in currentValueCents currentEndsOn daysToEnd canEnd canActivate canAdjust canRenew; do
            echo "$CLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a carteira de contratos deixou de usar $FN() do pacote"; exit 1; }
          done
          # A armadilha do vigente: escolher o último reajuste/renovação na
          # tela. `sort`/`at` sobre os livros só existe no pacote (e no mock,
          # que simula o banco — por isso o grep mira componentes e ações).
          VIGENTE=$(grep -rIn -E '(adjustments|renewals)[^\n]*\.(sort|at)\(' \
                    apps/portal/src/components apps/portal/src/app 2>/dev/null \
                    | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VIGENTE" ]; then
            echo "::error::o termo vigente foi calculado na tela — ele é currentValueCents()/currentEndsOn(), no pacote"
            echo "$VIGENTE"; exit 1
          fi
          VENCE=$(grep -rIn -E '(endsOn|EndsOn)\s*[<>]=?\s*(hoje|today|now)' \
                  apps/portal/src/components apps/portal/src/app 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VENCE" ]; then
            echo "::error::o vencimento do contrato foi decidido na tela — ele é daysToEnd()/canEnd(), no pacote"
            echo "$VENCE"; exit 1
          fi

          # Módulo 14: o SALDO é DECISÃO. A armadilha clássica de todo caixa:
          # a tela somando lançamentos (reduce sobre o livro) ou decidindo o
          # sinal (`kind === 'out' ? -`) por conta própria.
          if grep -rInE 'function (balancesByCurrency|totalsByCategory|monthlyFlow|signedAmountCents|validateNewEntry|validateNewCategory|summarizeEntries|permissionForEntry)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do caixa foi redeclarado em apps/"; exit 1
          fi
          CA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/cash-actions.ts)
          for FN in validateNewEntry validateNewCategory; do
            echo "$CA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do caixa deixou de chamar $FN() do pacote"; exit 1; }
          done
          CPAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/caixa/page.tsx)
          echo "$CPAGE" | grep -Eq '\bbalancesByCurrency\(' \
            || { echo "::error::a página do caixa deixou de usar balancesByCurrency()"; exit 1; }
          SOMA=$(grep -rIn -E "kind\s*===?\s*'out'\s*\?\s*-|reduce\([^)]*[Aa]mountCents" \
                 apps/portal/src/components apps/portal/src/app 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SOMA" ]; then
            echo "::error::o saldo/sinal foi decidido na tela — é signedAmountCents()/balancesByCurrency(), no pacote"
            echo "$SOMA"; exit 1
          fi

          # Módulo 15: a ORDEM da fila e o atraso são DECISÃO. As armadilhas:
          # ordenar por prioridade na tela, ou um `dueAt <` comparado com
          # agora num componente.
          if grep -rInE 'function (orderTickets|isOverdue|canReopen|canResolve|canClose|canStart|canEditTicket|canInteract|validateNewTicket|validateInteraction|summarizeTickets)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do atendimento foi redeclarado em apps/"; exit 1
          fi
          CR=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/care-actions.ts)
          for FN in validateNewTicket validateInteraction canResolve canClose canReopen canInteract; do
            echo "$CR" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do atendimento deixou de chamar $FN() do pacote"; exit 1; }
          done
          CQ=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/care-queue.tsx)
          for FN in orderTickets isOverdue canResolve canReopen canClose; do
            echo "$CQ" | grep -Eq "\b$FN\(" \
              || { echo "::error::a fila do atendimento deixou de usar $FN() do pacote"; exit 1; }
          done
          FILA=$(grep -rIn -E 'dueAt\s*[<>]=?\s*(now|hoje|today)|sort\([^)]*position' \
                 apps/portal/src/components/care-queue.tsx apps/portal/src/app/atendimento 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$FILA" ]; then
            echo "::error::a fila/atraso foi decidida na tela — é orderTickets()/isOverdue(), no pacote"
            echo "$FILA"; exit 1
          fi

          # Módulo 16: a ORDEM do livro e a recusa do encerramento são
          # DECISÃO. A armadilha: ordenar por gravidade na tela, ou encerrar
          # sem passar por whyCannotClose().
          if grep -rInE 'function (orderOccurrences|whyCannotClose|canTreat|validateNewOccurrence|validateTreatment|summarizeOccurrences)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de ocorrências foi redeclarado em apps/"; exit 1
          fi
          OA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/occ-actions.ts)
          for FN in validateNewOccurrence validateTreatment whyCannotClose canTreat; do
            echo "$OA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de ocorrências deixou de chamar $FN() do pacote"; exit 1; }
          done
          OB=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/occ-book.tsx)
          for FN in orderOccurrences canTreat canClose; do
            echo "$OB" | grep -Eq "\b$FN\(" \
              || { echo "::error::o livro de ocorrências deixou de usar $FN() do pacote"; exit 1; }
          done
          GRAV=$(grep -rIn -E 'severit[a-z]*[^\n]*\.sort\(|sort\([^)]*severity' \
                 apps/portal/src/components/occ-book.tsx apps/portal/src/app/ocorrencias 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$GRAV" ]; then
            echo "::error::o livro foi ordenado na tela — é orderOccurrences(), no pacote"
            echo "$GRAV"; exit 1
          fi

          # Módulo 17: a PRÓXIMA DEVIDA e o quadro são DECISÃO. A armadilha
          # clássica: a tela somando completedAt + recurrenceDays.
          if grep -rInE 'function (buildPreventiveQueue|nextDueOn|orderBoard|whyCannotComplete|canReopen|validateNewOrder|summarizeOrders)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio da manutenção foi redeclarado em apps/"; exit 1
          fi
          MA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/mnt-actions.ts)
          for FN in validateNewOrder whyCannotComplete canStart canReopen canCancel; do
            echo "$MA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação da manutenção deixou de chamar $FN() do pacote"; exit 1; }
          done
          MB=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/mnt-board.tsx)
          for FN in buildPreventiveQueue orderBoard canComplete canReopen; do
            echo "$MB" | grep -Eq "\b$FN\(" \
              || { echo "::error::o quadro da manutenção deixou de usar $FN() do pacote"; exit 1; }
          done
          DEVIDA=$(grep -rIn -E 'completedAt[^\n]*\+[^\n]*recurrenceDays|recurrenceDays[^\n]*\+[^\n]*completedAt' \
                   apps/portal/src/components apps/portal/src/app 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$DEVIDA" ]; then
            echo "::error::a próxima devida foi calculada na tela — é nextDueOn()/buildPreventiveQueue(), no pacote"
            echo "$DEVIDA"; exit 1
          fi

      # ⭐⭐ A LEI DO LEGO, VERIFICADA (CLAUDE.md §5.5, regras 3 e 5).
      #
      # A Etapa 7 pôs dois módulos conversando. A tese inteira da plataforma é
      # que eles conversam **por contrato** e não **por código** — e a diferença
      # entre as duas coisas é literalmente um `import` que ninguém revisa.
      #
      # Um `import type` do outro módulo compilaria, passaria nos testes e
      # pareceria inofensivo. E aí desinstalar um módulo quebraria o outro, que
      # é exatamente o que a Store não pode permitir.
      - name: módulo não conhece módulo
        run: |
          FALHOU=0
          MODULOS="finance-reconciliation marketing accounts-payable crm accounts-receivable purchase-orders ops inventory quotes deals event-management dunning contracts cashflow care occurrences maintenance assets checklists spaces visits leads goals comms editorial media nps cost-centers budgets bank-accounts investments dre hr shift-scheduling training performance policies"

          # 1. Nenhum módulo importa outro módulo, em nenhuma forma.
          for MOD in $MODULOS; do
            for OUTRO in $MODULOS; do
              [ "$MOD" = "$OUTRO" ] && continue
              if grep -rInE "from '@alsham/$OUTRO'|require\('@alsham/$OUTRO'\)" \
                   "packages/$MOD/src" 2>/dev/null; then
                echo "::error::@alsham/$MOD importa @alsham/$OUTRO — módulo não depende de módulo"
                FALHOU=1
              fi
            done
          done

          # 2. E nem pelo package.json: dependência declarada é dependência.
          #    `devDependencies` de teste também não vale — se o teste precisa
          #    do outro módulo, o acoplamento é real.
          for MOD in $MODULOS; do
            if grep -qE '"@alsham/(finance-reconciliation|marketing|accounts-payable|crm|accounts-receivable|purchase-orders|ops|inventory|quotes|deals|event-management|dunning|contracts|cashflow|care|occurrences|maintenance)"' \
                 <(grep -v "\"@alsham/$MOD\"" "packages/$MOD/package.json"); then
              echo "::error::packages/$MOD declara outro módulo como dependência"
              FALHOU=1
            fi
          done

          # 3. Nenhum schema de módulo toca o schema de outro no SQL.
          #    Lê CÓDIGO, não prosa: os comentários dos arquivos explicam
          #    justamente esta regra, e citam o nome do outro schema ao fazê-lo.
          #
          #    ⚠️ `0008_recon_ap_projection.sql` NÃO entra nesta lista, e não é
          #    exceção: ela é uma migration do `recon`, e o que ela cria é
          #    objeto `recon.*`. Por isso ela existe separada da `0007` — se a
          #    porta de projeção morasse dentro do arquivo do módulo de Contas
          #    a Pagar, esta guarda precisaria aprender a ignorar um caso. É
          #    justamente o que se evitou. Ela é conferida abaixo, no item 4.
          #
          #    ⚠️ **A MATRIZ É GERADA, não escrita à mão — e mudou na Etapa 11.**
          #
          #    Com três módulos eram 6 pares e dava para listar. Com quatro são
          #    12, e com cinco serão 20: uma lista escrita à mão é uma lista que
          #    um dia esquece um par, em silêncio, e justamente o par novo.
          #    Aqui os pares saem do produto cartesiano dos schemas, nos DOIS
          #    sentidos — acrescentar um módulo é acrescentar uma linha ao mapa.
          declare -A SCHEMA_DE=(
            [0002_recon.sql]=recon
            [0004_marketing.sql]=marketing
            [0007_ap.sql]=ap
            [0009_crm.sql]=crm
            [0010_ar.sql]=ar
            [0017_po.sql]=po
            [0018_ops.sql]=ops
            [0020_ops_machine_draft.sql]=ops
            [0023_inv.sql]=inv
            [0024_quote.sql]=quote
            [0025_deal.sql]=deal
            [0026_evt.sql]=evt
            [0027_dun.sql]=dun
            [0028_ctr.sql]=ctr
            [0029_cash.sql]=cash
            [0030_care.sql]=care
            [0031_occ.sql]=occ
            [0032_mnt.sql]=mnt
            [0033_pat.sql]=pat
            [0034_chk.sql]=chk
            [0035_spc.sql]=spc
            [0036_vis.sql]=vis
            [0037_lead.sql]=lead
            [0038_goal.sql]=goal
            [0039_comm.sql]=comm
            [0040_edcal.sql]=edcal
            [0041_media.sql]=media
            [0042_nps.sql]=nps
            [0043_cc.sql]=cc
            [0044_bud.sql]=bud
            [0045_bank.sql]=bank
            [0046_invest.sql]=invest
            [0047_dre.sql]=dre
          )
          for ARQUIVO in "${!SCHEMA_DE[@]}"; do
            DONO="${SCHEMA_DE[$ARQUIVO]}"
            CODIGO=$(sed 's/--.*//' "supabase/migrations/$ARQUIVO")
            for OUTRO in "${SCHEMA_DE[@]}"; do
              [ "$DONO" = "$OUTRO" ] && continue
              if echo "$CODIGO" | grep -qE "\b$OUTRO\."; then
                echo "::error::$ARQUIVO acessa o schema $OUTRO — projeção local, nunca join"
                echo "$CODIGO" | grep -nE "\b$OUTRO\." | head -5
                FALHOU=1
              fi
            done
          done

          # 4. E a porta de projeção do `recon` não pode ler o schema de quem
          #    produz o evento. Ela recebe TUDO por argumento, do payload — que
          #    o produtor monta autossuficiente exatamente por isso.
          PROJ=$(sed 's/--.*//' supabase/migrations/0008_recon_ap_projection.sql)
          if echo "$PROJ" | grep -qE "\b(ap|marketing|crm|ar|ops|inv|quote|deal|evt|dun|ctr|cash|care|occ|mnt)\."; then
            echo "::error::a projeção lê o schema de outro módulo — ela só pode ler o payload"
            FALHOU=1
          fi
          # ⭐ E não pode CHUMBAR a origem: a procedência vem do envelope. Com
          #    ela fixa, um segundo produtor entraria disfarçado do primeiro e a
          #    trilha mentiria sem nunca dar erro.
          if echo "$PROJ" | grep -qE "'(ap|accounts-payable)'"; then
            echo "::error::a projeção cita o nome do módulo produtor — a origem vem de producedBy"
            FALHOU=1
          fi
          CONS=$(grep -Ev '^\s*(\*|//|/\*)' packages/finance-reconciliation/src/external-payable.ts)
          if echo "$CONS" | grep -qE "sourceModuleId:\s*'"; then
            echo "::error::o consumidor chumbou a origem — ela tem de vir de envelope.producedBy"
            FALHOU=1
          fi
          echo "$CONS" | grep -qE 'envelope\.producedBy' \
            || { echo "::error::o consumidor deixou de ler a procedência do envelope"; FALHOU=1; }

          # ⭐ E o QUARTO consumidor (a régua) obedece às mesmas três leis: a
          #    projeção dele não lê schema de produtor, não chumba a origem, e
          #    o handler lê envelope.producedBy.
          PROJD=$(sed 's/--.*//' supabase/migrations/0027_dun.sql)
          if echo "$PROJD" | grep -qE "'(ar|accounts-receivable)'"; then
            echo "::error::a projeção da régua cita o nome do módulo produtor — a origem vem de producedBy"
            FALHOU=1
          fi
          DUNC=$(grep -Ev '^\s*(\*|//|/\*)' packages/dunning/src/dun-title.ts)
          if echo "$DUNC" | grep -qE "sourceModuleId:\s*'"; then
            echo "::error::o consumidor da régua chumbou a origem — ela tem de vir de envelope.producedBy"
            FALHOU=1
          fi
          echo "$DUNC" | grep -qE 'envelope\.producedBy' \
            || { echo "::error::o consumidor da régua deixou de ler a procedência do envelope"; FALHOU=1; }

          [ "$FALHOU" = "0" ] || exit 1
          # ⚠️ O número sai da própria lista, não de uma constante escrita à
          # mão. A frase dizia "cinco módulos" desde a Etapa 12 e continuou
          # dizendo depois que a matriz aprendeu o `po` e o `ops` — uma guarda
          # correta relatando um número errado, que é o jeito mais fácil de
          # alguém acreditar que a cobertura parou de crescer.
          N=$(echo $MODULOS | wc -w)
          echo "Lego intacto: $N módulos, $(( N * (N - 1) )) pares conferidos nos dois sentidos, zero dependência entre eles."

      # ⛔⛔ A FRONTEIRA DA CHAVE-MÃE (Etapa 8).
      #
      # `apps/api` roda com `service_role`: ela ignora toda a RLS e enxerga
      # todos os tenants. `apps/portal` é a interface do CLIENTE. As duas não
      # podem virar o mesmo deploy, e o jeito de isso acontecer sem ninguém
      # notar é um `import` inocente.
      #
      # A guarda de bundle que já existe pega a string `service_role` no
      # JavaScript compilado. Esta pega um passo antes: a dependência.
      - name: a chave-mãe não encosta no app do cliente
        run: |
          FALHOU=0

          if grep -rInE "from '@alsham/api'|require\('@alsham/api'\)" apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal importa @alsham/api — a composição roda com service_role"; FALHOU=1
          fi
          if grep -qE '"(@alsham/api|pg)"' apps/portal/package.json; then
            echo "::error::apps/portal declara a composição ou um driver de banco como dependência"; FALHOU=1
          fi
          # Driver de Postgres no app do cliente significa conexão direta —
          # o portal fala com o banco pela chave publicável, sob RLS.
          if grep -rInE "from 'pg'|require\('pg'\)" apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal importa um driver de Postgres direto"; FALHOU=1
          fi
          # E os segredos do correio não podem ser lidos de lá.
          if grep -rInE 'process\.env\.(DATABASE_URL|COURIER_SECRET)' apps/portal 2>/dev/null; then
            echo "::error::apps/portal lê um segredo que é do servidor de composição"; FALHOU=1
          fi
          # O caminho inverso: a composição não pode virar tela.
          if grep -rInE "from 'next|from 'react" apps/api/src 2>/dev/null; then
            echo "::error::apps/api importou framework de UI — ele é servidor, não tela"; FALHOU=1
          fi

          [ "$FALHOU" = "0" ] || exit 1
          echo "fronteira intacta: a chave-mãe fica do lado do servidor."

      # ⭐ A COMPOSIÇÃO É A ÚNICA — e não pode reimplementar a entrega.
      #
      # Se alguém escrever a lógica de tomada, backoff ou idempotência dentro
      # de `apps/api` "porque era mais rápido", passamos a ter DUAS
      # implementações da mesma garantia. Este repositório já pagou para saber
      # o que isso custa: o defeito da Etapa 6 foi corrigido num lugar só
      # porque só existia um.
      - name: a composição chama o correio, não o reescreve
        run: |
          if grep -rInE 'function (deliverDue|entregarUm|backoffDelayMs|isExhausted|nextAttemptAt)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a lógica de entrega foi redeclarada em apps/ — ela vive em packages/workflow"; exit 1
          fi
          COMP=$(grep -Ev '^\s*(\*|//|/\*)' apps/api/src/composition.ts)

          # ⚠️ `\b` NA FRENTE DE CADA NOME, e não é detalhe de regex.
          #
          # Sem a fronteira de palavra, a busca casa por SUBSTRING: trocar a
          # chamada por `noop_handleExternalPayable(` deixava a guarda verde,
          # porque o nome original continuava contido no novo. A sabotagem da
          # Etapa 10 pegou exatamente isso, e a fraqueza valia para as quatro
          # verificações antigas também — foram corrigidas junto.
          for FN in deliverDue eventUsageHook handleSpendDecision auditSubscription handleExternalPayable handleDunTitle; do
            echo "$COMP" | grep -Eq "\b$FN\(" \
              || { echo "::error::a composição deixou de chamar $FN() do pacote"; exit 1; }
          done
          # A quinta da lista é a terceira ponta do triângulo (Etapa 10). Sem
          # ela, o título registrado no Módulo 3 nunca chega ao Módulo 1 — e
          # ninguém veria erro nenhum, porque o evento seria entregue e
          # ignorado.

      # ⭐ A STORE NÃO DECIDE — nem o que mostra, nem quem instala.
      #
      # Dois jeitos de a Store apodrecer, e os dois são um `if` inocente:
      #   1. filtrar `status = 'published'` na tela. A policy já faz isso, e
      #      depender dela é o ponto — no dia em que alguém escrever uma
      #      segunda consulta sem o filtro, a tela mostraria rascunho.
      #   2. checar permissão ou teto de plano no app. Essas regras vivem em
      #      `core.install_module()`, e só lá.
      - name: a Store consome a decisão, não a reescreve
        run: |
          APP=$(grep -rEv '^\s*(\*|//|/\*)' apps/portal/src/app/store apps/portal/src/app/store-actions.ts apps/portal/src/components/store-shelf.tsx apps/portal/src/lib/data/store-supabase.ts)

          if echo "$APP" | grep -Eq "eq\(\s*'status'\s*,\s*'published'\s*\)"; then
            echo "::error::a Store filtra 'published' na tela — quem filtra é a policy do banco"; exit 1
          fi
          # ⚠️ A COMPARAÇÃO, não a leitura.
          #
          # A primeira versão proibia a string `limit_value` e reprovou o
          # `loadModuleLimit()`, que só LÊ o número para a tela mostrar
          # "3 de 5". A segunda proibia qualquer comparação e reprovou
          # `limite !== null`, que é checagem de nulo para exibir.
          #
          # O que a tela não pode fazer é comparar a CONTAGEM DE INSTALADOS com
          # o teto — que é literalmente a decisão de `core.install_module()`.
          if echo "$APP" | grep -Eq '(installed|instalados|count|length)[^;]{0,20}(>=|<=|>|<)[^;]{0,20}(limite|limit_value|moduleLimit)|(limite|limit_value|moduleLimit)[^;]{0,20}(>=|<=|>|<)[^;]{0,20}(installed|instalados|count|length)'; then
            echo "::error::a Store passou a DECIDIR o teto do plano — a regra vive em core.install_module()"; exit 1
          fi
          if grep -rInE 'function (buildShelf|summarizeShelf|producerOf)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a visão de catálogo foi redeclarada em apps/ — ela vive em packages/permissions"; exit 1
          fi
          PAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/store/page.tsx)
          echo "$PAGE" | grep -Eq 'buildShelf\(' \
            || { echo "::error::a Store deixou de usar buildShelf do pacote"; exit 1; }

          # E o instalador é chamado, não reimplementado.
          ADAPTER=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/lib/data/store-supabase.ts)
          echo "$ADAPTER" | grep -Eq "rpc\('install_module'" \
            || { echo "::error::a Store não chama core.install_module — quem decide é o banco"; exit 1; }
          if echo "$ADAPTER" | grep -Eq "from\('role_permissions'\)[^;]*insert|insert.*role_permissions"; then
            echo "::error::a Store concede permissão direto — isso é ato do instalador"; exit 1
          fi
          echo "a Store consome a decisão do banco."

      # ⚠️ LEI 7 — BILLING CONTA USO, NÃO DINHEIRO.
      #
      # No dia em que alguém escrever um preço em reais em `packages/billing`
      # ou no schema de uso, terá inventado um número que o dono não decidiu.
      # Preço é etapa própria, com valores medidos.
      - name: billing não tem preço inventado
        run: |
          # -i e [_a-zA-Z0-9]* de propósito: a primeira versão desta guarda era
          # sensível a caixa e passou batido em `const PRECO_MENSAL = 4900`,
          # que é justamente a forma mais provável de uma constante de preço.
          # O `[^;]{0,40}` cobre a anotação de tipo entre o nome e o valor:
          # `const fee: number = 250` escapou das duas primeiras versões desta
          # guarda, e é a forma que um TypeScript real usaria.
          PRECO=$(grep -rInEi '(price|preco|preço|amount_cents|valor|tarifa|fee)[_a-zA-Z0-9]*[^;]{0,40}[:=][[:space:]]*[0-9]' \
                    packages/billing/src supabase/migrations/0003_billing.sql 2>/dev/null || true)
          if [ -n "$PRECO" ]; then
            echo "::error::preço/valor monetário em billing — Lei 7: preço é decisão do dono"
            echo "$PRECO"; exit 1
          fi
          if grep -rInE '\b(BRL|USD|EUR|R\$)\b' packages/billing/src 2>/dev/null; then
            echo "::error::moeda em packages/billing — este pacote conta uso, não dinheiro"; exit 1
          fi

      # ⛔ A CHAVE-MÃE NÃO PODE CHEGAR AO NAVEGADOR.
      #
      # `service_role` ignora toda a RLS: quem a tem enxerga todos os tenants.
      # O painel fala com o banco como o USUÁRIO. Esta guarda olha o bundle de
      # cliente já compilado — não o código-fonte —, que é onde a chave
      # apareceria de verdade se alguém a importasse por engano.
      - name: a service_role não chega ao bundle de cliente
        run: |
          DIR=apps/portal/.next/static
          [ -d "$DIR" ] || { echo "::error::bundle de cliente não encontrado — o build rodou?"; exit 1; }
          if grep -rl "service_role" "$DIR" 2>/dev/null; then
            echo "::error::a string service_role chegou ao bundle de CLIENTE"; exit 1
          fi
          # E nenhum JWT literal em lugar nenhum do build.
          if grep -rhoE "eyJ[A-Za-z0-9_-]{30,}" apps/portal/.next 2>/dev/null | head -1 | grep -q .; then
            echo "::error::um token com cara de JWT foi embutido no build"; exit 1
          fi
          echo "bundle de cliente limpo."

      # O tenant nunca pode vir do cliente.
      - name: o tenant vem da sessão, não do ambiente nem da URL
        run: |
          # Procura o USO, não a menção.
          #
          # A primeira versão desta guarda casava `NEXT_PUBLIC_TENANT` em
          # qualquer lugar — e reprovava o próprio `.env.example`, cujo
          # comentário explica justamente por que essa variável não existe.
          # É a terceira vez neste repositório que uma guarda tropeça na
          # documentação que ela deveria proteger; por isso agora é sempre
          # "leia código, não prosa".
          if grep -rInE 'process\.env\.NEXT_PUBLIC_TENANT' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::tenant lido de variável pública — ele tem de vir da sessão + memberships"; exit 1
          fi
          if grep -rInE '^[[:space:]]*NEXT_PUBLIC_TENANT' apps --include='*.example'; then
            echo "::error::variável pública de tenant declarada no .env.example"; exit 1
          fi
          grep -q 'resolveSession' apps/portal/src/lib/data/index.ts \
            || { echo "::error::a porta de dados deixou de resolver o tenant pela sessão"; exit 1; }

      # =====================================================================
      # ⚖️ A LEI DO MOTOR — O FORNECEDOR É RECEITA INTERNA (Etapa 14)
      # =====================================================================
      #
      # O cliente vê o produto e o **motor ALSHAM**. Se ele lê "powered by
      # <fornecedor>" numa tela, conclui que pode ir direto na ferramenta e
      # dispensar a ALSHAM — e a orquestração, que é o que vendemos, vira
      # detalhe. O nome do fornecedor é permitido **só em código não-visível**:
      # `apps/api/src/forge-adapters.ts`, env vars e docs de engenharia.
      #
      # ⭐ A defesa principal NÃO é esta guarda: é o TIPO. `EngineLabel`, em
      # `@alsham/ai`, não tem campo para fornecedor — a tela não teria onde
      # colocá-lo mesmo querendo. Esta guarda é a segunda camada, para o dia em
      # que alguém escrever o nome à mão numa string de UI.
      - name: nenhum nome de fornecedor no que o cliente vê
        run: |
          FORNECEDORES='anthropic|openai|chatgpt|gpt-[0-9]|gemini|google ai|vertex ai|llama|mistral|deepseek|ideogram|midjourney|stable diffusion|fal\.ai|opus clip|runway|elevenlabs'
          FALHOU=0

          # ⚠️ `CLAUDE.md` é o arquivo de instruções DESTE repositório e o nome
          # dele contém o de um fornecedor. Uma versão anterior desta guarda
          # reprovou o próprio arquivo que a manda existir. Escopo é código de
          # tela e de domínio — nunca a documentação de engenharia.
          ALVOS=$(find apps/portal/src packages/ai/src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.test.ts' ! -name '*.test.tsx')

          for F in $ALVOS; do
            if grep -InEi "$FORNECEDORES" "$F"; then
              echo "::error file=$F::nome de fornecedor em código visível ao cliente (Lei do Motor)"
              FALHOU=1
            fi
          done

          # E no bundle já compilado, que é onde ele chegaria de verdade.
          if [ -d apps/portal/.next/static ]; then
            if grep -rlEi "$FORNECEDORES" apps/portal/.next/static 2>/dev/null; then
              echo "::error::nome de fornecedor chegou ao bundle de CLIENTE"; FALHOU=1
            fi
          fi

          # ⭐ E o TIPO continua sem onde guardá-lo — a defesa principal.
          #
          # ⚠️ **DUAS correções aqui, e a segunda foi o CI que deu.**
          #
          # 1. O escopo era `forge.ts` só, e a sabotagem "acrescentar
          #    `readonly provider: string` a `EngineLabel`" passou verde: o
          #    tipo vive em `types.ts`. Guarda que olha o arquivo errado é
          #    guarda que não existe.
          # 2. Ao corrigir, alarguei o escopo para `$ALVOS` — que inclui
          #    `apps/portal/src`. **O CI reprovou cinco arquivos legítimos**,
          #    e com razão: em português, *fornecedor* é **quem fornece
          #    mercadoria** — a etiqueta do CRM, o nome no Contas a Pagar, o
          #    do pedido de Compras. Não tem nada a ver com fornecedor de
          #    motor de IA. Confundir as duas palavras proibiria o produto de
          #    falar o idioma do negócio dele.
          #
          # O escopo certo é `packages/ai/src`: é lá que o rótulo do motor
          # mora, e é lá que um campo com esse nome seria o defeito.
          #
          # ⚠️ E o filtro de comentário precisa de `/\*` junto: um bloco JSDoc
          # abre com `/**`, que não casa `\*` nem `//` — a linha 3 de
          # `forge-port.ts` foi reprovada por ser um comentário.
          for A in $(find packages/ai/src -type f -name '*.ts' ! -name '*.test.ts'); do
            if grep -InE 'provider|vendor|fornecedor' "$A" | grep -vE '^[0-9]+:[[:space:]]*(\*|//|/\*)' | grep -q .; then
              echo "::error file=$A::campo de fornecedor em @alsham/ai — o rótulo do motor não tem esse campo"
              grep -InE 'provider|vendor|fornecedor' "$A" | grep -vE '^[0-9]+:[[:space:]]*(\*|//|/\*)'
              FALHOU=1
            fi
          done

          [ "$FALHOU" = "0" ] || exit 1
          echo "o cliente vê o motor ALSHAM, e só."

      # ⛔ A CHAVE DO MOTOR É DO SERVIDOR — a mesma fronteira da chave-mãe.
      #
      # ⚠️ **Há duas coisas diferentes aqui, e confundi-las foi o primeiro erro
      # desta guarda.**
      #
      #   · `FORGE_SECRET` é a CHAVE DA PORTA entre `apps/portal` e `apps/api`.
      #     O portal **tem** de tê-la — é com ela que ele se identifica no
      #     endpoint. Proibi-la aqui reprovaria `getForgePort()`, que é
      #     justamente a fronteira funcionando.
      #   · `ALSHAM_*_API_KEY` e os endpoints do fornecedor são a CHAVE DO
      #     MOTOR. Essas o portal nunca vê, em nenhuma hipótese: quem chama o
      #     fornecedor é `apps/api`, e quem paga a conta é quem apresenta a
      #     chave.
      #
      # ⚠️ E o escopo é `src` + `.env.example`, **não a pasta inteira**: o
      # `.next/` já existe quando este job roda (o build precede a guarda de
      # bundle), e os *source maps* de lá contêm o código-fonte inteiro em
      # forma de string. Grepar a pasta do build é grepar o próprio código
      # duas vezes, e a segunda dá falso positivo.
      - name: a chave do motor não encosta no portal
        run: |
          FALHOU=0
          if grep -rInE 'process\.env\.(ALSHAM_TEXT_API_KEY|ALSHAM_IMAGE_API_KEY|ALSHAM_TEXT_ENDPOINT|ALSHAM_IMAGE_ENDPOINT|ALSHAM_TEXT_MODEL)' \
               apps/portal/src apps/portal/.env.example 2>/dev/null; then
            echo "::error::apps/portal leu uma chave/endpoint de motor — isso é de apps/api"; FALHOU=1
          fi
          if grep -rInE 'NEXT_PUBLIC_[A-Z_]*(API_KEY|SECRET|TOKEN)' \
               apps/portal/src apps/api/src --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "::error::segredo declarado como variável PÚBLICA — isso vai para o navegador"; FALHOU=1
          fi
          if grep -rInE '^[[:space:]]*NEXT_PUBLIC_[A-Z_]*(API_KEY|SECRET|TOKEN)' apps/*/.env.example 2>/dev/null; then
            echo "::error::segredo público declarado no .env.example"; FALHOU=1
          fi
          # E o portal não chama fornecedor nenhum direto: ele fala com apps/api.
          if grep -rInE "fetch\(\s*['\"]https://api\." apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal chama uma API externa direto — a fronteira é apps/api"; FALHOU=1
          fi
          # E nenhum dos dois segredos chega ao navegador.
          if [ -d apps/portal/.next/static ]; then
            if grep -rlE 'FORGE_SECRET|ALSHAM_(TEXT|IMAGE)_API_KEY' apps/portal/.next/static 2>/dev/null; then
              echo "::error::nome de segredo no bundle de CLIENTE"; FALHOU=1
            fi
          fi
          [ "$FALHOU" = "0" ] || exit 1
          echo "a chave da porta é do portal; a chave do motor, só do servidor."

      # ⛔ SEM MEDIÇÃO, SEM GERAÇÃO.
      #
      # É a regra que impede o produto de queimar dinheiro sem saber: uma
      # geração que não vira linha no `usage_ledger` é custo invisível. A
      # cadeia inteira depende de `checkLimit()` negar por omissão, e o modo
      # de quebrá-la em silêncio é gerar ANTES de medir.
      - name: geração sem medição não passa
        run: |
          SVC=$(grep -Ev '^\s*(\*|//|/\*)' apps/api/src/forge-service.ts)
          for FN in checkLimit canGenerate; do
            echo "$SVC" | grep -Eq "\b$FN\(" \
              || { echo "::error::forge-service deixou de chamar $FN() do pacote"; exit 1; }
          done
          # ⚠️ `insert into`, não a menção. A primeira versão procurava só
          # `usage_ledger` — e o serviço LÊ a tabela para somar o consumo do
          # mês, algumas linhas antes de escrever. Trocar o `insert` de tabela
          # deixava a guarda verde: a leitura sozinha a satisfazia. Uma geração
          # que consulta a conta e não a debita é exatamente o custo invisível
          # que esta guarda existe para impedir.
          echo "$SVC" | grep -Eq 'insert into core\.usage_ledger' \
            || { echo "::error::a geração deixou de LANÇAR consumo no usage_ledger"; exit 1; }

          # ⭐ A ORDEM IMPORTA: a checagem vem ANTES da chamada ao adaptador.
          # Medir depois de gastar é medir o prejuízo, não evitá-lo.
          L_CHECK=$(echo "$SVC" | grep -nE '\bcanGenerate\(' | head -1 | cut -d: -f1)
          L_CALL=$(echo "$SVC"  | grep -nE '\badapter\.(generate|run)\(|adapterFor\(' | head -1 | cut -d: -f1)
          if [ -n "$L_CHECK" ] && [ -n "$L_CALL" ] && [ "$L_CHECK" -gt "$L_CALL" ]; then
            echo "::error::a checagem de cota ficou DEPOIS da chamada ao motor"; exit 1
          fi

          # E a decisão não foi reescrita na tela.
          if grep -rInE 'function (canGenerate|engineState|whyCannotGenerate|composePrompt)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a decisão da forja foi redeclarada em apps/ — ela vive em packages/ai"; exit 1
          fi
          echo "sem medição, sem geração."

      # ⭐ O PAINEL EXECUTIVO NÃO DECIDE, E NÃO INVENTA NÚMERO (Etapa 15).
      - name: o painel lê, e cada número tem fonte
        run: |
          PAGE=$(grep -Ev '^\s*(\*|//|/\*|\{/\*)' apps/portal/src/app/page.tsx)
          FALHOU=0

          # A faixa de consumo é decisão de produto e vive no pacote.
          echo "$PAGE" | grep -Eq '\busageBand\(' \
            || { echo "::error::o Painel deixou de usar usageBand() de @alsham/billing"; FALHOU=1; }
          if grep -rInE 'function usageBand|USAGE_WARNING_RATIO\s*=' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o limiar de aviso foi redeclarado em apps/ — ele vive em packages/billing"; FALHOU=1
          fi

          # Os atalhos são o MESMO menu — não uma segunda lista para manter.
          echo "$PAGE" | grep -Eq '\bvisibleMenu\(' \
            || { echo "::error::o Painel montou lista própria de atalhos em vez de usar visibleMenu()"; FALHOU=1; }

          # ⛔ E ele NÃO pode ler a saúde global do correio.
          if echo "$PAGE" | grep -Eq "courier_status|courier_health"; then
            echo "::error::o Painel leu a fila GLOBAL — o tenant vê tenant_courier_summary()"; FALHOU=1
          fi
          if grep -rInE "rpc\('courier_status'|from\('courier_health'\)" apps/portal/src 2>/dev/null; then
            echo "::error::o portal chamou a saúde global da fila"; FALHOU=1
          fi
          # ⚠️ A CHAMADA, não a palavra. A primeira versão fazia
          # `grep -q tenant_courier_summary` no arquivo — e o cabeçalho dele
          # explica, em prosa, justamente por que a leitura é essa. Trocar o
          # `rpc()` por `courier_status` deixava a guarda verde, satisfeita
          # pelo próprio comentário que documenta a regra violada. É a quarta
          # vez neste repositório que uma guarda tropeça na documentação que
          # deveria proteger: leia código, nunca prosa.
          grep -Eq "rpc\('tenant_courier_summary'" apps/portal/src/lib/data/panel-supabase.ts \
            || { echo "::error::a porta do Painel deixou de CHAMAR a leitura estreita do tenant"; FALHOU=1; }

          [ "$FALHOU" = "0" ] || exit 1
          echo "o painel lê; quem decide é o banco e o pacote."
