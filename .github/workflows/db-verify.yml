                            where table_schema='media' and table_name='usages'
                              and column_name='reference_id';")
          [ "$F" = "0" ] || { echo "::error::reference_id ganhou FK — o vínculo do uso é solto"; exit 1; }
          # Nenhum enum: tipo é texto livre; etiqueta é tabela do tenant.
