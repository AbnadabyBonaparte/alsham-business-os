name: db-verify

# O SENTINELA em forma de CI.
#
# Sobe um Postgres 17 limpo, aplica as migrations na ordem, aplica o seed duas
# vezes (para provar idempotência) e roda o teste de isolamento com usuário
# real. Toda mudança futura de schema que quebrar o isolamento é barrada aqui,
# antes de chegar na main.
#
# É a diferença entre "RLS escrita" e "RLS que funciona" — e é a lição paga do
# suna-core (Balanço de Tecnologia §5), que nasceu com RLS aberta e virou P0.
#
# Nada aqui toca banco remoto, projeto Supabase ou segredo. O banco é efêmero
# e morre com o job.

on:
  push:
    branches: ['**']
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: schema aplica, isola e não vaza
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 17: a mesma versão dos 12 bancos do império
        # (Balanço Supabase — "todos Postgres 17 no Supabase").
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_verify
      # Qualquer erro de SQL derruba o passo. Sem falha silenciosa.
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      # ---------------------------------------------------------------------
      # 1. APLICAR — a prova que o parser não dá
      # ---------------------------------------------------------------------
      - name: shim do Supabase (auth.users, auth.uid, papéis)
        run: $PSQL -f supabase/tests/00_supabase_shim.sql

      - name: aplicar 0001_core.sql
        run: $PSQL -f supabase/migrations/0001_core.sql

      - name: aplicar 0002_recon.sql
        run: $PSQL -f supabase/migrations/0002_recon.sql

      - name: aplicar 0003_billing.sql
        run: $PSQL -f supabase/migrations/0003_billing.sql

      # `0001` e `0002` estão CONGELADAS (CLAUDE.md §5.4.1) — aplicadas em
      # produção. O CI segue aplicando do zero, e é justamente por isso que ele
      # NÃO detectaria uma edição nelas: correção é migration nova.
      - name: aplicar 0004_marketing.sql
        run: $PSQL -f supabase/migrations/0004_marketing.sql

      - name: aplicar 0005_courier_cron.sql
        run: $PSQL -f supabase/migrations/0005_courier_cron.sql

      - name: aplicar 0006_install.sql
        run: $PSQL -f supabase/migrations/0006_install.sql

      # ⭐ ETAPA 10 — e as duas são SEPARADAS de propósito.
      #
      # `0007` só cria objeto em `ap`; `0008` só cria objeto em `recon`. Cada
      # migration tem um schema dono. Escrever a função `recon.*` dentro do
      # arquivo do módulo de Contas a Pagar obrigaria a guarda "módulo não
      # conhece módulo" a aprender uma exceção — e guarda com exceção é guarda
      # que um dia aceita tudo.
      - name: aplicar 0007_ap.sql
        run: $PSQL -f supabase/migrations/0007_ap.sql

      - name: aplicar 0008_recon_ap_projection.sql
        run: $PSQL -f supabase/migrations/0008_recon_ap_projection.sql

      # ⭐ ETAPA 11 — o Módulo 4, Relacionamentos (CRM base).
      - name: aplicar 0009_crm.sql
        run: $PSQL -f supabase/migrations/0009_crm.sql

      # ⭐ ETAPA 12 — o Módulo 5, Contas a Receber: o espelho consciente do 3.
      - name: aplicar 0010_ar.sql
        run: $PSQL -f supabase/migrations/0010_ar.sql

      - name: aplicar 0011_recon_receivables.sql
        run: $PSQL -f supabase/migrations/0011_recon_receivables.sql

      - name: aplicar 0012_recon_match_decided.sql
        run: $PSQL -f supabase/migrations/0012_recon_match_decided.sql

      - name: aplicar 0013_ar_apply_recon_match.sql
        run: $PSQL -f supabase/migrations/0013_ar_apply_recon_match.sql

      - name: aplicar 0014_ap_apply_recon_match.sql
        run: $PSQL -f supabase/migrations/0014_ap_apply_recon_match.sql

      - name: aplicar 0017_po.sql
        run: $PSQL -f supabase/migrations/0017_po.sql

      # ⭐ O Módulo 6 — a esteira que o TENANT desenha. Nenhuma etapa é enum:
      # elas são linhas de `ops.pipeline_stages`, e a guarda anti-viés do
      # pacote procura pelos nomes do enunciado dentro deste arquivo.
      - name: aplicar 0018_ops.sql
        run: $PSQL -f supabase/migrations/0018_ops.sql

      # ⭐ A FORJA — IA Base, capacidade do CORE (Taxonomia §3). Escreve em
      # `core` porque não é módulo: não aparece na Store, e qualquer módulo
      # pede geração sem conhecê-la.
      - name: aplicar 0019_forge.sql
        run: $PSQL -f supabase/migrations/0019_forge.sql

      # E a coluna que a esteira ganha para marcar o rascunho de máquina —
      # migration do MÓDULO, separada da do Core, como o par 0007/0008.
      - name: aplicar 0020_ops_machine_draft.sql
        run: $PSQL -f supabase/migrations/0020_ops_machine_draft.sql

      # ⭐ O PAINEL EXECUTIVO — leitura ESTREITA, do tenant. Nenhuma tabela
      # nova: o Painel lê, não guarda. E a `core.courier_status()` continua
      # fechada — há guarda adiante que reprova conceder aquela função.
      - name: aplicar 0021_tenant_panel.sql
        run: $PSQL -f supabase/migrations/0021_tenant_panel.sql

      # ⛔ E o EXECUTE que o Postgres concede a PUBLIC por padrão — o buraco
      # que uma sabotagem da Etapa 15 descobriu: apagar um `grant` e a guarda
      # não reclamar, porque o privilégio vinha de `PUBLIC`. Oito funções
      # `security definer` eram chamáveis por `anon`.
      - name: aplicar 0022_revoke_public_execute.sql
        run: $PSQL -f supabase/migrations/0022_revoke_public_execute.sql

      # ⭐ MISSÃO TRINA — o Módulo 8: o estoque como LIVRO imutável. O saldo é
      # view com security_invoker; não existe coluna de saldo, e há guarda
      # adiante conferindo isso no banco aplicado.
      - name: aplicar 0023_inv.sql
        run: $PSQL -f supabase/migrations/0023_inv.sql

      # ⭐ O Módulo 9: a proposta com identidade por DOCUMENTO — a mesa
      # congela o conteúdo, o aceite carimba quem/quando, e os fins são
      # terminais.
      - name: aplicar 0024_quote.sql
        run: $PSQL -f supabase/migrations/0024_quote.sql

      # ⭐ O Módulo 10: a Lei das Etapas, segunda aplicação — estágios do
      # tenant, movimento LIVRE com trilha imutável, desfecho terminal com
      # razão. Nenhum enum de estágio, e há guarda adiante.
      - name: aplicar 0025_deal.sql
        run: $PSQL -f supabase/migrations/0025_deal.sql

      # ⭐ O Módulo 11: o evento UNIVERSAL (Domain marketing) — a lista abre
      # ao publicar, a lotação recusa claro, a presença carimba quem/quando.
      # Nada do ofício do vertical (ingresso, QR, line-up) — há guarda.
      - name: aplicar 0026_evt.sql
        run: $PSQL -f supabase/migrations/0026_evt.sql

      # ⭐⭐ O Módulo 12: a régua — projeção alimentada por FATO (padrão E10,
      # quarta aplicação), a Lei das Etapas pela terceira vez, e o ato
      # registrado. O módulo NÃO envia nada.
      - name: aplicar 0027_dun.sql
        run: $PSQL -f supabase/migrations/0027_dun.sql

      # ⭐ MISSÃO QUADRA — o Módulo 13: contratos com os termos originais
      # CONGELADOS em vigor; o vigente é calculado dos atos imutáveis
      # (reajuste, renovação). Encerrar é calendário; rescindir exige razão.
      - name: aplicar 0028_ctr.sql
        run: $PSQL -f supabase/migrations/0028_ctr.sql

      # ⭐ O Módulo 14: o livro do inv NO DINHEIRO — lançamentos imutáveis,
      # sinal do tipo, categoria do tenant, saldo em view. CAIXA realizado:
      # o futuro é recusado (previsão é Orçamento).
      - name: aplicar 0029_cash.sql
        run: $PSQL -f supabase/migrations/0029_cash.sql

      # ⭐ O Módulo 15: o caso que reabre do resolvido (identidade pelo
      # PEDIDO — a terceira resposta, entre ops e quote), fechado terminal,
      # conversa imutável, categoria E prioridade como dado do tenant.
      - name: aplicar 0030_care.sql
        run: $PSQL -f supabase/migrations/0030_care.sql

      # ⭐ O Módulo 16: o livro do fato consumado — o REGISTRO nasce imutável
      # (a física que diverge do care de propósito), tratativa em atos
      # eternos, encerramento com desfecho escrito, terminal.
      - name: aplicar 0031_occ.sql
        run: $PSQL -f supabase/migrations/0031_occ.sql

      # ⭐ O Módulo 17: a ordem que volta da conclusão (o ops MANTIDO), o
      # relato obrigatório e a preventiva com a próxima devida calculada —
      # sem cron fingido.
      - name: aplicar 0032_mnt.sql
        run: $PSQL -f supabase/migrations/0032_mnt.sql

      # ⭐ MISSÃO PENTA — o Módulo 18: o livro de bens com a localização
      # vigente CALCULADA do livro de transferências (nunca coluna), o
      # "de onde" carimbado pelo servidor e a baixa terminal com razão.
      # A ponte do mnt (asset_id) continua SOLTA — nenhuma linha do 0032 muda.
      - name: aplicar 0033_pat.sql
        run: $PSQL -f supabase/migrations/0033_pat.sql

      # ⭐ O Módulo 19: o modelo é desenho do tenant; executar CONGELA por
      # cópia (gatilho); a resposta é ato que não se rasura; concluir exige
      # tudo respondido. Dois fins, ambos terminais.
      - name: aplicar 0034_chk.sql
        run: $PSQL -f supabase/migrations/0034_chk.sql

      # ⭐ O Módulo 20: a física na CONSTRAINT — exclusion (gist) parcial
      # sobre (espaço, período): o conflito cai no banco, a cancelada libera
      # sozinha, o passado é permitido (fato consumado).
      - name: aplicar 0035_spc.sql
        run: $PSQL -f supabase/migrations/0035_spc.sql

      # ⭐ O Módulo 21: o livro da portaria — entrada e saída carimbadas pelo
      # servidor, o registro que não se rasura (correção é registro novo),
      # a passagem que não volta — e o documento que não passeia no correio.
      - name: aplicar 0036_vis.sql
        run: $PSQL -f supabase/migrations/0036_vis.sql

      # ⭐ O Módulo 22: a fila de entrada do comercial — origem TEXTO LIVRE,
      # ciclo curto com a volta à fila, desfechos terminais com carimbo e o
      # vínculo SOLTO (id + nome carimbado, pela tela) com crm e deal.
      - name: aplicar 0037_lead.sql
        run: $PSQL -f supabase/migrations/0037_lead.sql

      # ⭐ MISSÃO SEXTA — o Módulo 23: a ambição declarada — a trave congela
      # na ativação, o andamento é livro imutável de check-ins, o progresso
      # é o ÚLTIMO check-in (view), e fechar a época é decisão de gente com
      # número na mesa.
      - name: aplicar 0038_goal.sql
        run: $PSQL -f supabase/migrations/0038_goal.sql

      # ⭐ O Módulo 24: o mural do tenant — publicar congela a palavra dada,
      # corrigir é comunicado novo com o título carimbado pelo servidor, a
      # ciência é ato próprio/único/eterno e o arquivado é terminal.
      - name: aplicar 0039_comm.sql
        run: $PSQL -f supabase/migrations/0039_comm.sql

      # ⭐ O Módulo 25: o calendário editorial — canal e fluxo do tenant
      # (Lei das Etapas, 4ª aplicação), o plano que muda livre e o fim que
      # congela com a data real do servidor ao lado da planejada.
      - name: aplicar 0040_edcal.sql
        run: $PSQL -f supabase/migrations/0040_edcal.sql

      # ⭐ O Módulo 26: a biblioteca de mídia — CATÁLOGO, não cofre (o
      # onde-vive em texto livre), o acervo que volta do arquivo (o DIVERGE
      # do pat) e o livro de uso imutável com vínculo solto.
      - name: aplicar 0041_media.sql
        run: $PSQL -f supabase/migrations/0041_media.sql

      # ⭐ O Módulo 27: as pesquisas — a régua 0-10 como física do método
      # (CHECK argumentado), o placar como view calculada do livro, closed
      # terminal (o DIVERGE do care) e anon sem grant nenhum.
      - name: aplicar 0042_nps.sql
        run: $PSQL -f supabase/migrations/0042_nps.sql

      # ⭐ MISSÃO SETE — o Bloco Financeiro. O Módulo 28: centros de custo
      # do tenant (voltam do arquivo), regras que fecham 100% (física) e o
      # rateio como ato de gente, sem perder centavo.
      - name: aplicar 0043_cc.sql
        run: $PSQL -f supabase/migrations/0043_cc.sql

      # ⭐ O Módulo 29: o teto que congela a trave (física do goal no dinheiro)
      # e o realizado calculado do livro do cash, projetado por evento
      # (`cash.entry.registered`). ⚠️ Consumidor — o apps/api precisa de
      # redeploy no apply (runbook §20).
      - name: aplicar 0044_bud.sql
        run: $PSQL -f supabase/migrations/0044_bud.sql

      # ⭐ O Módulo 30: cadastro de contas (voltam do arquivo) e livro por conta.
      # SOL ÚNICO — a conciliação é do recon; o saldo é view e PODE ser negativo
      # (cheque especial); a transferência é atômica. `consumes` vazio.
      - name: aplicar 0045_bank.sql
        run: $PSQL -f supabase/migrations/0045_bank.sql

      # ⭐ O Módulo 31: livro de atos imutáveis; a posição é a soma dos atos,
      # sem cotação de mercado (Lei 3/7); resgatar mais que a posição é
      # recusado (a terceira resposta). `consumes` vazio.
      - name: aplicar 0046_invest.sql
        run: $PSQL -f supabase/migrations/0046_invest.sql

      # ⭐⭐ O Módulo 32 (DRE Gerencial): NÃO fiscal (Lei 3); o plano de linhas é
      # do tenant; os valores nascem dos livros do cash E do cc (segundo
      # consumidor da onda, dois produtores); totais são views; linha sem
      # lançamento não aparece. ⚠️ Consumidor — apps/api precisa de redeploy.
      - name: aplicar 0047_dre.sql
        run: $PSQL -f supabase/migrations/0047_dre.sql

      # ⭐ MISSÃO OITO (Onda 5 — o BLOCO DE PESSOAS). Cinco módulos do Domain
      # RH, todos com `consumes` VAZIO (nenhum handler nesta onda) — sem
      # redeploy obrigatório do apps/api.
      # ⭐ O Módulo 33 (hr): o roster — cargo/departamento texto livre;
      # on_leave volta, terminated é terminal com razão (o DIVERGE do crm).
      - name: aplicar 0048_hr.sql
        run: $PSQL -f supabase/migrations/0048_hr.sql

      # ⭐ O Módulo 34 (shift): a física do spc reaproveitada para a PESSOA —
      # duas escalas não ocupam o mesmo colaborador no mesmo período
      # (exclusion, parcial); o passado é permitido.
      - name: aplicar 0049_shift.sql
        run: $PSQL -f supabase/migrations/0049_shift.sql

      # ⭐ O Módulo 35 (train): a identidade do evt aplicada ao treino —
      # turma publicada abre inscrição, presença é ato imutável carimbado.
      - name: aplicar 0050_train.sql
        run: $PSQL -f supabase/migrations/0050_train.sql

      # ⭐ O Módulo 36 (perf): avaliador × avaliado (o contraste com o goal);
      # a avaliação é ato imutável; o ciclo fechado é terminal.
      - name: aplicar 0051_perf.sql
        run: $PSQL -f supabase/migrations/0051_perf.sql

      # ⭐ O Módulo 37 (pol): política tem VERSÃO — a ciência é por (política,
      # versão): versão nova exige ciência de novo (o DIVERGE do comm).
      - name: aplicar 0052_pol.sql
        run: $PSQL -f supabase/migrations/0052_pol.sql

      # ⭐ MISSÃO NOVE (Onda 6 — a ÚLTIMA). O VERTICAL Shopping Centers: os
      # cinco primeiros cartões com `vertical_key`, todos `consumes` VAZIO —
      # sem redeploy do apps/api. Camadas finas sobre os Domains genéricos.
      # ⭐ O Módulo 38 (mall): o primeiro vertical — lojistas, segmento texto
      # livre, a unidade física por id solto ao spc; active ↔ archived (o
      # DIVERGE do hr).
      - name: aplicar 0053_mall.sql
        run: $PSQL -f supabase/migrations/0053_mall.sql

      # ⭐ O Módulo 39 (lease): camada comercial sobre o ctr (id solto — não
      # reescreve a vigência); o relatório de vendas é ato imutável.
      - name: aplicar 0054_lease.sql
        run: $PSQL -f supabase/migrations/0054_lease.sql

      # ⭐ O Módulo 40 (fund): livro próprio de contribuições e gastos; o saldo
      # NUNCA fica negativo (o DIVERGE do bank/inv).
      - name: aplicar 0055_fund.sql
        run: $PSQL -f supabase/migrations/0055_fund.sql

      # ⭐ O Módulo 41 (park): a identidade do vis — entrada/saída carimbadas
      # pelo servidor, correção é registro novo.
      - name: aplicar 0056_park.sql
        run: $PSQL -f supabase/migrations/0056_park.sql

      # ⭐ O Módulo 42 (sec): a ÚLTIMA peça — só a RONDA (o incidente é occ);
      # postos do tenant e o livro de rondas imutável. 42/42 — campanha completa.
      - name: aplicar 0057_sec.sql
        run: $PSQL -f supabase/migrations/0057_sec.sql

      # ⭐ ONDA DEZ (Fase 2) — completar o Domain Compras (Módulos 43–47).
      # Fornecedores · Cotações · Recebimento · Avaliação de fornecedores ·
      # Estoque mínimo. Todos `consumes` vazio — sem redeploy do apps/api.
      - name: aplicar 0058_vendor.sql
        run: $PSQL -f supabase/migrations/0058_vendor.sql
      - name: aplicar 0059_rfq.sql
        run: $PSQL -f supabase/migrations/0059_rfq.sql
      - name: aplicar 0060_recv.sql
        run: $PSQL -f supabase/migrations/0060_recv.sql
      - name: aplicar 0061_vperf.sql
        run: $PSQL -f supabase/migrations/0061_vperf.sql
      # ⭐⭐ O Módulo 47 (reorder): guarda SÓ a configuração; a comparação
      # "estoque < mínimo" é da tela. A migration NÃO lê o schema `inv` —
      # há guarda no mapa SCHEMA_DE abaixo que reprova se referenciar.
      - name: aplicar 0062_reorder.sql
        run: $PSQL -f supabase/migrations/0062_reorder.sql

      # ⭐ ONDA ONZE (Fase 2) — o Domain Supply Chain (Módulos 48–52), SEPARADO
      # de Compras (Taxonomia §5). Planejamento de demanda · S&OP · Distribuição
      # · Centros de distribuição · Performance logística. Todos `consumes`
      # vazio — sem redeploy do apps/api.
      - name: aplicar 0063_dem.sql
        run: $PSQL -f supabase/migrations/0063_dem.sql
      # ⚠️ O sop referencia o plano do dem por id solto — NÃO lê o schema `dem`
      # (guarda SCHEMA_DE abaixo).
      - name: aplicar 0064_sop.sql
        run: $PSQL -f supabase/migrations/0064_sop.sql
      - name: aplicar 0065_dc.sql
        run: $PSQL -f supabase/migrations/0065_dc.sql
      # ⚠️ disp e logperf ligam-se ao dc por id solto — NÃO leem o schema `dc`.
      - name: aplicar 0066_disp.sql
        run: $PSQL -f supabase/migrations/0066_disp.sql
      - name: aplicar 0067_logperf.sql
        run: $PSQL -f supabase/migrations/0067_logperf.sql

      # ⭐ ONDA DOZE parte 1/2 (Fase 2) — o Domain PMO & Projetos (Módulos 53–57),
      # o MAIOR do mapa. Projetos · Cronogramas · Kanban · Recursos · Custos.
      # Todos `consumes` vazio — sem redeploy do apps/api.
      - name: aplicar 0068_proj.sql
        run: $PSQL -f supabase/migrations/0068_proj.sql
      # ⚠️ sched/kanban/alloc/pcost ligam-se ao proj por id solto — NÃO leem o
      # schema `proj` (guarda SCHEMA_DE abaixo); o alloc também não lê o `hr`.
      - name: aplicar 0069_sched.sql
        run: $PSQL -f supabase/migrations/0069_sched.sql
      - name: aplicar 0070_kanban.sql
        run: $PSQL -f supabase/migrations/0070_kanban.sql
      - name: aplicar 0071_alloc.sql
        run: $PSQL -f supabase/migrations/0071_alloc.sql
      - name: aplicar 0072_pcost.sql
        run: $PSQL -f supabase/migrations/0072_pcost.sql

      # ONDA TREZE (parte 2/2) — FECHA o Domain PMO & Projetos (Módulos 58–62).
      # Scrum · Gantt · Riscos · Timesheet · Portfólio — com esta onda o PMO
      # tem as 10 capacidades. Todos `consumes` vazio — sem redeploy do apps/api.
      # ⚠️ gantt→sched, risk/timesheet/pfolio→proj e timesheet→hr são id solto —
      # NÃO leem o schema alheio (guarda SCHEMA_DE abaixo).
      - name: aplicar 0073_scrum.sql
        run: $PSQL -f supabase/migrations/0073_scrum.sql
      - name: aplicar 0074_gantt.sql
        run: $PSQL -f supabase/migrations/0074_gantt.sql
      - name: aplicar 0075_risk.sql
        run: $PSQL -f supabase/migrations/0075_risk.sql
      - name: aplicar 0076_timesheet.sql
        run: $PSQL -f supabase/migrations/0076_timesheet.sql
      - name: aplicar 0077_pfolio.sql
        run: $PSQL -f supabase/migrations/0077_pfolio.sql

      # ONDA QUATORZE (Fase 2) — ABRE o Domain 🧪 Qualidade (Módulos 63–66).
      # Não conformidades · Auditorias · CAPA · Requisitos ISO. As outras 3
      # capacidades (Indicadores · Documentos de qualidade · Procedimentos) já
      # são o `goal`/`pol` e ficam DECLARADAS FORA (anti-duplicação). Todos
      # `consumes` vazio — sem redeploy do apps/api.
      # ⚠️ nc→capa e audit→nc e capa→nc são id solto — NÃO leem o schema alheio
      # (guarda SCHEMA_DE abaixo). A FK audit.findings→audit.audits é INTRA-schema.
      - name: aplicar 0078_nc.sql
        run: $PSQL -f supabase/migrations/0078_nc.sql
      - name: aplicar 0079_audit.sql
        run: $PSQL -f supabase/migrations/0079_audit.sql
