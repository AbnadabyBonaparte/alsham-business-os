      # ⭐ ONDA GOVERNO (Fase 3) — o Vertical 🏛 Governo (proc · ombuds · bid ·
      # fisc). proc = Lei das Etapas do ops + protocolo + decisão terminal;
      # ombuds = anonimato-físico do whistle; bid = "comprador premia" do rfq +
      # edital; fisc = roster + livro imutável do sec. Auto de infração e
      # Tributos FORA (Lei 3). Nenhum consome evento.
