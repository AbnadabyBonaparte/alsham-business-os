          [ "$X" = "1" ] || { echo "::error::a exclusion constraint do spc sumiu — o conflito virou sorte"; exit 1; }
          # E é PARCIAL: a cancelada libera o período sozinha.
          P=$($PSQL -tAc "select count(*) from pg_constraint c
                            join pg_namespace n on n.oid=c.connamespace
                           where n.nspname='spc' and c.conname='spc_reservations_no_overlap'
                             and pg_get_constraintdef(c.oid) ilike '%booked%';")
          [ "$P" = "1" ] || { echo "::error::a exclusion deixou de ser parcial — cancelada não libera mais"; exit 1; }
          # Nenhum enum no schema.
          E=$($PSQL -tAc "select count(*) from pg_type t
                            join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='spc' and t.typtype='e';")
          [ "$E" = "0" ] || { echo "::error::apareceu enum no schema spc"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='spc' and privilege_type='DELETE'
