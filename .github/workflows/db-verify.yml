name: db-verify

# O SENTINELA em forma de CI.
#
# Sobe um Postgres 17 limpo, aplica as migrations na ordem, aplica o seed duas
# vezes (para provar idempotência) e roda o teste de isolamento com usuário
# real. Toda mudança futura de schema que quebrar o isolamento é barrada aqui,
# antes de chegar na main.
#
# É a diferença entre "RLS escrita" e "RLS que funciona" — e é a lição paga do
# suna-core (Balanço de Tecnologia §5), que nasceu com RLS aberta e virou P0.
#
# Nada aqui toca banco remoto, projeto Supabase ou segredo. O banco é efêmero
# e morre com o job.

on:
  push:
    branches: ['**']
    paths:
      - 'supabase/**'
      - 'packages/**'
      - '.github/workflows/db-verify.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/**'
      - '.github/workflows/db-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: schema aplica, isola e não vaza
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 17: a mesma versão dos 12 bancos do império
        # (Balanço Supabase — "todos Postgres 17 no Supabase").
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_verify
      # Qualquer erro de SQL derruba o passo. Sem falha silenciosa.
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      # ---------------------------------------------------------------------
      # 1. APLICAR — a prova que o parser não dá
      # ---------------------------------------------------------------------
      - name: shim do Supabase (auth.users, auth.uid, papéis)
        run: $PSQL -f supabase/tests/00_supabase_shim.sql

      - name: aplicar 0001_core.sql
        run: $PSQL -f supabase/migrations/0001_core.sql

      - name: aplicar 0002_recon.sql
        run: $PSQL -f supabase/migrations/0002_recon.sql

      # ---------------------------------------------------------------------
      # 2. SEED — e a prova de que reaplicar não muda nada
      # ---------------------------------------------------------------------
      - name: aplicar o seed de plataforma
        run: $PSQL -f supabase/seed/0001_platform.sql

      - name: reaplicar o seed e provar idempotência
        run: |
          SNAP="select (select count(*) from core.roles)||'/'||\
                       (select count(*) from core.role_permissions)||'/'||\
                       (select count(*) from core.module_registry)||'/'||\
                       (select count(*) from core.plan_limits)"
          ANTES=$($PSQL -tAc "$SNAP")
          $PSQL -q -f supabase/seed/0001_platform.sql
          $PSQL -q -f supabase/seed/0001_platform.sql
          DEPOIS=$($PSQL -tAc "$SNAP")
          echo "após 1x: $ANTES | após 3x: $DEPOIS"
          [ "$ANTES" = "$DEPOIS" ] || { echo "::error::seed NÃO é idempotente"; exit 1; }

      # ---------------------------------------------------------------------
      # 3. AS INVARIANTES DE SEGURANÇA — as mesmas do runbook
      # ---------------------------------------------------------------------
      - name: RLS ligada e forçada em toda tabela
        run: |
          FALTA=$($PSQL -tAc "
            select coalesce(string_agg(n.nspname||'.'||c.relname, ', '), '')
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname in ('core','recon') and c.relkind = 'r'
               and (not c.relrowsecurity or not c.relforcerowsecurity);")
          [ -z "$FALTA" ] || { echo "::error::sem RLS enable+force: $FALTA"; exit 1; }
          $PSQL -c "select n.nspname as schema, count(*) as tabelas
                      from pg_class c join pg_namespace n on n.oid=c.relnamespace
                     where n.nspname in ('core','recon') and c.relkind='r'
                     group by 1 order by 1;"

      - name: nenhuma policy USING (true)
        run: |
          ABERTAS=$($PSQL -tAc "
            select coalesce(string_agg(c.relname||'.'||p.polname, ', '), '')
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname in ('core','recon')
               and pg_get_expr(p.polqual, p.polrelid) = 'true';")
          [ -z "$ABERTAS" ] || { echo "::error::policy aberta (lição paga do suna-core): $ABERTAS"; exit 1; }

      - name: nada exposto em public, nada para anon
        run: |
          PUB=$($PSQL -tAc "select count(*) from pg_class c
                              join pg_namespace n on n.oid=c.relnamespace
                             where n.nspname='public' and c.relkind='r';")
          [ "$PUB" = "0" ] || { echo "::error::$PUB tabela(s) em public — expostas via API"; exit 1; }
          ANON=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                              where grantee='anon' and table_schema in ('core','recon');")
          [ "$ANON" = "0" ] || { echo "::error::anon tem $ANON grant(s) no Business OS"; exit 1; }

      - name: o seed não semeou tenant nem usuário
        run: |
          N=$($PSQL -tAc "select (select count(*) from core.tenants)
                               + (select count(*) from auth.users);")
          [ "$N" = "0" ] || { echo "::error::o seed de catálogo criou $N linha(s) de tenant/usuário"; exit 1; }

      # ---------------------------------------------------------------------
      # 4. ISOLAMENTO COM USUÁRIO REAL — a prova que o suna-core nunca teve
      # ---------------------------------------------------------------------
      - name: teste de isolamento multi-tenant
        run: $PSQL -f supabase/tests/01_rls_isolation.sql

  contract:
    name: manifesto, tipos e domínio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ SEM `version:` aqui, de propósito.
      #
      # A versão do pnpm tem UMA fonte só: `packageManager` no package.json da
      # raiz. Declarar `version: 9` aqui também fazia a action abortar com
      # "Multiple versions of pnpm specified" — e o job morria no setup, antes
      # de instalar qualquer coisa. Sol Único vale para ferramenta também.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trava a divergência entre o ModuleManifest e o seed do catálogo:
      # se a Store passar a anunciar algo que o código não faz, quebra aqui.
      - run: pnpm typecheck
      - run: pnpm test

      # É isto que a Vercel roda. Se passa aqui, passa lá.
      - run: pnpm build:portal

      # ⭐ A REGRA DE OURO, VERIFICADA (CLAUDE.md §5.3).
      # `apps/` é a PELE. Se alguém escrever regra de negócio numa tela
      # "porque era mais rápido", o build continuaria passando — e a dívida
      # entraria em silêncio. Este passo não deixa.
      - name: nenhuma cor fora do canon em apps/
        run: |
          SOLTO=$(grep -rInE '#[0-9a-fA-F]{3,8}\b' apps --include='*.tsx' --include='*.ts' || true)
          if [ -n "$SOLTO" ]; then
            echo "::error::HEX solto em apps/ — toda cor vem de var(--bos-*)"; echo "$SOLTO"; exit 1
          fi
          CRUA=$(grep -rInE '\b(bg|text|border)-(white|black|gray|slate|zinc|neutral|stone|red|blue|green|amber|yellow|purple|pink|indigo)-?[0-9]*\b' apps --include='*.tsx' || true)
          if [ -n "$CRUA" ]; then
            echo "::error::classe de cor crua do Tailwind em apps/ — use os tokens bos-*"; echo "$CRUA"; exit 1
          fi

      - name: o motor não foi reimplementado em apps/
        run: |
          # A tela CHAMA suggestMatches; se um dia ela declarar a própria, o
          # coração terá migrado para a pele.
          if grep -rInE 'function (suggestMatches|scorePair|unmatchedLines)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::motor de domínio redeclarado em apps/ — ele vive em packages/"; exit 1
          fi
          # Procura a CHAMADA no CÓDIGO, ignorando linhas de comentário.
          #
          # Duas versões anteriores desta guarda passaram na sabotagem: a
          # primeira casava o nome em qualquer lugar; a segunda exigia
          # `suggestMatches(` mas o próprio JSDoc da página tem essa string
          # com parêntese. Guarda que não é testada contra sabotagem não é
          # guarda — é decoração.
          CODIGO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/conciliacao/page.tsx)
          echo "$CODIGO" | grep -Eq 'suggestMatches\(' \
            || { echo "::error::a tela de conciliação deixou de chamar o motor do pacote"; exit 1; }
          echo "$CODIGO" | grep -Eq 'unmatchedLines\(' \
            || { echo "::error::a tela deixou de usar unmatchedLines do pacote"; exit 1; }
