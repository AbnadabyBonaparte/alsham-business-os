name: db-verify

# O SENTINELA em forma de CI.
#
# Sobe um Postgres 17 limpo, aplica as migrations na ordem, aplica o seed duas
# vezes (para provar idempotência) e roda o teste de isolamento com usuário
# real. Toda mudança futura de schema que quebrar o isolamento é barrada aqui,
# antes de chegar na main.
#
# É a diferença entre "RLS escrita" e "RLS que funciona" — e é a lição paga do
# suna-core (Balanço de Tecnologia §5), que nasceu com RLS aberta e virou P0.
#
# Nada aqui toca banco remoto, projeto Supabase ou segredo. O banco é efêmero
# e morre com o job.

on:
  push:
    branches: ['**']
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/**'
      - 'apps/**'
      - '.github/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: schema aplica, isola e não vaza
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 17: a mesma versão dos 12 bancos do império
        # (Balanço Supabase — "todos Postgres 17 no Supabase").
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_verify
      # Qualquer erro de SQL derruba o passo. Sem falha silenciosa.
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      # ---------------------------------------------------------------------
      # 1. APLICAR — a prova que o parser não dá
      # ---------------------------------------------------------------------
      - name: shim do Supabase (auth.users, auth.uid, papéis)
        run: $PSQL -f supabase/tests/00_supabase_shim.sql

      - name: aplicar 0001_core.sql
        run: $PSQL -f supabase/migrations/0001_core.sql

      - name: aplicar 0002_recon.sql
        run: $PSQL -f supabase/migrations/0002_recon.sql

      - name: aplicar 0003_billing.sql
        run: $PSQL -f supabase/migrations/0003_billing.sql

      # `0001` e `0002` estão CONGELADAS (CLAUDE.md §5.4.1) — aplicadas em
      # produção. O CI segue aplicando do zero, e é justamente por isso que ele
      # NÃO detectaria uma edição nelas: correção é migration nova.
      - name: aplicar 0004_marketing.sql
        run: $PSQL -f supabase/migrations/0004_marketing.sql

      - name: aplicar 0005_courier_cron.sql
        run: $PSQL -f supabase/migrations/0005_courier_cron.sql

      - name: aplicar 0006_install.sql
        run: $PSQL -f supabase/migrations/0006_install.sql

      # ⭐ ETAPA 10 — e as duas são SEPARADAS de propósito.
      #
      # `0007` só cria objeto em `ap`; `0008` só cria objeto em `recon`. Cada
      # migration tem um schema dono. Escrever a função `recon.*` dentro do
      # arquivo do módulo de Contas a Pagar obrigaria a guarda "módulo não
      # conhece módulo" a aprender uma exceção — e guarda com exceção é guarda
      # que um dia aceita tudo.
      - name: aplicar 0007_ap.sql
        run: $PSQL -f supabase/migrations/0007_ap.sql

      - name: aplicar 0008_recon_ap_projection.sql
        run: $PSQL -f supabase/migrations/0008_recon_ap_projection.sql

      # ⭐ ETAPA 11 — o Módulo 4, Relacionamentos (CRM base).
      - name: aplicar 0009_crm.sql
        run: $PSQL -f supabase/migrations/0009_crm.sql

      # ⭐ ETAPA 12 — o Módulo 5, Contas a Receber: o espelho consciente do 3.
      - name: aplicar 0010_ar.sql
        run: $PSQL -f supabase/migrations/0010_ar.sql

      # ---------------------------------------------------------------------
      # 2. SEED — e a prova de que reaplicar não muda nada
      # ---------------------------------------------------------------------
      - name: aplicar o seed de plataforma
        run: $PSQL -f supabase/seed/0001_platform.sql

      - name: reaplicar o seed e provar idempotência
        run: |
          SNAP="select (select count(*) from core.roles)||'/'||\
                       (select count(*) from core.role_permissions)||'/'||\
                       (select count(*) from core.module_registry)||'/'||\
                       (select count(*) from core.plan_limits)"
          ANTES=$($PSQL -tAc "$SNAP")
          $PSQL -q -f supabase/seed/0001_platform.sql
          $PSQL -q -f supabase/seed/0001_platform.sql
          DEPOIS=$($PSQL -tAc "$SNAP")
          echo "após 1x: $ANTES | após 3x: $DEPOIS"
          [ "$ANTES" = "$DEPOIS" ] || { echo "::error::seed NÃO é idempotente"; exit 1; }

      # ---------------------------------------------------------------------
      # 3. AS INVARIANTES DE SEGURANÇA — as mesmas do runbook
      # ---------------------------------------------------------------------
      - name: RLS ligada e forçada em toda tabela
        run: |
          FALTA=$($PSQL -tAc "
            select coalesce(string_agg(n.nspname||'.'||c.relname, ', '), '')
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname in ('core','recon','marketing','ap','crm','ar') and c.relkind = 'r'
               and (not c.relrowsecurity or not c.relforcerowsecurity);")
          [ -z "$FALTA" ] || { echo "::error::sem RLS enable+force: $FALTA"; exit 1; }
          $PSQL -c "select n.nspname as schema, count(*) as tabelas
                      from pg_class c join pg_namespace n on n.oid=c.relnamespace
                     where n.nspname in ('core','recon','marketing','ap','crm','ar') and c.relkind='r'
                     group by 1 order by 1;"

      - name: nenhuma policy USING (true)
        run: |
          ABERTAS=$($PSQL -tAc "
            select coalesce(string_agg(c.relname||'.'||p.polname, ', '), '')
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname in ('core','recon','marketing','ap','crm','ar')
               and pg_get_expr(p.polqual, p.polrelid) = 'true';")
          [ -z "$ABERTAS" ] || { echo "::error::policy aberta (lição paga do suna-core): $ABERTAS"; exit 1; }

      - name: nada exposto em public, nada para anon
        run: |
          PUB=$($PSQL -tAc "select count(*) from pg_class c
                              join pg_namespace n on n.oid=c.relnamespace
                             where n.nspname='public' and c.relkind='r';")
          [ "$PUB" = "0" ] || { echo "::error::$PUB tabela(s) em public — expostas via API"; exit 1; }
          ANON=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                              where grantee='anon' and table_schema in ('core','recon','marketing','ap','crm','ar');")
          [ "$ANON" = "0" ] || { echo "::error::anon tem $ANON grant(s) no Business OS"; exit 1; }

      - name: o seed não semeou tenant nem usuário
        run: |
          N=$($PSQL -tAc "select (select count(*) from core.tenants)
                               + (select count(*) from auth.users);")
          [ "$N" = "0" ] || { echo "::error::o seed de catálogo criou $N linha(s) de tenant/usuário"; exit 1; }

      # ---------------------------------------------------------------------
      # 4. ISOLAMENTO COM USUÁRIO REAL — a prova que o suna-core nunca teve
      # ---------------------------------------------------------------------
      - name: teste de isolamento multi-tenant
        run: $PSQL -f supabase/tests/01_rls_isolation.sql

      # A contabilidade de uso é o dado que vira DINHEIRO. Vazamento aqui é o
      # concorrente lendo o volume de operação do vizinho.
      - name: teste de isolamento da contabilidade de uso
        run: $PSQL -f supabase/tests/02_usage_isolation.sql

      # ⭐ A PROVA DA ETAPA 7, no banco e não só no TypeScript.
      #
      # Os testes do pacote provam a LÓGICA do consumo com uma projeção de
      # mentira. Este prova o EFEITO: o fato entra uma vez, a reentrega não
      # repete, a decisão de um tenant não carimba a campanha do outro, e o
      # cliente não consegue forjar a própria aprovação de verba.
      #
      # A terceira importa porque `record_spend_decision` é SECURITY DEFINER —
      # e função SECURITY DEFINER escrita sem cuidado é exatamente como se
      # atravessa a RLS sem perceber.
      - name: teste do consumo entre módulos (Módulo 2)
        run: $PSQL -f supabase/tests/03_marketing_consumption.sql

      # A visão de saúde tem de responder assim que o arquivo é aplicado — ela
      # é como o dono descobre que o correio parou. Uma visão que só existe no
      # papel não avisa ninguém de nada.
      # ⭐ A PROVA DA ETAPA 9: instalar dá acesso, desinstalar NÃO apaga dado.
      - name: teste do instalador em runtime
        run: $PSQL -f supabase/tests/04_install_module.sql

      # ⭐⭐ A PROVA DA ETAPA 10: O TRIÂNGULO.
      #
      # O Módulo 3 emite; o Módulo 1 — o mais antigo, o que ninguém escreveu
      # para escutar — projeta. Onze cenários, e três deles são o que nenhum
      # teste de pacote alcança:
      #
      #   · a origem gravada vem do ENVELOPE, não de constante — um produtor
      #     fictício (`erp-bridge`) grava a origem DELE;
      #   · o mesmo `DOC-TRI-0001` nos dois tenants não se mistura;
      #   · um usuário real NÃO executa `recon.record_external_payable`, que é
      #     SECURITY DEFINER — dar essa caneta à tela deixaria o cliente forjar
      #     um título "vindo de outro módulo" por dentro da RLS.
      - name: teste do triângulo (Módulo 3 → Módulo 1)
        run: $PSQL -f supabase/tests/05_ap_triangle.sql

      # ⭐ A PROVA DA ETAPA 11: o Módulo 4 no banco.
      #
      # Nove cenários, e três deles são o que nenhum teste de pacote alcança:
      #
      #   · a interação é IMUTÁVEL — negada até para quem roda como DONO DO
      #     BANCO, que é onde as outras duas camadas não valem;
      #   · arquivar a contraparte NÃO leva o histórico junto;
      #   · a chave estrangeira COMPOSTA impede a interação de apontar para a
      #     contraparte de outro tenant. Sem ela, a RLS de leitura esconderia o
      #     estrago em vez de impedi-lo — o dado errado existiria, calado.
      - name: teste do Módulo 4 (isolamento, imutabilidade, histórico)
        run: $PSQL -f supabase/tests/06_crm_isolation.sql

      # ⭐⭐ A PROVA DA ETAPA 12: o espelho, com o contraste no mesmo banco.
      #
      # Sete cenários, e o que nenhum teste de pacote alcança é o par 5 / 5.1:
      # **receber a maior PASSA no `ar`, e pagar a maior é RECUSADO no `ap`** —
      # as duas afirmações rodam contra o mesmo Postgres, no mesmo arquivo. Se
      # alguém "uniformizar" os dois módulos, um dos dois cenários quebra.
      - name: teste do Módulo 5 (isolamento, transições e a divergência)
        run: $PSQL -f supabase/tests/07_ar_isolation.sql

      # ⛔ CANCELAR É ESTADO, NUNCA DELETE — conferido no banco aplicado.
      - name: nenhuma porta de DELETE em ar.receivables
        run: |
          # Filtra o grantee: o DONO da tabela sempre tem DELETE, implicitamente
          # e sem como tirar. A regra é que o CLIENTE não tem a porta. (Lição da
          # Etapa 10, onde a primeira versão desta guarda reprovou o repositório
          # inteiro por contar o privilégio do owner.)
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='ar' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em ar ao cliente"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='ar' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em ar"; exit 1; }

      # ⭐⭐ O ESPELHO É CONSCIENTE — conferido NO BANCO, não no arquivo.
      #
      # O `ap` recusa pagar a maior; o `ar` aceita receber a maior. As duas
      # coisas são decisões, e as duas têm de continuar verdadeiras ao mesmo
      # tempo. Aqui elas são conferidas contra as constraints APLICADAS: um
      # "conserto por simetria" em qualquer um dos lados reprova.
      - name: a divergência do espelho continua de pé
        run: |
          AP=$($PSQL -tAc "select count(*) from pg_constraint c
                             join pg_class t on t.oid = c.conrelid
                             join pg_namespace n on n.oid = t.relnamespace
                            where n.nspname='ap' and c.conname='payables_no_overpay';")
          [ "$AP" = "1" ] || {
            echo "::error::o ap perdeu payables_no_overpay — o espelho perdeu o contraste"; exit 1; }
          AR=$($PSQL -tAc "select count(*) from pg_constraint c
                             join pg_class t on t.oid = c.conrelid
                             join pg_namespace n on n.oid = t.relnamespace
                            where n.nspname='ar'
                              and pg_get_constraintdef(c.oid) ilike '%received_amount_cents <= amount_cents%';")
          [ "$AR" = "0" ] || {
            echo "::error::o ar ganhou uma constraint de não receber a maior — ver 0010_ar.sql §2.1"; exit 1; }
          echo "espelho intacto: o ap recusa pagar a maior, o ar aceita receber a maior."

      # ⭐ O CATÁLOGO TEM CINCO CARTÕES, e o quinto consome ZERO.
      #
      # Lei 7 conferida no banco: o Módulo 1 ainda não casa crédito, então
      # declarar consumo faria a Store anunciar uma conciliação de recebimentos
      # que não acontece.
      - name: o quinto cartão não promete o que o Módulo 1 não faz
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='ar';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo ar declara $C consumo(s) — e o motor do recon recusa linha de crédito (Lei 7)"
            exit 1; }

      # ⛔ A INTERAÇÃO É IMUTÁVEL, CONFERIDA NO BANCO APLICADO.
      #
      # Fato consumado não se edita. A decisão vive em três camadas, e esta
      # guarda confere as duas que são de privilégio — no banco, não no
      # arquivo: é a diferença entre a regra escrita e a regra em vigor.
      - name: nenhuma porta de escrita em crm.interactions
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(privilege_type, ','), '')
                            from information_schema.role_table_grants
                           where table_schema='crm' and table_name='interactions'
                             and privilege_type in ('UPDATE','DELETE')
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ -z "$G" ] || { echo "::error::alguém concedeu $G em crm.interactions — fato consumado não se edita"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and c.relname='interactions'
                             and p.polcmd in ('w','d');")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de UPDATE/DELETE em crm.interactions"; exit 1; }
          # E a terceira camada, que protege de nós mesmos: o gatilho que
          # recusa até para o dono do banco.
          T=$($PSQL -tAc "select count(*) from pg_trigger t
                            join pg_class c on c.oid=t.tgrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and c.relname='interactions'
                             and t.tgname='interactions_immutable' and not t.tgisinternal;")
          [ "$T" = "1" ] || { echo "::error::o gatilho de imutabilidade sumiu de crm.interactions"; exit 1; }
          echo "crm.interactions continua imutável nas três camadas."

      # ⛔ ARQUIVAR É ESTADO, NUNCA DELETE — nas duas tabelas do módulo.
      - name: nenhuma porta de DELETE em crm
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='crm' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em crm ao cliente"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em crm"; exit 1; }

      # ⭐ O CATÁLOGO TEM QUATRO CARTÕES, e o quarto consome ZERO.
      #
      # Não é enfeite: é a Lei 7 conferida no banco. Se alguém declarar consumo
      # no seed sem handler construído, a Store passa a anunciar uma integração
      # que não acontece — e ninguém veria erro nenhum.
      - name: o catálogo conta a verdade sobre quem consome o quê
        run: |
          $PSQL -c "select module_id, status,
                           jsonb_array_length(events_emits)    as emite,
                           jsonb_array_length(events_consumes) as consome
                      from core.module_registry order by module_id;"
          # ⚠️ **CONTA OS MÓDULOS REAIS, não a tabela inteira** — e a distinção
          # custou uma falha antes de entrar.
          #
          # `04_install_module.sql` insere módulos FICTÍCIOS no catálogo para
          # provar o instalador: um `rascunho` (para provar que draft não
          # aparece na vitrine) e um `terceiro` publicado (para provar o teto do
          # plano). Uma contagem ingênua de `status='published'` daria 5 e
          # reprovaria o repositório inteiro, por causa do fixture de outro
          # teste.
          #
          # Só apareceu porque os números foram conferidos contra o banco.
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where status='published'
                             and module_id in ('recon','marketing','ap','crm','ar');")
          [ "$N" = "5" ] || { echo "::error::o catálogo tem $N dos 5 módulos reais publicados"; exit 1; }
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='crm';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo crm declara $C consumo(s) no catálogo — e o handler não existe (Lei 7)"
            exit 1; }

      # ⛔ CANCELAR É ESTADO, NUNCA DELETE.
      #
      # Um título apagado é conta paga sem documento. A decisão está em duas
      # camadas — sem GRANT e sem policy — e esta guarda confere as duas no
      # BANCO APLICADO, não no arquivo: é a diferença entre a regra escrita e a
      # regra em vigor.
      - name: nenhuma porta de DELETE em ap.payables
        run: |
          # ⚠️ FILTRA O GRANTEE, e a primeira versão desta guarda não filtrava —
          # teria reprovado o repositório inteiro no primeiro run.
          #
          # `information_schema.role_table_grants` inclui os privilégios
          # IMPLÍCITOS do dono da tabela, e o dono sempre tem todos, inclusive
          # DELETE. Não há como tirar, e não faz sentido tentar: a regra é que o
          # CLIENTE não tem porta de DELETE, não que ninguém no banco tenha.
          #
          # Foi o único defeito que a contagem contra o banco revelou — e é
          # exatamente por isso que os números vêm do banco, nunca de cabeça.
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='ap' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em ap ao cliente — cancelar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='ap' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em ap"; exit 1; }
          echo "ap.payables continua sem porta de DELETE."

      # ⛔ O SEED NÃO CONCEDE PERMISSÃO DE MÓDULO.
      #
      # Ele concedia, ao papel de SISTEMA `admin`, como ponte até o instalador
      # existir. Papel de sistema vale em TODO tenant: qualquer tenant novo já
      # nascia com os módulos, sem instalar e sem ocupar vaga no plano.
      #
      # O instalador nasceu e a ponte saiu. Esta guarda existe para que ela não
      # volte por conveniência — o sintoma seria invisível com um tenant só.
      - name: nenhuma permissão de módulo em papel de sistema
        run: |
          VAZOU=$($PSQL -tAc "
            select coalesce(string_agg(permission_key, ', '), '')
              from core.role_permissions
             where tenant_id is null and module_id <> 'core';")
          [ -z "$VAZOU" ] || {
            echo "::error::o seed concedeu permissão de módulo a papel de sistema: $VAZOU"
            echo "isso vaza o módulo para TODO tenant, sem instalar e sem ocupar vaga no plano"
            exit 1; }
          echo "nenhum vazamento: permissão de módulo só existe onde alguém instalou."

      - name: a visão de saúde da fila responde
        run: |
          $PSQL -c "select * from core.courier_health order by status;"
          VEREDITO=$($PSQL -tAc "select veredito from core.courier_status();")
          echo "veredito: $VEREDITO"
          case "$VEREDITO" in
            OK|ATRASADO|PARADO|ATENCAO) ;;
            *) echo "::error::core.courier_status() devolveu algo inesperado: $VEREDITO"; exit 1 ;;
          esac
          # Nem a visão nem a função podem estar abertas: operação é assunto
          # de quem opera, e `core.event_outbox` não tem policy nenhuma.
          ABERTO=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                                where grantee in ('anon','authenticated')
                                  and table_name = 'courier_health';")
          [ "$ABERTO" = "0" ] || { echo "::error::a visão de saúde está exposta a $ABERTO papel(is)"; exit 1; }

  correio:
    name: o correio contra Postgres de verdade
    runs-on: ubuntu-latest

    # ⭐ ESTE JOB EXISTE PORQUE MEMÓRIA NÃO PROVA CONCORRÊNCIA.
    #
    # Até a Etapa 7, todas as garantias do correio foram provadas contra um
    # `OutboxStore` de memória. Contra Postgres apareceram DOIS defeitos que o
    # mock não podia revelar:
    #
    #   1. a tomada não reivindicava nada — dois entregadores pegavam os
    #      mesmos eventos;
    #   2. um handler que falhava nunca era reexecutado, e o evento acabava
    #      gravado como `delivered` sem nunca ter sido entregue.
    #
    # Este job é o que impede que voltem.

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_correio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_correio
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bos_correio

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: montar o banco
        run: |
          $PSQL -q -f supabase/tests/00_supabase_shim.sql
          $PSQL -q -f supabase/migrations/0001_core.sql
          $PSQL -q -f supabase/migrations/0002_recon.sql
          $PSQL -q -f supabase/migrations/0003_billing.sql
          $PSQL -q -f supabase/migrations/0004_marketing.sql
          $PSQL -q -f supabase/migrations/0005_courier_cron.sql
          $PSQL -q -f supabase/migrations/0006_install.sql
          $PSQL -q -f supabase/migrations/0007_ap.sql
          $PSQL -q -f supabase/migrations/0008_recon_ap_projection.sql
          $PSQL -q -f supabase/migrations/0009_crm.sql
          $PSQL -q -f supabase/migrations/0010_ar.sql
          $PSQL -q -f supabase/seed/0001_platform.sql

      # ⚠️ Sem `DATABASE_URL` os testes do store se PULAM — de propósito, para
      # que ninguém os veja "passar" sem banco. Aqui a variável existe, então
      # pular seria bug: este passo reprova se algum teste for pulado, ou se
      # nenhum rodar.
      - name: o correio contra Postgres (store, concorrência, composição)
        run: |
          set -o pipefail
          pnpm test:api 2>&1 | tee /tmp/api.log
          PULADOS=$(grep -oP '^# skipped \K\d+' /tmp/api.log | head -1)
          PASSOU=$(grep -oP '^# pass \K\d+' /tmp/api.log | head -1)
          echo "passaram=$PASSOU pulados=$PULADOS"
          [ "${PULADOS:-0}" = "0" ] || { echo "::error::$PULADOS teste(s) pulados — o job ficaria verde sem provar nada"; exit 1; }
          # O piso sobe quando a suíte cresce. Na Etapa 10 o bloco do triângulo
          # acrescentou 9 testes; deixar o piso em 15 faria o job ficar verde
          # com o arquivo do triângulo inteiro fora da coleta.
          [ "${PASSOU:-0}" -gt 30 ] || { echo "::error::só $PASSOU teste(s) rodaram; o arquivo não foi coletado"; exit 1; }

  contract:
    name: manifesto, tipos e domínio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ SEM `version:` aqui, de propósito.
      #
      # A versão do pnpm tem UMA fonte só: `packageManager` no package.json da
      # raiz. Declarar `version: 9` aqui também fazia a action abortar com
      # "Multiple versions of pnpm specified" — e o job morria no setup, antes
      # de instalar qualquer coisa. Sol Único vale para ferramenta também.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trava a divergência entre o ModuleManifest e o seed do catálogo:
      # se a Store passar a anunciar algo que o código não faz, quebra aqui.
      - run: pnpm typecheck
      - run: pnpm test

      # A Lei 7 com o sinal trocado: negar o que já existe.
      #
      # As Etapas 4, 5 e 6 construíram parser, telas, correio e contabilidade
      # de uso — e SEIS documentos continuaram dizendo que nada disso existia,
      # inclusive dois de leitura obrigatória no VERTEX. Nenhuma guarda pegou,
      # porque defasagem não exige que ninguém escreva nada: basta não apagar.
      #
      # `pnpm test:docs` roda o autoteste da guarda (ela ainda morde?);
      # `pnpm verificar:docs` varre o repositório de verdade.
      - run: pnpm test:docs
      - run: pnpm verificar:docs

      # É isto que a Vercel roda. Se passa aqui, passa lá.
      - run: pnpm build:portal

      # ⭐ A REGRA DE OURO, VERIFICADA (CLAUDE.md §5.3).
      # `apps/` é a PELE. Se alguém escrever regra de negócio numa tela
      # "porque era mais rápido", o build continuaria passando — e a dívida
      # entraria em silêncio. Este passo não deixa.
      - name: nenhuma cor fora do canon em apps/
        run: |
          SOLTO=$(grep -rInE '#[0-9a-fA-F]{3,8}\b' apps --include='*.tsx' --include='*.ts' || true)
          if [ -n "$SOLTO" ]; then
            echo "::error::HEX solto em apps/ — toda cor vem de var(--bos-*)"; echo "$SOLTO"; exit 1
          fi
          CRUA=$(grep -rInE '\b(bg|text|border)-(white|black|gray|slate|zinc|neutral|stone|red|blue|green|amber|yellow|purple|pink|indigo)-?[0-9]*\b' apps --include='*.tsx' || true)
          if [ -n "$CRUA" ]; then
            echo "::error::classe de cor crua do Tailwind em apps/ — use os tokens bos-*"; echo "$CRUA"; exit 1
          fi

      - name: o motor não foi reimplementado em apps/
        run: |
          # A tela CHAMA o domínio; se um dia ela declarar o próprio, o
          # coração terá migrado para a pele. Inclui o parser: ler extrato é
          # regra de negócio (decide sinal, arredondamento, fuso, duplicata).
          if grep -rInE 'function (suggestMatches|scorePair|unmatchedLines|summarizeStatement|parseOfx|parseCsv|parseStatement|parseAmountToCents|parseDate)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::motor de domínio redeclarado em apps/ — ele vive em packages/"; exit 1
          fi
          # Procura a CHAMADA no CÓDIGO, ignorando linhas de comentário.
          #
          # Duas versões anteriores desta guarda passaram na sabotagem: a
          # primeira casava o nome em qualquer lugar; a segunda exigia
          # `suggestMatches(` mas o próprio JSDoc da página tem essa string
          # com parêntese. Guarda que não é testada contra sabotagem não é
          # guarda — é decoração.
          CODIGO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/conciliacao/page.tsx)
          echo "$CODIGO" | grep -Eq 'suggestMatches\(' \
            || { echo "::error::a tela de conciliação deixou de chamar o motor do pacote"; exit 1; }
          echo "$CODIGO" | grep -Eq 'unmatchedLines\(' \
            || { echo "::error::a tela deixou de usar unmatchedLines do pacote"; exit 1; }

          FECHA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/fechamento/page.tsx)
          echo "$FECHA" | grep -Eq 'summarizeStatement\(' \
            || { echo "::error::a tela de fechamento deixou de usar summarizeStatement do pacote"; exit 1; }

          IMPORTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/actions.ts)
          echo "$IMPORTA" | grep -Eq 'parseStatement\(' \
            || { echo "::error::a importação deixou de usar o parser do pacote — ler extrato é regra de negócio"; exit 1; }

          # Módulo 2: a máquina de estados da campanha é DECISÃO, e decisão
          # mora no pacote. Escrever `if (status === 'draft')` numa Server
          # Action é o jeito mais provável de a regra migrar para a pele.
          if grep -rInE 'function (planTransition|canTransition|budgetStatusFor)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a máquina de estados da campanha foi redeclarada em apps/"; exit 1
          fi
          MKT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/marketing-actions.ts)
          echo "$MKT" | grep -Eq 'planTransition\(' \
            || { echo "::error::a ação de campanha deixou de chamar o motor do pacote"; exit 1; }
          echo "$MKT" | grep -Eq 'budgetStatusFor\(' \
            || { echo "::error::a ação deixou de consultar a projeção de verba do pacote"; exit 1; }

          # E a tela não pode reinventar a regra de verba com um `if` próprio.
          if grep -rInE "budgetStatus\s*===?\s*'approved'" \
               apps/portal/src/app apps/portal/src/lib --include='*.ts' --include='*.tsx'; then
            echo "::error::a regra de liberação de verba apareceu em apps/ — ela é settings do tenant, decidida no pacote"; exit 1
          fi

          # Módulo 3: validação do título, ciclo de vida e a conta do saldo são
          # DECISÃO. A forma mais provável de migrarem para a pele é alguém
          # escrever `if (amountCents <= 0)` no Server Action "porque era mais
          # rápido", ou `t.dueDate < hoje` no componente da lista.
          if grep -rInE 'function (validateNewPayable|statusForSettlement|nextStatuses|outstandingCents|isOverdue|canCancel)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contas a pagar foi redeclarado em apps/"; exit 1
          fi
          AP=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ap-actions.ts)
          echo "$AP" | grep -Eq 'validateNewPayable\(' \
            || { echo "::error::a ação de contas a pagar deixou de validar pelo pacote"; exit 1; }
          echo "$AP" | grep -Eq 'canTransition\(' \
            || { echo "::error::a ação deixou de consultar o ciclo de vida do pacote"; exit 1; }
          LISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/payable-list.tsx)
          echo "$LISTA" | grep -Eq 'isOverdue\(' \
            || { echo "::error::a lista deixou de perguntar ao pacote o que está vencido"; exit 1; }
          # O jeito mais provável de a conta de atraso migrar para a tela.
          # ⚠️ Lê CÓDIGO, não prosa — pela QUARTA vez neste repositório.
          #
          # A primeira versão desta guarda reprovou o comentário do próprio
          # componente, que diz "se alguém escrever `t.dueDate < hoje` aqui, a
          # regra passa a existir em dois lugares". A guarda mordeu a
          # documentação que ela existe para proteger.
          #
          # O padrão já é conhecido (§ máquina de estados, § tenant, § Store), e
          # a correção é sempre a mesma: descartar as linhas de comentário.
          ATRASO=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'dueDate\s*<\s*(hoje|today|now)' apps 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$ATRASO" ]; then
            echo "::error::a regra de vencimento apareceu em apps/ — ela é isOverdue(), no pacote"
            echo "$ATRASO"; exit 1
          fi

          # Módulo 4: a busca da carteira, o resumo e o ciclo de vida são
          # DECISÃO. A forma mais provável de migrarem para a pele é alguém
          # escrever `p.displayName.includes(busca)` no componente da lista
          # "porque era mais rápido" — e aí a mesma pergunta passa a ter duas
          # respostas no dia em que a busca também acontecer no servidor.
          if grep -rInE 'function (validateNewParty|validateNewInteraction|matchesQuery|summarizeParties|normalizeTags)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de relacionamentos foi redeclarado em apps/"; exit 1
          fi
          CRM=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/crm-actions.ts)
          for FN in validateNewParty validateNewInteraction canTransition; do
            echo "$CRM" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de relacionamentos deixou de chamar $FN() do pacote"; exit 1; }
          done
          PLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/party-list.tsx)
          echo "$PLISTA" | grep -Eq '\bmatchesQuery\(' \
            || { echo "::error::a lista deixou de usar a busca do pacote"; exit 1; }
          # E o jeito mais provável de a busca migrar para a tela.
          BUSCA=$(grep -rIn --include='*.tsx' --include='*.ts' -E '(displayName|display_name)[^;]{0,40}\.(includes|indexOf|match)\(' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$BUSCA" ]; then
            echo "::error::a busca da carteira apareceu em apps/ — ela é matchesQuery(), no pacote"
            echo "$BUSCA"; exit 1
          fi

          # ⛔ E a tela NÃO reimplementa a imutabilidade da interação com um
          # `if`. Ela não oferece o botão porque a operação não existe — três
          # camadas de banco a recusam. Um caminho de edição em apps/ seria a
          # tela prometendo o que o schema nega.
          EDITA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "from\('interactions'\)[^;]{0,60}\.(update|delete)\(|updateInteraction|deleteInteraction" apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$EDITA" ]; then
            echo "::error::apareceu caminho de editar/apagar interação em apps/ — fato consumado não se edita"
            echo "$EDITA"; exit 1
          fi

          # Módulo 5: saldo, excedente e ciclo de vida são DECISÃO. E aqui há
          # uma armadilha específica do espelho: a conta do saldo escrita à mão
          # (`amountCents - receivedAmountCents`) devolve NEGATIVO no caso de
          # recebimento a maior, que é exatamente o que o pacote evita — e o
          # negativo entraria somando no total em aberto da tela.
          if grep -rInE 'function (validateNewReceivable|statusForReceipt|outstandingCents|overpaidCents|summarizeReceivables)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contas a receber foi redeclarado em apps/"; exit 1
          fi
          AR=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ar-actions.ts)
          for FN in validateNewReceivable canTransition; do
            echo "$AR" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de contas a receber deixou de chamar $FN() do pacote"; exit 1; }
          done
          RLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/receivable-list.tsx)
          for FN in outstandingCents overpaidCents isOverdue; do
            echo "$RLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de recebíveis deixou de usar $FN() do pacote"; exit 1; }
          done
          SALDO=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'amountCents\s*-\s*receivedAmountCents' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SALDO" ]; then
            echo "::error::o saldo a receber foi calculado em apps/ — ele é outstandingCents(), que nunca devolve negativo"
            echo "$SALDO"; exit 1
          fi

      # ⭐⭐ A LEI DO LEGO, VERIFICADA (CLAUDE.md §5.5, regras 3 e 5).
      #
      # A Etapa 7 pôs dois módulos conversando. A tese inteira da plataforma é
      # que eles conversam **por contrato** e não **por código** — e a diferença
      # entre as duas coisas é literalmente um `import` que ninguém revisa.
      #
      # Um `import type` do outro módulo compilaria, passaria nos testes e
      # pareceria inofensivo. E aí desinstalar um módulo quebraria o outro, que
      # é exatamente o que a Store não pode permitir.
      - name: módulo não conhece módulo
        run: |
          FALHOU=0
          MODULOS="finance-reconciliation marketing accounts-payable crm accounts-receivable"

          # 1. Nenhum módulo importa outro módulo, em nenhuma forma.
          for MOD in $MODULOS; do
            for OUTRO in $MODULOS; do
              [ "$MOD" = "$OUTRO" ] && continue
              if grep -rInE "from '@alsham/$OUTRO'|require\('@alsham/$OUTRO'\)" \
                   "packages/$MOD/src" 2>/dev/null; then
                echo "::error::@alsham/$MOD importa @alsham/$OUTRO — módulo não depende de módulo"
                FALHOU=1
              fi
            done
          done

          # 2. E nem pelo package.json: dependência declarada é dependência.
          #    `devDependencies` de teste também não vale — se o teste precisa
          #    do outro módulo, o acoplamento é real.
          for MOD in $MODULOS; do
            if grep -qE '"@alsham/(finance-reconciliation|marketing|accounts-payable|crm|accounts-receivable)"' \
                 <(grep -v "\"@alsham/$MOD\"" "packages/$MOD/package.json"); then
              echo "::error::packages/$MOD declara outro módulo como dependência"
              FALHOU=1
            fi
          done

          # 3. Nenhum schema de módulo toca o schema de outro no SQL.
          #    Lê CÓDIGO, não prosa: os comentários dos arquivos explicam
          #    justamente esta regra, e citam o nome do outro schema ao fazê-lo.
          #
          #    ⚠️ `0008_recon_ap_projection.sql` NÃO entra nesta lista, e não é
          #    exceção: ela é uma migration do `recon`, e o que ela cria é
          #    objeto `recon.*`. Por isso ela existe separada da `0007` — se a
          #    porta de projeção morasse dentro do arquivo do módulo de Contas
          #    a Pagar, esta guarda precisaria aprender a ignorar um caso. É
          #    justamente o que se evitou. Ela é conferida abaixo, no item 4.
          #
          #    ⚠️ **A MATRIZ É GERADA, não escrita à mão — e mudou na Etapa 11.**
          #
          #    Com três módulos eram 6 pares e dava para listar. Com quatro são
          #    12, e com cinco serão 20: uma lista escrita à mão é uma lista que
          #    um dia esquece um par, em silêncio, e justamente o par novo.
          #    Aqui os pares saem do produto cartesiano dos schemas, nos DOIS
          #    sentidos — acrescentar um módulo é acrescentar uma linha ao mapa.
          declare -A SCHEMA_DE=(
            [0002_recon.sql]=recon
            [0004_marketing.sql]=marketing
            [0007_ap.sql]=ap
            [0009_crm.sql]=crm
            [0010_ar.sql]=ar
          )
          for ARQUIVO in "${!SCHEMA_DE[@]}"; do
            DONO="${SCHEMA_DE[$ARQUIVO]}"
            CODIGO=$(sed 's/--.*//' "supabase/migrations/$ARQUIVO")
            for OUTRO in "${SCHEMA_DE[@]}"; do
              [ "$DONO" = "$OUTRO" ] && continue
              if echo "$CODIGO" | grep -qE "\b$OUTRO\."; then
                echo "::error::$ARQUIVO acessa o schema $OUTRO — projeção local, nunca join"
                echo "$CODIGO" | grep -nE "\b$OUTRO\." | head -5
                FALHOU=1
              fi
            done
          done

          # 4. E a porta de projeção do `recon` não pode ler o schema de quem
          #    produz o evento. Ela recebe TUDO por argumento, do payload — que
          #    o produtor monta autossuficiente exatamente por isso.
          PROJ=$(sed 's/--.*//' supabase/migrations/0008_recon_ap_projection.sql)
          if echo "$PROJ" | grep -qE "\b(ap|marketing|crm|ar)\."; then
            echo "::error::a projeção lê o schema de outro módulo — ela só pode ler o payload"
            FALHOU=1
          fi
          # ⭐ E não pode CHUMBAR a origem: a procedência vem do envelope. Com
          #    ela fixa, um segundo produtor entraria disfarçado do primeiro e a
          #    trilha mentiria sem nunca dar erro.
          if echo "$PROJ" | grep -qE "'(ap|accounts-payable)'"; then
            echo "::error::a projeção cita o nome do módulo produtor — a origem vem de producedBy"
            FALHOU=1
          fi
          CONS=$(grep -Ev '^\s*(\*|//|/\*)' packages/finance-reconciliation/src/external-payable.ts)
          if echo "$CONS" | grep -qE "sourceModuleId:\s*'"; then
            echo "::error::o consumidor chumbou a origem — ela tem de vir de envelope.producedBy"
            FALHOU=1
          fi
          echo "$CONS" | grep -qE 'envelope\.producedBy' \
            || { echo "::error::o consumidor deixou de ler a procedência do envelope"; FALHOU=1; }

          [ "$FALHOU" = "0" ] || exit 1
          echo "Lego intacto: cinco módulos, zero dependência entre eles."

      # ⛔⛔ A FRONTEIRA DA CHAVE-MÃE (Etapa 8).
      #
      # `apps/api` roda com `service_role`: ela ignora toda a RLS e enxerga
      # todos os tenants. `apps/portal` é a interface do CLIENTE. As duas não
      # podem virar o mesmo deploy, e o jeito de isso acontecer sem ninguém
      # notar é um `import` inocente.
      #
      # A guarda de bundle que já existe pega a string `service_role` no
      # JavaScript compilado. Esta pega um passo antes: a dependência.
      - name: a chave-mãe não encosta no app do cliente
        run: |
          FALHOU=0

          if grep -rInE "from '@alsham/api'|require\('@alsham/api'\)" apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal importa @alsham/api — a composição roda com service_role"; FALHOU=1
          fi
          if grep -qE '"(@alsham/api|pg)"' apps/portal/package.json; then
            echo "::error::apps/portal declara a composição ou um driver de banco como dependência"; FALHOU=1
          fi
          # Driver de Postgres no app do cliente significa conexão direta —
          # o portal fala com o banco pela chave publicável, sob RLS.
          if grep -rInE "from 'pg'|require\('pg'\)" apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal importa um driver de Postgres direto"; FALHOU=1
          fi
          # E os segredos do correio não podem ser lidos de lá.
          if grep -rInE 'process\.env\.(DATABASE_URL|COURIER_SECRET)' apps/portal 2>/dev/null; then
            echo "::error::apps/portal lê um segredo que é do servidor de composição"; FALHOU=1
          fi
          # O caminho inverso: a composição não pode virar tela.
          if grep -rInE "from 'next|from 'react" apps/api/src 2>/dev/null; then
            echo "::error::apps/api importou framework de UI — ele é servidor, não tela"; FALHOU=1
          fi

          [ "$FALHOU" = "0" ] || exit 1
          echo "fronteira intacta: a chave-mãe fica do lado do servidor."

      # ⭐ A COMPOSIÇÃO É A ÚNICA — e não pode reimplementar a entrega.
      #
      # Se alguém escrever a lógica de tomada, backoff ou idempotência dentro
      # de `apps/api` "porque era mais rápido", passamos a ter DUAS
      # implementações da mesma garantia. Este repositório já pagou para saber
      # o que isso custa: o defeito da Etapa 6 foi corrigido num lugar só
      # porque só existia um.
      - name: a composição chama o correio, não o reescreve
        run: |
          if grep -rInE 'function (deliverDue|entregarUm|backoffDelayMs|isExhausted|nextAttemptAt)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a lógica de entrega foi redeclarada em apps/ — ela vive em packages/workflow"; exit 1
          fi
          COMP=$(grep -Ev '^\s*(\*|//|/\*)' apps/api/src/composition.ts)

          # ⚠️ `\b` NA FRENTE DE CADA NOME, e não é detalhe de regex.
          #
          # Sem a fronteira de palavra, a busca casa por SUBSTRING: trocar a
          # chamada por `noop_handleExternalPayable(` deixava a guarda verde,
          # porque o nome original continuava contido no novo. A sabotagem da
          # Etapa 10 pegou exatamente isso, e a fraqueza valia para as quatro
          # verificações antigas também — foram corrigidas junto.
          for FN in deliverDue eventUsageHook handleSpendDecision auditSubscription handleExternalPayable; do
            echo "$COMP" | grep -Eq "\b$FN\(" \
              || { echo "::error::a composição deixou de chamar $FN() do pacote"; exit 1; }
          done
          # A quinta da lista é a terceira ponta do triângulo (Etapa 10). Sem
          # ela, o título registrado no Módulo 3 nunca chega ao Módulo 1 — e
          # ninguém veria erro nenhum, porque o evento seria entregue e
          # ignorado.

      # ⭐ A STORE NÃO DECIDE — nem o que mostra, nem quem instala.
      #
      # Dois jeitos de a Store apodrecer, e os dois são um `if` inocente:
      #   1. filtrar `status = 'published'` na tela. A policy já faz isso, e
      #      depender dela é o ponto — no dia em que alguém escrever uma
      #      segunda consulta sem o filtro, a tela mostraria rascunho.
      #   2. checar permissão ou teto de plano no app. Essas regras vivem em
      #      `core.install_module()`, e só lá.
      - name: a Store consome a decisão, não a reescreve
        run: |
          APP=$(grep -rEv '^\s*(\*|//|/\*)' apps/portal/src/app/store apps/portal/src/app/store-actions.ts apps/portal/src/components/store-shelf.tsx apps/portal/src/lib/data/store-supabase.ts)

          if echo "$APP" | grep -Eq "eq\(\s*'status'\s*,\s*'published'\s*\)"; then
            echo "::error::a Store filtra 'published' na tela — quem filtra é a policy do banco"; exit 1
          fi
          # ⚠️ A COMPARAÇÃO, não a leitura.
          #
          # A primeira versão proibia a string `limit_value` e reprovou o
          # `loadModuleLimit()`, que só LÊ o número para a tela mostrar
          # "3 de 5". A segunda proibia qualquer comparação e reprovou
          # `limite !== null`, que é checagem de nulo para exibir.
          #
          # O que a tela não pode fazer é comparar a CONTAGEM DE INSTALADOS com
          # o teto — que é literalmente a decisão de `core.install_module()`.
          if echo "$APP" | grep -Eq '(installed|instalados|count|length)[^;]{0,20}(>=|<=|>|<)[^;]{0,20}(limite|limit_value|moduleLimit)|(limite|limit_value|moduleLimit)[^;]{0,20}(>=|<=|>|<)[^;]{0,20}(installed|instalados|count|length)'; then
            echo "::error::a Store passou a DECIDIR o teto do plano — a regra vive em core.install_module()"; exit 1
          fi
          if grep -rInE 'function (buildShelf|summarizeShelf|producerOf)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a visão de catálogo foi redeclarada em apps/ — ela vive em packages/permissions"; exit 1
          fi
          PAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/store/page.tsx)
          echo "$PAGE" | grep -Eq 'buildShelf\(' \
            || { echo "::error::a Store deixou de usar buildShelf do pacote"; exit 1; }

          # E o instalador é chamado, não reimplementado.
          ADAPTER=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/lib/data/store-supabase.ts)
          echo "$ADAPTER" | grep -Eq "rpc\('install_module'" \
            || { echo "::error::a Store não chama core.install_module — quem decide é o banco"; exit 1; }
          if echo "$ADAPTER" | grep -Eq "from\('role_permissions'\)[^;]*insert|insert.*role_permissions"; then
            echo "::error::a Store concede permissão direto — isso é ato do instalador"; exit 1
          fi
          echo "a Store consome a decisão do banco."

      # ⚠️ LEI 7 — BILLING CONTA USO, NÃO DINHEIRO.
      #
      # No dia em que alguém escrever um preço em reais em `packages/billing`
      # ou no schema de uso, terá inventado um número que o dono não decidiu.
      # Preço é etapa própria, com valores medidos.
      - name: billing não tem preço inventado
        run: |
          # -i e [_a-zA-Z0-9]* de propósito: a primeira versão desta guarda era
          # sensível a caixa e passou batido em `const PRECO_MENSAL = 4900`,
          # que é justamente a forma mais provável de uma constante de preço.
          # O `[^;]{0,40}` cobre a anotação de tipo entre o nome e o valor:
          # `const fee: number = 250` escapou das duas primeiras versões desta
          # guarda, e é a forma que um TypeScript real usaria.
          PRECO=$(grep -rInEi '(price|preco|preço|amount_cents|valor|tarifa|fee)[_a-zA-Z0-9]*[^;]{0,40}[:=][[:space:]]*[0-9]' \
                    packages/billing/src supabase/migrations/0003_billing.sql 2>/dev/null || true)
          if [ -n "$PRECO" ]; then
            echo "::error::preço/valor monetário em billing — Lei 7: preço é decisão do dono"
            echo "$PRECO"; exit 1
          fi
          if grep -rInE '\b(BRL|USD|EUR|R\$)\b' packages/billing/src 2>/dev/null; then
            echo "::error::moeda em packages/billing — este pacote conta uso, não dinheiro"; exit 1
          fi

      # ⛔ A CHAVE-MÃE NÃO PODE CHEGAR AO NAVEGADOR.
      #
      # `service_role` ignora toda a RLS: quem a tem enxerga todos os tenants.
      # O painel fala com o banco como o USUÁRIO. Esta guarda olha o bundle de
      # cliente já compilado — não o código-fonte —, que é onde a chave
      # apareceria de verdade se alguém a importasse por engano.
      - name: a service_role não chega ao bundle de cliente
        run: |
          DIR=apps/portal/.next/static
          [ -d "$DIR" ] || { echo "::error::bundle de cliente não encontrado — o build rodou?"; exit 1; }
          if grep -rl "service_role" "$DIR" 2>/dev/null; then
            echo "::error::a string service_role chegou ao bundle de CLIENTE"; exit 1
          fi
          # E nenhum JWT literal em lugar nenhum do build.
          if grep -rhoE "eyJ[A-Za-z0-9_-]{30,}" apps/portal/.next 2>/dev/null | head -1 | grep -q .; then
            echo "::error::um token com cara de JWT foi embutido no build"; exit 1
          fi
          echo "bundle de cliente limpo."

      # O tenant nunca pode vir do cliente.
      - name: o tenant vem da sessão, não do ambiente nem da URL
        run: |
          # Procura o USO, não a menção.
          #
          # A primeira versão desta guarda casava `NEXT_PUBLIC_TENANT` em
          # qualquer lugar — e reprovava o próprio `.env.example`, cujo
          # comentário explica justamente por que essa variável não existe.
          # É a terceira vez neste repositório que uma guarda tropeça na
          # documentação que ela deveria proteger; por isso agora é sempre
          # "leia código, não prosa".
          if grep -rInE 'process\.env\.NEXT_PUBLIC_TENANT' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::tenant lido de variável pública — ele tem de vir da sessão + memberships"; exit 1
          fi
          if grep -rInE '^[[:space:]]*NEXT_PUBLIC_TENANT' apps --include='*.example'; then
            echo "::error::variável pública de tenant declarada no .env.example"; exit 1
          fi
          grep -q 'resolveSession' apps/portal/src/lib/data/index.ts \
            || { echo "::error::a porta de dados deixou de resolver o tenant pela sessão"; exit 1; }
