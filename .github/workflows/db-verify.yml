      - name: aplicar 0089_loyalty.sql
        run: $PSQL -f supabase/migrations/0089_loyalty.sql

      # ONDA DEZENOVE (Fase 3) — os 3 Domains pendentes (IA Aplicada, GRC,
      # Segurança da Informação). ⚠️ IA Aplicada fechou com ZERO módulo (tudo é
      # Core/Engine/AI-Marketplace/Engenheiro — FORA). Seis módulos genuínos:
      # GRC (erisk — o risco corporativo, o DIVERGE do risk project-scoped;
      # control — controles internos + livro imutável de testes; whistle — o
      # canal de denúncias com anonimato físico) e InfoSec (vuln — a identidade
      # do nc/capa; secincident — o DIVERGE do occ, timeline NIST; continuity —
      # planos + livro imutável de drills). `consumes` vazio — sem redeploy.
      - name: aplicar 0090_erisk.sql
        run: $PSQL -f supabase/migrations/0090_erisk.sql
      - name: aplicar 0091_control.sql
        run: $PSQL -f supabase/migrations/0091_control.sql
      - name: aplicar 0092_whistle.sql
