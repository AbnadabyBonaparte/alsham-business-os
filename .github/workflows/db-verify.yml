          for M in idea ip; do
            C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='$M';")
            [ "$C" = "0" ] || { echo "::error::o módulo $M deveria ter consumes vazio: [$C]"; exit 1; }
          done
          echo "idea·ip — domain rnd, consumes vazio (Lei 7)."

      # ⭐⭐ A física do idea — o DIVERGE do kanban (SEM project_id) + o ciclo:
      - name: a física do idea está de pé (sem project_id, FK intra-schema, ciclo)
        run: |
          # SABOTAGEM 1: ⭐⭐ NÃO existe coluna project_id em NENHUMA tabela do idea
          # (a ideia existe antes do projeto — o oposto do kanban).
          PID=$($PSQL -tAc "select count(*) from information_schema.columns
                             where table_schema='idea' and column_name='project_id';")
          [ "$PID" = "0" ] || { echo "::error::apareceu project_id no idea — a ideia não pertence a projeto"; exit 1; }
          # SABOTAGEM 2: mas o elo de DESTINO existe (promoted_project_id), opcional.
          # ⚠️ NÃO usar o nome de variável PPID — é readonly no bash (o PID do pai).
          PROMOCOL=$($PSQL -tAc "select count(*) from information_schema.columns
                              where table_schema='idea' and table_name='ideas'
                                and column_name='promoted_project_id' and is_nullable='YES';")
          [ "$PROMOCOL" = "1" ] || { echo "::error::promoted_project_id sumiu ou virou obrigatório"; exit 1; }
          # SABOTAGEM 3: a etapa é FK INTRA-schema (ideas → stages), não enum.
          FK=$($PSQL -tAc "select count(*) from pg_constraint c
                            join pg_class t on t.oid=c.conrelid
                            join pg_namespace n on n.oid=t.relnamespace
                           where n.nspname='idea' and t.relname='ideas'
                             and c.contype='f' and c.conname='ideas_stage_fk';")
          [ "$FK" = "1" ] || { echo "::error::a FK intra-schema ideas_stage_fk sumiu"; exit 1; }
          ENUM=$($PSQL -tAc "select count(*) from pg_type t join pg_namespace n on n.oid=t.typnamespace
                             where n.nspname='idea' and t.typtype='e';")
          [ "$ENUM" = "0" ] || { echo "::error::nasceu enum no idea — as etapas são texto livre (Lei das Etapas)"; exit 1; }
          # SABOTAGEM 4: a máquina de estados existe (idea.allowed_transition).
          AT=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='idea' and p.proname='allowed_transition';")
          [ "$AT" = "1" ] || { echo "::error::idea.allowed_transition sumiu"; exit 1; }
          # SABOTAGEM 5: a ideia NÃO tem DELETE (anda/promove/arquiva — não some);
          # a etapa TEM (desenhar o funil é tentativa e erro).
          GI=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='idea' and table_name='ideas' and grantee='authenticated';")
          [ "$GI" = "INSERT,SELECT,UPDATE" ] || { echo "::error::grants da ideia inesperados (esperava sem DELETE): [$GI]"; exit 1; }
          GS=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                           where table_schema='idea' and table_name='stages'
                             and grantee='authenticated' and privilege_type='DELETE';")
          [ "$GS" = "1" ] || { echo "::error::a etapa do idea perdeu o DELETE"; exit 1; }
          # SABOTAGEM 6: a coerência da promoção (promovida ⇔ tem projeto de destino).
          CO=$($PSQL -tAc "select count(*) from pg_constraint c
                            join pg_class t on t.oid=c.conrelid
                            join pg_namespace n on n.oid=t.relnamespace
                           where n.nspname='idea' and t.relname='ideas'
                             and c.contype='c' and c.conname='ideas_promoted_coherent';")
          [ "$CO" = "1" ] || { echo "::error::a coerência ideas_promoted_coherent sumiu"; exit 1; }
          echo "idea — sem project_id, FK intra-schema, sem enum, ciclo com máquina de estados, ideia sem DELETE."

      # ⭐⭐ A física do ip — tipo num CHECK (4 categorias) + ciclo terminal:
      - name: a física do ip está de pé (tipo CHECK, ciclo terminal, sem DELETE)
        run: |
          # SABOTAGEM 1: o asset_type SÓ aceita as quatro categorias de PI.
          ENUM=$($PSQL -tAc "select count(*) from pg_type t join pg_namespace n on n.oid=t.typnamespace
                             where n.nspname='ip' and t.typtype='e';")
          [ "$ENUM" = "0" ] || { echo "::error::nasceu enum no ip — o tipo é CHECK, não enum do produto"; exit 1; }
          OKT=$($PSQL -tAc "select count(*) from information_schema.check_constraints cc
                              join information_schema.constraint_column_usage u
                                on u.constraint_name=cc.constraint_name and u.constraint_schema=cc.constraint_schema
                             where u.table_schema='ip' and u.table_name='assets' and u.column_name='asset_type'
                               and cc.check_clause ilike '%patent%' and cc.check_clause ilike '%trade_secret%';")
          [ "$OKT" -ge "1" ] || { echo "::error::o CHECK das quatro categorias de PI sumiu de ip.assets.asset_type"; exit 1; }
          # SABOTAGEM 2: a máquina de estados existe (ip.allowed_transition).
          AT=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='ip' and p.proname='allowed_transition';")
          [ "$AT" = "1" ] || { echo "::error::ip.allowed_transition sumiu"; exit 1; }
          # SABOTAGEM 3: ⭐ ciclo TERMINAL sem reabertura — a função NÃO parte de
          # um terminal (rejected/expired nunca aparecem como origem de um par).
          DEF=$($PSQL -tAc "select pg_get_functiondef(p.oid) from pg_proc p
                             join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='ip' and p.proname='allowed_transition';")
          echo "$DEF" | grep -qE "\('rejected'|\('expired'" && { echo "::error::o ip ganhou uma volta de um terminal — indeferido/expirado não reabre"; exit 1; }
          echo "$DEF" | grep -q "'granted', 'expired'" || { echo "::error::o par granted→expired sumiu do ciclo do ip"; exit 1; }
          # SABOTAGEM 4: o ativo NÃO tem DELETE (é história, mesmo indeferido).
          GA=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='ip' and table_name='assets' and grantee='authenticated';")
          [ "$GA" = "INSERT,SELECT,UPDATE" ] || { echo "::error::grants do ativo de PI inesperados (esperava sem DELETE): [$GA]"; exit 1; }
          # SABOTAGEM 5: as duas coerências de carimbo (granted / close) com o estado.
          for CON in ip_assets_granted_coherent ip_assets_close_coherent; do
            C=$($PSQL -tAc "select count(*) from pg_constraint c
                              join pg_class t on t.oid=c.conrelid
                              join pg_namespace n on n.oid=t.relnamespace
                             where n.nspname='ip' and t.relname='assets' and c.contype='c' and c.conname='$CON';")
            [ "$C" = "1" ] || { echo "::error::a coerência $CON sumiu de ip.assets"; exit 1; }
          done
          # SABOTAGEM 6: a identidade CONGELA fora do depósito (gatilho).
          T=$($PSQL -tAc "select count(*) from pg_trigger t
                            join pg_class c on c.oid=t.tgrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='ip' and c.relname='assets'
                             and t.tgname='ip_assets_identity_frozen' and not t.tgisinternal;")
          [ "$T" = "1" ] || { echo "::error::o gatilho de congelamento da identidade sumiu do ip"; exit 1; }
          echo "ip — tipo CHECK (4 categorias), ciclo terminal sem reabertura, ativo sem DELETE, identidade congela."

      # ⚠️⚠️ ONDA DEZESSETE — o cartão é DOMAIN accounting (Contábil & Fiscal), o
      # mais restrito POR LEI: 7 das 8 capacidades ficam FORA (Lei 3). Só o
      # fiscalcert nasce, e apenas como REGISTRO DE METADADOS.
      - name: o módulo da Onda Dezessete é domain accounting, consumes vazio
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='accounting'
                             and module_id='fiscalcert';")
          [ "$N" = "1" ] || { echo "::error::esperava 1 cartão domain accounting na Onda Dezessete: [$N]"; exit 1; }
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id='fiscalcert' and vertical_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::o cartão fiscalcert carregou vertical_key"; exit 1; }
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='fiscalcert';")
          [ "$C" = "0" ] || { echo "::error::o módulo fiscalcert deveria ter consumes vazio: [$C]"; exit 1; }
          echo "fiscalcert — domain accounting, consumes vazio (Lei 7)."

      # ⭐⭐ A física do fiscalcert — um LEMBRETE DE VALIDADE, não um cofre:
      - name: a física do fiscalcert está de pé (metadados, sem cofre, active↔archived)
        run: |
          # SABOTAGEM 1: ⛔⛔ NENHUMA coluna que guarde o certificado em si —
          # sem .pfx, sem chave privada, sem senha, sem segredo, sem assinatura.
          CRYPTO=$($PSQL -tAc "select count(*) from information_schema.columns
                                where table_schema='fiscalcert' and table_name='certificates'
                                  and (lower(column_name) similar to '%(pfx|p12|private|key|password|passphrase|secret|signature|content|file|blob)%');")
          [ "$CRYPTO" = "0" ] || { echo "::error::o fiscalcert ganhou uma coluna de cofre — é só metadado (Lei 3 + segurança)"; exit 1; }
          # SABOTAGEM 2: nenhuma FUNÇÃO de assinatura no schema.
          SIGN=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                              where n.nspname='fiscalcert' and p.proname ilike '%sign%';")
          [ "$SIGN" = "0" ] || { echo "::error::apareceu função de assinatura no fiscalcert — não se assina aqui"; exit 1; }
          # SABOTAGEM 3: ⭐ o vencimento é OBRIGATÓRIO (o dado que justifica o módulo).
          VU=$($PSQL -tAc "select is_nullable from information_schema.columns
                            where table_schema='fiscalcert' and table_name='certificates' and column_name='valid_until';")
          [ "$VU" = "NO" ] || { echo "::error::valid_until deixou de ser obrigatória: [$VU]"; exit 1; }
          # SABOTAGEM 4: a máquina de estados existe (fiscalcert.allowed_transition).
          AT=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='fiscalcert' and p.proname='allowed_transition';")
          [ "$AT" = "1" ] || { echo "::error::fiscalcert.allowed_transition sumiu"; exit 1; }
          # SABOTAGEM 5: ⭐ active↔archived — o registro volta (não é terminal).
          # A função aceita os DOIS sentidos.
          DEF=$($PSQL -tAc "select pg_get_functiondef(p.oid) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                             where n.nspname='fiscalcert' and p.proname='allowed_transition';")
          echo "$DEF" | grep -qE "'active',[[:space:]]+'archived'" || { echo "::error::o par active→archived sumiu"; exit 1; }
          echo "$DEF" | grep -qE "'archived',[[:space:]]+'active'" || { echo "::error::o par archived→active sumiu (o registro deve voltar)"; exit 1; }
          # SABOTAGEM 6: o certificado NÃO tem DELETE (é história de assinatura).
          GC=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='fiscalcert' and table_name='certificates' and grantee='authenticated';")
          [ "$GC" = "INSERT,SELECT,UPDATE" ] || { echo "::error::grants do certificado inesperados (esperava sem DELETE): [$GC]"; exit 1; }
          echo "fiscalcert — só metadado (sem cofre/assinatura), vencimento obrigatório, active↔archived, sem DELETE."

      # ⭐ A física da Qualidade no banco aplicado:
      #   • o livro da NC é imutável (só INSERT,SELECT); o achado do audit também;
      #   • o tipo do capa é CHECK (corrective/preventive), não enum nem texto;
      #   • a conformidade do iso NÃO tem máquina de transições (é mutável).
      - name: a física dos módulos da Qualidade está de pé
        run: |
          # nc.entries e audit.findings são livros imutáveis (só INSERT,SELECT).
          for PAR in "nc entries" "audit findings"; do
            set -- $PAR
            G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                              from information_schema.role_table_grants
                             where table_schema='$1' and table_name='$2' and grantee='authenticated';")
            [ "$G" = "INSERT,SELECT" ] || { echo "::error::$1.$2 tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          done
          # ⭐ o tipo do capa é CHECK, não enum de tipo nem texto livre.
          T=$($PSQL -tAc "select coalesce(string_agg(t.typname, ','), '')
                            from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='capa' and t.typtype='e';")
          [ -z "$T" ] || { echo "::error::nasceu enum em capa: $T — o tipo é CHECK"; exit 1; }
          CK=$($PSQL -tAc "select count(*) from pg_constraint c
                             join pg_class t on t.oid=c.conrelid
                             join pg_namespace n on n.oid=t.relnamespace
                            where n.nspname='capa' and t.relname='actions' and c.contype='c'
                              and pg_get_constraintdef(c.oid) ilike '%corrective%preventive%';")
          [ "$CK" = "1" ] || { echo "::error::o CHECK corrective/preventive do capa sumiu"; exit 1; }
          # ⭐⭐ a conformidade do iso é MUTÁVEL: NÃO existe função de transição de
          # conformidade (só a de arquivamento active↔archived). A allowed_transition
          # do iso não pode citar os valores de conformidade.
          D=$($PSQL -tAc "select pg_get_functiondef(p.oid) from pg_proc p
                           where p.pronamespace='iso'::regnamespace and p.proname='allowed_transition';")
          echo "$D" | grep -qiE "compliant|non_compliant" && { echo "::error::a allowed_transition do iso virou máquina de conformidade — ela é MUTÁVEL"; exit 1; }
          echo "$D" | grep -q "archived" || { echo "::error::a allowed_transition do iso perdeu o ciclo de arquivamento"; exit 1; }
          echo "Qualidade: nc/audit imutáveis, capa CHECK, iso conformidade mutável."

      # ⭐ Os cinco cartões da Onda Treze são DOMAIN pmo — e FECHAM o Domain.
      - name: os cinco módulos da Onda Treze são domain pmo (PMO 10/10)
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='pmo'
                             and module_id in ('scrum','gantt','risk','timesheet','pfolio');")
          [ "$N" = "5" ] || { echo "::error::esperava 5 cartões domain pmo na Onda Treze: [$N]"; exit 1; }
          # ⭐⭐ o Domain PMO agora tem os 10 módulos completos.
          TOT=$($PSQL -tAc "select count(*) from core.module_registry
                             where layer='domain' and domain_key='pmo';")
          [ "$TOT" = "10" ] || { echo "::error::o Domain PMO deveria ter 10 módulos: [$TOT]"; exit 1; }
          # ⛔ domain não pode ter vertical_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('scrum','gantt','risk','timesheet','pfolio')
                               and vertical_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão da Onda Treze carregou vertical_key"; exit 1; }

      # ⭐ Os cinco cartões da Onda Doze são DOMAIN pmo.
      - name: os cinco módulos da Onda Doze são domain pmo
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='pmo'
                             and module_id in ('proj','sched','kanban','alloc','pcost');")
          [ "$N" = "5" ] || { echo "::error::esperava 5 cartões domain pmo na Onda Doze: [$N]"; exit 1; }
          # ⛔ domain não pode ter vertical_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('proj','sched','kanban','alloc','pcost')
                               and vertical_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão da Onda Doze carregou vertical_key"; exit 1; }

      # ⭐ Os cinco cartões da Onda Onze são DOMAIN supply-chain (separado de Compras).
      - name: os cinco módulos da Onda Onze são domain supply-chain
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='supply-chain'
                             and module_id in ('dem','sop','dc','disp','logperf');")
          [ "$N" = "5" ] || { echo "::error::esperava 5 cartões domain supply-chain na Onda Onze: [$N]"; exit 1; }
          # ⛔ domain não pode ter vertical_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('dem','sop','dc','disp','logperf')
                               and vertical_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão da Onda Onze carregou vertical_key"; exit 1; }

      # ⭐ Os cinco cartões da Onda Dez são DOMAIN procurement, ao lado do `po`.
      - name: os cinco módulos da Onda Dez são domain procurement
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='procurement'
                             and module_id in ('vendor','rfq','recv','vperf','reorder');")
          [ "$N" = "5" ] || { echo "::error::esperava 5 cartões domain procurement na Onda Dez: [$N]"; exit 1; }
          # ⛔ domain não pode ter vertical_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('vendor','rfq','recv','vperf','reorder')
                               and vertical_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão da Onda Dez carregou vertical_key"; exit 1; }

      # ⭐ Os cinco cartões da Missão Nove são VERTICAIS (vertical_key), os
      # primeiros do catálogo — e a chave é a do @alsham/core / store-taxonomy.
      - name: os cinco módulos da Missão Nove são verticais shopping-centers
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='vertical' and vertical_key='shopping-centers'
                             and module_id in ('mall','lease','fund','park','sec');")
          [ "$N" = "5" ] || { echo "::error::esperava 5 cartões vertical shopping-centers: [$N]"; exit 1; }
          # ⛔ vertical não pode ter domain_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('mall','lease','fund','park','sec')
                               and domain_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão vertical carregou domain_key"; exit 1; }
          echo "mall·lease·fund·park·sec — verticais shopping-centers, o primeiro bloco vertical do catálogo."

      # ⭐⭐ A assinatura do fund: o saldo NUNCA fica negativo (o DIVERGE do
      # bank/inv). A guarda confere que existe a recusa no schema.
      #
      # ⚠️ O CTE `materialized` restringe ao schema `fund` e a funções normais
      # (prokind='f') ANTES de qualquer chamada a pg_get_functiondef. Sem essa
      # barreira, o planejador do Postgres 17 pode avaliar pg_get_functiondef
      # sobre TODO pg_proc antes do filtro de nspname — e ele recusa agregados
      # ("array_agg is an aggregate function"), quebrando a guarda sem que nada
      # no fund tenha mudado.
      - name: o fundo de promoção recusa saldo negativo
        run: |
          D=$($PSQL -tAc "with fund_fns as materialized (
                             select p.oid from pg_proc p
                              where p.pronamespace = 'fund'::regnamespace
                                and p.prokind = 'f'
                           )
                           select count(*) from fund_fns
                            where pg_get_functiondef(oid) ilike '%negativ%';")
          [ "$D" -ge "1" ] || { echo "::error::o fund perdeu a recusa de saldo negativo (o DIVERGE do bank/inv)"; exit 1; }

      # ⭐ O relatório de vendas do lease, a ronda do sec e os livros do fund
      # são imutáveis (só INSERT,SELECT concedidos).
      - name: os livros do vertical são imutáveis
        run: |
          for PAR in "lease sales_reports" "fund contributions" "fund expenses" "sec patrols"; do
            set -- $PAR
            G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                              from information_schema.role_table_grants
                             where table_schema='$1' and table_name='$2' and grantee='authenticated';")
            [ "$G" = "INSERT,SELECT" ] || { echo "::error::$1.$2 tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          done

      # ⭐ Os cinco cartões da onda têm consumes VAZIO (Lei 7).
      - name: os cinco módulos do vertical têm consumes vazio
        run: |
          for M in mall lease fund park sec; do
            C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='$M';")
            [ "$C" = "0" ] || { echo "::error::o módulo $M deveria ter consumes vazio: [$C]"; exit 1; }
          done
          echo "mall·lease·fund·park·sec — consumes vazio, sem handler (Lei 7)."

      # ═══════════════════════════════════════════════════════════════════════
      # ⭐ ONDA DEZOITO — o Vertical 🛒 VAREJO & SUPERMERCADOS (pdv·catalog·
      # cashregister·loyalty). Os QUATRO cartões são `vertical_key='retail'`,
      # consumes VAZIO. Abaixo, a física de cada um, com sabotagens.
      # ═══════════════════════════════════════════════════════════════════════
      - name: os quatro módulos do vertical retail existem, são vertical e consumes vazio
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='vertical' and vertical_key='retail'
                             and module_id in ('pdv','catalog','cashregister','loyalty');")
          [ "$N" = "4" ] || { echo "::error::esperava 4 cartões vertical retail na Onda Dezoito: [$N]"; exit 1; }
          # ⛔ vertical não pode ter domain_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('pdv','catalog','cashregister','loyalty')
                               and domain_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão da Onda Dezoito carregou domain_key"; exit 1; }
          for M in pdv catalog cashregister loyalty; do
            C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='$M';")
            [ "$C" = "0" ] || { echo "::error::o módulo $M deveria ter consumes vazio: [$C]"; exit 1; }
          done
          echo "pdv·catalog·cashregister·loyalty — vertical retail, consumes vazio (Lei 7)."

      # ⭐ pdv — a VENDA COMERCIAL, não o documento fiscal (Lei 3): draft →
      # completed/cancelled terminais (SEM o meio-termo 'open' do rfq), o total é
      # VIEW, os itens/cabeçalho CONGELAM, e NÃO há coluna de documento fiscal.
      - name: a física do pdv está de pé (venda comercial, congela, sem fiscal)
        run: |
          # SABOTAGEM 1: draft→completed e draft→cancelled existem; nada mais.
          [ "$($PSQL -tAc "select pdv.allowed_transition('draft','completed');")" = "t" ] || { echo "::error::pdv perdeu draft→completed"; exit 1; }
          [ "$($PSQL -tAc "select pdv.allowed_transition('draft','cancelled');")" = "t" ] || { echo "::error::pdv perdeu draft→cancelled"; exit 1; }
          # SABOTAGEM 2: a venda cancelada/concluída NÃO reabre (o DIVERGE do rfq).
          [ "$($PSQL -tAc "select pdv.allowed_transition('cancelled','draft');")" = "f" ] || { echo "::error::pdv deixou a venda cancelada reabrir"; exit 1; }
          [ "$($PSQL -tAc "select pdv.allowed_transition('completed','draft');")" = "f" ] || { echo "::error::pdv deixou a venda concluída reabrir"; exit 1; }
          # SABOTAGEM 3: o total é VIEW (nunca coluna).
          V=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='pdv' and c.relname='sale_totals' and c.relkind='v';")
          [ "$V" = "1" ] || { echo "::error::pdv.sale_totals não é VIEW (o total virou coluna?)"; exit 1; }
          # SABOTAGEM 4: os gatilhos de congelamento (item e cabeçalho) existem.
          F=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='pdv' and p.proname in ('guard_item_frozen','guard_header_frozen');")
          [ "$F" = "2" ] || { echo "::error::pdv perdeu um gatilho de congelamento: [$F]"; exit 1; }
          # SABOTAGEM 5: NÃO há coluna de documento fiscal (NF-e/NFC-e é integração, Lei 3).
          FISCAL=$($PSQL -tAc "select count(*) from information_schema.columns
                                where table_schema='pdv'
                                  and lower(column_name) similar to '%(nfe|nfce|danfe|sefaz|chave_acesso|signature|assinat)%';")
          [ "$FISCAL" = "0" ] || { echo "::error::apareceu coluna de documento fiscal no pdv — é integração (Lei 3)"; exit 1; }

      # ⭐ catalog — active ↔ archived (a física do vendor), SKU texto livre,
      # preço >= 0, sem enum de categoria.
      - name: a física do catalog está de pé (active↔archived, preço>=0, sem enum)
        run: |
          # SABOTAGEM 1: active↔archived nos dois sentidos.
          [ "$($PSQL -tAc "select catalog.allowed_transition('active','archived');")" = "t" ] || { echo "::error::catalog perdeu active→archived"; exit 1; }
          [ "$($PSQL -tAc "select catalog.allowed_transition('archived','active');")" = "t" ] || { echo "::error::catalog perdeu archived→active (o produto volta)"; exit 1; }
          # SABOTAGEM 2: o CHECK de preço >= 0 está na tabela.
          PC=$($PSQL -tAc "select count(*) from pg_constraint con
                             join pg_class c on c.oid=con.conrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='catalog' and c.relname='products' and con.contype='c'
                              and pg_get_constraintdef(con.oid) ilike '%price_cents%';")
          [ "$PC" -ge "1" ] || { echo "::error::catalog perdeu o CHECK de preço"; exit 1; }
          # SABOTAGEM 3: nenhum enum de categoria/SKU (o vocabulário é do tenant).
          T=$($PSQL -tAc "select count(*) from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='catalog' and t.typtype='e';")
          [ "$T" = "0" ] || { echo "::error::catalog criou um enum — o vocabulário é texto livre"; exit 1; }

      # ⭐ cashregister — open → closed TERMINAL (o turno não reabre), UMA sessão
      # aberta por caixa (constraint), a abertura congela.
      - name: a física do cashregister está de pé (open→closed terminal, uma aberta por caixa)
        run: |
          # SABOTAGEM 1: open→closed existe.
          [ "$($PSQL -tAc "select cashregister.allowed_transition('open','closed');")" = "t" ] || { echo "::error::cashregister perdeu open→closed"; exit 1; }
          # SABOTAGEM 2: closed é TERMINAL — o turno não reabre (o DIVERGE do... nada; física do scrum).
          [ "$($PSQL -tAc "select cashregister.allowed_transition('closed','open');")" = "f" ] || { echo "::error::cashregister deixou o turno encerrado reabrir"; exit 1; }
          # SABOTAGEM 3: UMA sessão aberta por caixa — o índice único parcial existe.
          IX=$($PSQL -tAc "select count(*) from pg_indexes
                            where schemaname='cashregister' and indexname='cashregister_sessions_one_open';")
          [ "$IX" = "1" ] || { echo "::error::cashregister perdeu a constraint 'uma aberta por caixa'"; exit 1; }
          # SABOTAGEM 4: o gatilho de congelamento da abertura existe.
          CF=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='cashregister' and p.proname='guard_content_frozen';")
          [ "$CF" = "1" ] || { echo "::error::cashregister perdeu o congelamento da abertura"; exit 1; }

      # ⭐ loyalty — o LIVRO DE PONTOS imutável: sem status, sem allowed_transition,
      # direção no entry_type, points>0, saldo é VIEW, resgatar > saldo é recusado.
      - name: a física do loyalty está de pé (imutável, saldo VIEW, resgate>saldo recusado)
        run: |
          # SABOTAGEM 1: o livro é imutável — só INSERT,SELECT concedidos.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='loyalty' and table_name='entries' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::loyalty.entries tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # SABOTAGEM 2: NÃO tem allowed_transition (é livro, não máquina de estados).
          AT=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='loyalty' and p.proname='allowed_transition';")
          [ "$AT" = "0" ] || { echo "::error::loyalty ganhou allowed_transition — é livro imutável, não ciclo"; exit 1; }
          # SABOTAGEM 3: NÃO tem coluna de status (fato consumado não tem estado).
          ST=$($PSQL -tAc "select count(*) from information_schema.columns
                            where table_schema='loyalty' and table_name='entries' and column_name='status';")
          [ "$ST" = "0" ] || { echo "::error::loyalty.entries ganhou coluna status — o movimento é fato consumado"; exit 1; }
          # SABOTAGEM 4: o entry_type CHECK (earn/redeem) e o points>0 CHECK estão na tabela.
          CH=$($PSQL -tAc "select count(*) from pg_constraint con
                             join pg_class c on c.oid=con.conrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='loyalty' and c.relname='entries' and con.contype='c'
                              and (pg_get_constraintdef(con.oid) ilike '%entry_type%'
                                or pg_get_constraintdef(con.oid) ilike '%points%');")
          [ "$CH" -ge "2" ] || { echo "::error::loyalty perdeu o CHECK de entry_type ou de points>0: [$CH]"; exit 1; }
          # SABOTAGEM 5: o saldo é VIEW (nunca coluna).
          V=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='loyalty' and c.relname='customer_balances' and c.relkind='v';")
          [ "$V" = "1" ] || { echo "::error::loyalty.customer_balances não é VIEW (o saldo virou coluna?)"; exit 1; }
          # SABOTAGEM 6: o guarda de resgate soma o saldo (a terceira resposta, a física do invest).
          RG=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='loyalty' and p.proname='guard_entry_insert'
                              and pg_get_functiondef(p.oid) ilike '%saldo%';")
          [ "$RG" -ge "1" ] || { echo "::error::loyalty perdeu a recusa de resgate acima do saldo (a física do invest)"; exit 1; }

      # ═══════════════════════════════════════════════════════════════════════
      # ⭐ ONDA DEZENOVE — GRC (erisk·control·whistle) + InfoSec (vuln·secincident·
      # continuity). IA Aplicada fechou com ZERO módulo (tudo é Core/Engine/AI-
      # Marketplace/Engenheiro). Abaixo, a física de cada um, com sabotagens.
      # ═══════════════════════════════════════════════════════════════════════
      - name: os seis módulos da Onda Dezenove existem, são domain e consumes vazio
        run: |
          G=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='grc'
                             and module_id in ('erisk','control','whistle');")
          [ "$G" = "3" ] || { echo "::error::esperava 3 cartões domain grc: [$G]"; exit 1; }
          I=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='domain' and domain_key='infosec'
                             and module_id in ('vuln','secincident','continuity','plant','subscription','genreading','creditbalance');")
          [ "$I" = "3" ] || { echo "::error::esperava 3 cartões domain infosec: [$I]"; exit 1; }
          for M in erisk control whistle vuln secincident continuity; do
            C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='$M';")
            [ "$C" = "0" ] || { echo "::error::o módulo $M deveria ter consumes vazio: [$C]"; exit 1; }
            BAD=$($PSQL -tAc "select count(*) from core.module_registry where module_id='$M' and vertical_key is not null;")
            [ "$BAD" = "0" ] || { echo "::error::o cartão $M carregou vertical_key"; exit 1; }
          done
          echo "erisk·control·whistle (grc) · vuln·secincident·continuity (infosec) — consumes vazio (Lei 7)."

      # ⭐ erisk — o DIVERGE do risk: SEM project_id; MANTIDO o ciclo (mitigated
      # reabre, closed terminal); treatment CHECK (os 4 T's).
      - name: a física do erisk está de pé (sem project_id, mitigated reabre, treatment CHECK)
        run: |
          # SABOTAGEM 1: NÃO há project_id (o DIVERGE do risk).
          P=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='erisk' and table_name='entries' and column_name='project_id';")
          [ "$P" = "0" ] || { echo "::error::erisk ganhou project_id — é o DIVERGE do risk (sem projeto)"; exit 1; }
          # SABOTAGEM 2: mitigated REABRE (mitigated→open), e closed é TERMINAL.
          [ "$($PSQL -tAc "select erisk.allowed_transition('mitigated','open');")" = "t" ] || { echo "::error::erisk perdeu o reabrir (mitigated→open)"; exit 1; }
          [ "$($PSQL -tAc "select erisk.allowed_transition('closed','open');")" = "f" ] || { echo "::error::erisk deixou o risco encerrado reabrir"; exit 1; }
          # SABOTAGEM 3: a régua 1–5 (CHECK) e o treatment (CHECK dos 4 T's).
          RG=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='erisk' and c.relname='entries' and con.contype='c'
                              and (pg_get_constraintdef(con.oid) ilike '%probability%' or pg_get_constraintdef(con.oid) ilike '%treatment%');")
          [ "$RG" -ge "2" ] || { echo "::error::erisk perdeu o CHECK da régua 1-5 ou do treatment: [$RG]"; exit 1; }
          # SABOTAGEM 4: severidade NÃO é coluna (é leitura — a Matriz).
          SV=$($PSQL -tAc "select count(*) from information_schema.columns where table_schema='erisk' and table_name='entries' and column_name='severity';")
          [ "$SV" = "0" ] || { echo "::error::erisk ganhou coluna severity — a severidade é leitura (a Matriz)"; exit 1; }

      # ⭐ control — active↔archived (decide) + livro de testes imutável.
      - name: a física do control está de pé (active↔archived, testes imutáveis, tipo COSO)
        run: |
          [ "$($PSQL -tAc "select control.allowed_transition('active','archived');")" = "t" ] || { echo "::error::control perdeu active→archived"; exit 1; }
          [ "$($PSQL -tAc "select control.allowed_transition('archived','active');")" = "t" ] || { echo "::error::control perdeu archived→active"; exit 1; }
          # SABOTAGEM: o livro de testes é imutável — só INSERT,SELECT.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type,',' order by privilege_type),'')
                            from information_schema.role_table_grants
                           where table_schema='control' and table_name='tests' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::control.tests tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # SABOTAGEM: control_type e result são CHECK (física do COSO / teste binário).
          CH=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='control' and con.contype='c'
                              and (pg_get_constraintdef(con.oid) ilike '%control_type%' or pg_get_constraintdef(con.oid) ilike '%result%');")
          [ "$CH" -ge "2" ] || { echo "::error::control perdeu o CHECK de control_type ou de result: [$CH]"; exit 1; }

      # ⭐⭐ whistle — o ANONIMATO em três camadas: gatilho + constraint + política.
      - name: a física do whistle está de pé (anonimato em 3 camadas, relato imutável)
        run: |
          # SABOTAGEM 1: a coluna is_anonymous existe e reporter_id existe.
          A=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='whistle' and table_name='reports' and column_name in ('is_anonymous','reporter_id');")
          [ "$A" = "2" ] || { echo "::error::whistle perdeu is_anonymous ou reporter_id"; exit 1; }
          # SABOTAGEM 2: a CONSTRAINT do anonimato (anônima ⇒ sem denunciante).
          K=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='whistle' and c.relname='reports' and con.contype='c'
                             and pg_get_constraintdef(con.oid) ilike '%is_anonymous%' and pg_get_constraintdef(con.oid) ilike '%reporter_id%';")
          [ "$K" -ge "1" ] || { echo "::error::whistle perdeu a constraint do anonimato (anônima ⇒ reporter_id null)"; exit 1; }
          # SABOTAGEM 3: o gatilho de nascimento descarta a identidade quando anônima.
          T=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                           where n.nspname='whistle' and p.proname='guard_report_insert'
                             and pg_get_functiondef(p.oid) ilike '%reporter_id := null%';")
          [ "$T" -ge "1" ] || { echo "::error::whistle perdeu o gatilho que descarta o denunciante anônimo"; exit 1; }
          # SABOTAGEM 4: resolved/dismissed são terminais.
          [ "$($PSQL -tAc "select whistle.allowed_transition('resolved','open');")" = "f" ] || { echo "::error::whistle deixou a denúncia resolvida reabrir"; exit 1; }
          # SABOTAGEM 5: o relato não passeia no envelope (payload sem description).
          PL=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='whistle' and p.proname='report_payload'
                              and pg_get_functiondef(p.oid) ilike '%description%';")
          [ "$PL" = "0" ] || { echo "::error::whistle vazou o relato no envelope (description no payload)"; exit 1; }

      # ⭐ vuln — a identidade do nc/capa: severity 1–5, duas respostas terminais.
      - name: a física do vuln está de pé (severity 1-5, remediated e accepted_risk terminais)
        run: |
          SC=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='vuln' and c.relname='findings' and con.contype='c'
                              and pg_get_constraintdef(con.oid) ilike '%severity%';")
          [ "$SC" -ge "1" ] || { echo "::error::vuln perdeu o CHECK de severity 1-5"; exit 1; }
          # As DUAS respostas terminais.
          [ "$($PSQL -tAc "select vuln.allowed_transition('remediated','in_progress');")" = "f" ] || { echo "::error::vuln deixou remediated reabrir"; exit 1; }
          [ "$($PSQL -tAc "select vuln.allowed_transition('accepted_risk','open');")" = "f" ] || { echo "::error::vuln deixou accepted_risk reabrir"; exit 1; }
          # in_progress volta a open (reavaliar).
          [ "$($PSQL -tAc "select vuln.allowed_transition('in_progress','open');")" = "t" ] || { echo "::error::vuln perdeu o reavaliar (in_progress→open)"; exit 1; }

      # ⭐⭐ secincident — o DIVERGE do occ: timeline NIST de 5 estados + timeline imutável.
      - name: a física do secincident está de pé (5 estados NIST, timeline imutável, sem futuro)
        run: |
          # SABOTAGEM 1: o ciclo NIST completo.
          for PAIR in "detected contained" "contained eradicated" "eradicated recovered" "recovered closed" "detected closed"; do
            set -- $PAIR
            [ "$($PSQL -tAc "select secincident.allowed_transition('$1','$2');")" = "t" ] || { echo "::error::secincident perdeu $1→$2"; exit 1; }
          done
          # SABOTAGEM 2: closed é TERMINAL.
          [ "$($PSQL -tAc "select secincident.allowed_transition('closed','recovered');")" = "f" ] || { echo "::error::secincident deixou o incidente fechado reabrir"; exit 1; }
          # SABOTAGEM 3: a timeline de resposta é imutável (só INSERT,SELECT).
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type,',' order by privilege_type),'')
                            from information_schema.role_table_grants
                           where table_schema='secincident' and table_name='response_actions' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::secincident.response_actions tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # SABOTAGEM 4: detected_at recusa futuro (a física do fato consumado).
          NF=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='secincident' and c.relname='incidents' and con.contype='c'
                              and pg_get_constraintdef(con.oid) ilike '%detected_at%';")
          [ "$NF" -ge "1" ] || { echo "::error::secincident perdeu a recusa de detected_at no futuro"; exit 1; }

      # ⭐ continuity — active↔archived + livro de drills imutável.
      - name: a física do continuity está de pé (active↔archived, drills imutáveis)
        run: |
          [ "$($PSQL -tAc "select continuity.allowed_transition('active','archived');")" = "t" ] || { echo "::error::continuity perdeu active→archived"; exit 1; }
          [ "$($PSQL -tAc "select continuity.allowed_transition('archived','active');")" = "t" ] || { echo "::error::continuity perdeu archived→active"; exit 1; }
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type,',' order by privilege_type),'')
                            from information_schema.role_table_grants
                           where table_schema='continuity' and table_name='drills' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::continuity.drills tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          IM=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='continuity' and p.proname='guard_drill_immutable';")
          [ "$IM" = "1" ] || { echo "::error::continuity perdeu a imutabilidade do drill"; exit 1; }

      # ═══════════════════════════════════════════════════════════════════════
      # ⭐ ONDA VINTE — o Vertical ☀️ ENERGIA (plant·subscription·genreading·
      # creditbalance). Os QUATRO cartões são `vertical_key='energy'`, consumes
      # VAZIO. Abaixo, a física de cada um, com sabotagens.
      # ═══════════════════════════════════════════════════════════════════════
      - name: os quatro módulos do vertical energy existem, são vertical e consumes vazio
        run: |
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where layer='vertical' and vertical_key='energy'
                             and module_id in ('plant','subscription','genreading','creditbalance');")
          [ "$N" = "4" ] || { echo "::error::esperava 4 cartões vertical energy na Onda Vinte: [$N]"; exit 1; }
          # ⛔ vertical não pode ter domain_key (CHECK do 0001), e vice-versa.
          BAD=$($PSQL -tAc "select count(*) from core.module_registry
                             where module_id in ('plant','subscription','genreading','creditbalance')
                               and domain_key is not null;")
          [ "$BAD" = "0" ] || { echo "::error::um cartão da Onda Vinte carregou domain_key"; exit 1; }
          for M in plant subscription genreading creditbalance; do
            C=$($PSQL -tAc "select jsonb_array_length(events_consumes) from core.module_registry where module_id='$M';")
            [ "$C" = "0" ] || { echo "::error::o módulo $M deveria ter consumes vazio: [$C]"; exit 1; }
          done
          echo "plant·subscription·genreading·creditbalance — vertical energy, consumes vazio (Lei 7)."

      # ⭐ plant — a USINA: active↔archived (a física do catalog, a usina volta a
      # operar), capacity_kwp>0, tipo texto livre (a consolidação de GD — nunca enum).
      - name: a física do plant está de pé (active↔archived, capacity>0, sem enum de tipo)
        run: |
          [ "$($PSQL -tAc "select plant.allowed_transition('active','archived');")" = "t" ] || { echo "::error::plant perdeu active→archived"; exit 1; }
          [ "$($PSQL -tAc "select plant.allowed_transition('archived','active');")" = "t" ] || { echo "::error::plant perdeu archived→active (a usina volta a operar)"; exit 1; }
          # SABOTAGEM 1: capacity_kwp > 0 (uma usina de 0 kWp não é usina).
          PC=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='plant' and c.relname='plants' and con.contype='c'
                              and pg_get_constraintdef(con.oid) ilike '%capacity_kwp > %';")
          [ "$PC" -ge "1" ] || { echo "::error::plant perdeu o CHECK de capacity_kwp > 0"; exit 1; }
          # SABOTAGEM 2: o tipo/porte é texto livre — nenhum enum no schema (a consolidação de GD).
          T=$($PSQL -tAc "select count(*) from pg_type t join pg_namespace n on n.oid=t.typnamespace where n.nspname='plant' and t.typtype='e';")
          [ "$T" = "0" ] || { echo "::error::plant criou um enum — o tipo/porte é texto livre (a GD é o mesmo objeto)"; exit 1; }

      # ⭐ subscription — a ASSINATURA: active → cancelled TERMINAL (a física do
      # proj, o DIVERGE do catalog), allocation_percent 0<x<=100.
      - name: a física do subscription está de pé (active→cancelled terminal, allocation bounded)
        run: |
          [ "$($PSQL -tAc "select subscription.allowed_transition('active','cancelled');")" = "t" ] || { echo "::error::subscription perdeu active→cancelled"; exit 1; }
          # SABOTAGEM 1: cancelled é TERMINAL — não reabre (o DIVERGE do catalog).
          [ "$($PSQL -tAc "select subscription.allowed_transition('cancelled','active');")" = "f" ] || { echo "::error::subscription deixou a assinatura cancelada reabrir (é o DIVERGE do catalog)"; exit 1; }
          # SABOTAGEM 2: allocation_percent 0 < x <= 100.
          AC=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='subscription' and c.relname='subscriptions' and con.contype='c'
                              and pg_get_constraintdef(con.oid) ilike '%allocation_percent%';")
          [ "$AC" -ge "1" ] || { echo "::error::subscription perdeu o CHECK de allocation_percent"; exit 1; }
          # SABOTAGEM 3: cancelar exige razão (o gatilho da transição confere).
          RR=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='subscription' and p.proname='guard_subscription_transition'
                              and pg_get_functiondef(p.oid) ilike '%cancel_reason%';")
          [ "$RR" -ge "1" ] || { echo "::error::subscription perdeu a exigência de razão ao cancelar"; exit 1; }

      # ⭐ genreading — a LEITURA DE GERAÇÃO: imutável (só INSERT,SELECT), sem
      # ciclo (sem allowed_transition), generated_kwh >= 0 (o MANTIDO do esg).
      - name: a física do genreading está de pé (imutável, sem ciclo, generated_kwh>=0)
        run: |
          # SABOTAGEM 1: a leitura é imutável — só INSERT,SELECT.
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type,',' order by privilege_type),'')
                            from information_schema.role_table_grants
                           where table_schema='genreading' and table_name='readings' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::genreading.readings tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # SABOTAGEM 2: é livro imutável, não ciclo — NÃO tem allowed_transition.
          AT=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='genreading' and p.proname='allowed_transition';")
          [ "$AT" = "0" ] || { echo "::error::genreading ganhou allowed_transition — é livro imutável, não ciclo"; exit 1; }
          # SABOTAGEM 3: generated_kwh >= 0 (zero é leitura real; negativo infísico — o MANTIDO do esg).
          CH=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='genreading' and c.relname='readings' and con.contype='c'
                              and pg_get_constraintdef(con.oid) ilike '%generated_kwh >= %';")
          [ "$CH" -ge "1" ] || { echo "::error::genreading perdeu o CHECK generated_kwh >= 0"; exit 1; }
          # SABOTAGEM 4: a imutabilidade tem gatilho (nem o dono reescreve).
          IM=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='genreading' and p.proname='guard_reading_immutable';")
          [ "$IM" = "1" ] || { echo "::error::genreading perdeu a imutabilidade da leitura"; exit 1; }

      # ⭐ creditbalance — o LIVRO DE CRÉDITOS imutável: sem status, sem
      # allowed_transition, saldo é VIEW, e consumir > saldo é RECUSADO.
      - name: a física do creditbalance está de pé (imutável, saldo VIEW, consumo>saldo recusado)
        run: |
          # SABOTAGEM 1: só INSERT,SELECT (o lançamento é fato consumado).
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type,',' order by privilege_type),'')
                            from information_schema.role_table_grants
                           where table_schema='creditbalance' and table_name='entries' and grantee='authenticated';")
          [ "$G" = "INSERT,SELECT" ] || { echo "::error::creditbalance.entries tem privilégios além de INSERT,SELECT: [$G]"; exit 1; }
          # SABOTAGEM 2: é livro imutável, não ciclo — NÃO tem allowed_transition.
          AT=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='creditbalance' and p.proname='allowed_transition';")
          [ "$AT" = "0" ] || { echo "::error::creditbalance ganhou allowed_transition — é livro imutável, não ciclo"; exit 1; }
          # SABOTAGEM 3: sem coluna status (a direção mora no credit_type).
          ST=$($PSQL -tAc "select count(*) from information_schema.columns where table_schema='creditbalance' and table_name='entries' and column_name='status';")
          [ "$ST" = "0" ] || { echo "::error::creditbalance.entries ganhou coluna status — a direção é o credit_type"; exit 1; }
          # SABOTAGEM 4: os CHECKs de credit_type e quantity_kwh>0.
          CH=$($PSQL -tAc "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='creditbalance' and c.relname='entries' and con.contype='c'
                              and (pg_get_constraintdef(con.oid) ilike '%credit_type%' or pg_get_constraintdef(con.oid) ilike '%quantity_kwh > %');")
          [ "$CH" -ge "2" ] || { echo "::error::creditbalance perdeu o CHECK de credit_type ou de quantity_kwh>0: [$CH]"; exit 1; }
          # SABOTAGEM 5: o saldo é VIEW (nunca coluna).
          V=$($PSQL -tAc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='creditbalance' and c.relname='subscription_balances' and c.relkind='v';")
          [ "$V" = "1" ] || { echo "::error::creditbalance.subscription_balances não é VIEW (o saldo virou coluna?)"; exit 1; }
          # SABOTAGEM 6: consumir > saldo é RECUSADO (a física da compensação — energia não se deve, se gera).
          RG=$($PSQL -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                            where n.nspname='creditbalance' and p.proname='guard_entry_insert'
                              and pg_get_functiondef(p.oid) ilike '%saldo%';")
          [ "$RG" -ge "1" ] || { echo "::error::creditbalance perdeu a recusa de consumo acima do saldo (a física da compensação)"; exit 1; }

      # ⚠️ IA APLICADA — a decisão de ZERO módulo, conferida: nenhum cartão sob
      # um domain_key de IA Aplicada (nem 'applied-ai' do core, nem 'ai-applied'
      # da store-taxonomy). O domínio fechou FORA, e o CI prova que ninguém
      # "colou" um módulo lá depois.
      - name: IA Aplicada permanece com ZERO módulo (a decisão de canon, conferida)
        run: |
          Z=$($PSQL -tAc "select count(*) from core.module_registry where domain_key in ('applied-ai','ai-applied');")
          [ "$Z" = "0" ] || { echo "::error::apareceu um módulo em IA Aplicada — o domínio fechou FORA (tudo é Core/Engine/Marketplace/Engenheiro)"; exit 1; }
          echo "IA Aplicada — ZERO módulo, como a investigação decidiu (honestidade, não falha)."

      - name: nenhuma porta de DELETE em quote.proposals
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='quote' and table_name='proposals'
                              and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em quote.proposals — retirar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='quote' and c.relname='proposals' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em quote.proposals"; exit 1; }

      - name: o nono cartão (quote) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='quote';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo quote declara $C consumo(s) — aceite→título está NÃO CONSTRUÍDO (spec §5)"
            exit 1; }
          echo "quote no catálogo com consumes vazio."

      - name: o oitavo cartão (inv) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='inv';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo inv declara $C consumo(s) — o caminho po→inv está NÃO CONSTRUÍDO (spec §5)"
            exit 1; }
          echo "inv no catálogo com consumes vazio."

      # ⭐⭐ A LEI DAS ETAPAS, CONFERIDA NO BANCO APLICADO.
      #
      # Nenhum tipo enumerado no schema `ops`. Se alguém "padronizar" as etapas
      # num `create type`, o produto passa a vender o processo de um cliente
      # para todos — e é a coisa mais fácil de fazer com boa intenção.
      - name: nenhuma etapa virou enum no banco
        run: |
          T=$($PSQL -tAc "select coalesce(string_agg(t.typname, ','), '')
                            from pg_type t join pg_namespace n on n.oid=t.typnamespace
                           where n.nspname='ops' and t.typtype='e';")
          [ -z "$T" ] || { echo "::error::nasceram tipos enumerados em ops: $T — a etapa é dado do tenant"; exit 1; }
          # E a tabela que sustenta a lei existe, com as duas colunas de desenho.
          C=$($PSQL -tAc "select count(*) from information_schema.columns
                           where table_schema='ops' and table_name='pipeline_stages'
                             and column_name in ('name','position','requires_approval','skippable');")
          [ "$C" = "4" ] || { echo "::error::ops.pipeline_stages perdeu uma das colunas do desenho"; exit 1; }

      # ⛔ A TRILHA NÃO TEM PORTA DE ESCRITA — nem para inventar movimento.
      #
      # É a garantia que as outras tabelas imutáveis do repositório não têm:
      # `crm.interactions` aceita INSERT direto (o fato É o dado); aqui não,
      # porque o movimento tem de passar pela função que confere a permissão do
      # ato ANTES de registrá-lo.
      - name: nenhuma porta de escrita em ops.order_events
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ','), '')
                            from information_schema.role_table_grants
                           where table_schema='ops' and table_name='order_events'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "SELECT" ] || {
            echo "::error::ops.order_events tem privilégios além de SELECT para o cliente: [$G]"; exit 1; }
          P=$($PSQL -tAc "select coalesce(string_agg(p.polcmd::text, ','), '') from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='ops' and c.relname='order_events';")
          [ "$P" = "r" ] || { echo "::error::a trilha ganhou policy além de SELECT: [$P]"; exit 1; }
          # E o entregável: só SELECT e INSERT. Refazer é versão nova.
          D=$($PSQL -tAc "select coalesce(string_agg(distinct privilege_type, ',' order by privilege_type), '')
                            from information_schema.role_table_grants
                           where table_schema='ops' and table_name='deliverables'
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ "$D" = "INSERT,SELECT" ] || {
            echo "::error::ops.deliverables tem privilégios além de INSERT/SELECT: [$D]"; exit 1; }

      # ⛔ A ÚNICA porta de DELETE do módulo é a da ETAPA — e a OS a segura.
      #
      # Redesenhar a esteira é tentativa e erro, e por isso a etapa se apaga. O
      # contrapeso é a chave `restrict` de `ops.orders`: a etapa onde há OS
      # parada NÃO se apaga. As duas coisas juntas, ou a lei vira buraco.
      - name: só a etapa tem DELETE, e a OS a protege
        run: |
          for T in pipelines orders order_events deliverables; do
            G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                              where table_schema='ops' and table_name='$T'
                                and privilege_type='DELETE'
                                and grantee in ('anon','authenticated','PUBLIC');")
            [ "$G" = "0" ] || { echo "::error::ops.$T ganhou porta de DELETE"; exit 1; }
          done
          A=$($PSQL -tAc "select confdeltype from pg_constraint
                           where conname='orders_stage_fk';")
          [ "$A" = "r" ] || {
            echo "::error::orders_stage_fk não é RESTRICT ([$A]) — apagar a etapa deixaria OS sem etapa"; exit 1; }

      # ⭐ O CATÁLOGO TEM CINCO CARTÕES, e o quinto consome ZERO.
      #
      # Lei 7: só declara consumo com handler. O ciclo fechou (`0012`/`0013` +
      # recon-settlement.ts): AR escuta `recon.match.decided`. Esta guarda
      # exige exatamente esse consumo — e só ele.
      - name: o quinto cartão declara a baixa que o handler cobre
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='ar';")
          [ "$C" = "1" ] || {
            echo "::error::o módulo ar declara $C consumo(s) — esperado 1 (recon.match.decided)"
            exit 1; }
          T=$($PSQL -tAc "select events_consumes->0->>'type'
                            from core.module_registry where module_id='ar';")
          [ "$T" = "recon.match.decided" ] || {
            echo "::error::consumo do ar é '$T' — esperado recon.match.decided"
            exit 1; }
          echo "ciclo fechado no catálogo: ar consome recon.match.decided."

      - name: o sexto cartão (po) tem consumes vazio
        run: |
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='po';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo po declara $C consumo(s) — esperado 0 (protocolo paralelo)"
            exit 1; }
          echo "po no catálogo com consumes vazio."

      # ⛔ A INTERAÇÃO É IMUTÁVEL, CONFERIDA NO BANCO APLICADO.
      #
      # Fato consumado não se edita. A decisão vive em três camadas, e esta
      # guarda confere as duas que são de privilégio — no banco, não no
      # arquivo: é a diferença entre a regra escrita e a regra em vigor.
      - name: nenhuma porta de escrita em crm.interactions
        run: |
          G=$($PSQL -tAc "select coalesce(string_agg(privilege_type, ','), '')
                            from information_schema.role_table_grants
                           where table_schema='crm' and table_name='interactions'
                             and privilege_type in ('UPDATE','DELETE')
                             and grantee in ('anon','authenticated','PUBLIC');")
          [ -z "$G" ] || { echo "::error::alguém concedeu $G em crm.interactions — fato consumado não se edita"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and c.relname='interactions'
                             and p.polcmd in ('w','d');")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de UPDATE/DELETE em crm.interactions"; exit 1; }
          # E a terceira camada, que protege de nós mesmos: o gatilho que
          # recusa até para o dono do banco.
          T=$($PSQL -tAc "select count(*) from pg_trigger t
                            join pg_class c on c.oid=t.tgrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and c.relname='interactions'
                             and t.tgname='interactions_immutable' and not t.tgisinternal;")
          [ "$T" = "1" ] || { echo "::error::o gatilho de imutabilidade sumiu de crm.interactions"; exit 1; }
          echo "crm.interactions continua imutável nas três camadas."

      # ⛔ ARQUIVAR É ESTADO, NUNCA DELETE — nas duas tabelas do módulo.
      - name: nenhuma porta de DELETE em crm
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='crm' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em crm ao cliente"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                            join pg_class c on c.oid=p.polrelid
                            join pg_namespace n on n.oid=c.relnamespace
                           where n.nspname='crm' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em crm"; exit 1; }

      # ⭐ O CATÁLOGO TEM QUATRO CARTÕES, e o quarto consome ZERO.
      #
      # Não é enfeite: é a Lei 7 conferida no banco. Se alguém declarar consumo
      # no seed sem handler construído, a Store passa a anunciar uma integração
      # que não acontece — e ninguém veria erro nenhum.
      - name: o catálogo conta a verdade sobre quem consome o quê
        run: |
          $PSQL -c "select module_id, status,
                           jsonb_array_length(events_emits)    as emite,
                           jsonb_array_length(events_consumes) as consome
                      from core.module_registry order by module_id;"
          # ⚠️ **CONTA OS MÓDULOS REAIS, não a tabela inteira** — e a distinção
          # custou uma falha antes de entrar.
          #
          # `04_install_module.sql` insere módulos FICTÍCIOS no catálogo para
          # provar o instalador: um `rascunho` (para provar que draft não
          # aparece na vitrine) e um `terceiro` publicado (para provar o teto do
          # plano). Uma contagem ingênua de `status='published'` daria 48+ e
          # reprovaria o repositório inteiro, por causa do fixture de outro
          # teste. Por isso conta a whitelist dos 80 reais (42 da Campanha das
          # 6 Ondas + 5 da Onda Dez, Compras; + 5 da Onda Onze, Supply Chain;
          # + 5 da Onda Doze parte 1/2, PMO & Projetos; + 5 da Onda Treze parte
          # 2/2, que FECHA o PMO em 10/10; + 4 da Onda Quatorze, que ABRE a
          # Qualidade; + 1 da Onda Quinze, que ABRE o ESG & Sustentabilidade;
          # + 2 da Onda Dezesseis, que ABRE Pesquisa & Desenvolvimento; + 1 da
          # Onda Dezessete, que ABRE Contábil & Fiscal — 7/8 capacidades FORA por
          # Lei 3; + 4 da Onda Dezoito, que ABRE o Vertical Varejo &
          # Supermercados — pdv·catalog·cashregister·loyalty).
          #
          # Só apareceu porque os números foram conferidos contra o banco.
          N=$($PSQL -tAc "select count(*) from core.module_registry
                           where status='published'
                             and module_id in ('recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol','mall','lease','fund','park','sec','vendor','rfq','recv','vperf','reorder','dem','sop','dc','disp','logperf','proj','sched','kanban','alloc','pcost','scrum','gantt','risk','timesheet','pfolio','nc','audit','capa','iso','esg','idea','ip','fiscalcert','pdv','catalog','cashregister','loyalty','erisk','control','whistle','vuln','secincident','continuity','plant','subscription','genreading','creditbalance');")
          [ "$N" = "84" ] || { echo "::error::o catálogo tem $N dos 84 módulos reais publicados"; exit 1; }
          C=$($PSQL -tAc "select jsonb_array_length(events_consumes)
                            from core.module_registry where module_id='crm';")
          [ "$C" = "0" ] || {
            echo "::error::o módulo crm declara $C consumo(s) no catálogo — e o handler não existe (Lei 7)"
            exit 1; }

      # ⛔ CANCELAR É ESTADO, NUNCA DELETE.
      #
      # Um título apagado é conta paga sem documento. A decisão está em duas
      # camadas — sem GRANT e sem policy — e esta guarda confere as duas no
      # BANCO APLICADO, não no arquivo: é a diferença entre a regra escrita e a
      # regra em vigor.
      - name: nenhuma porta de DELETE em ap.payables
        run: |
          # ⚠️ FILTRA O GRANTEE, e a primeira versão desta guarda não filtrava —
          # teria reprovado o repositório inteiro no primeiro run.
          #
          # `information_schema.role_table_grants` inclui os privilégios
          # IMPLÍCITOS do dono da tabela, e o dono sempre tem todos, inclusive
          # DELETE. Não há como tirar, e não faz sentido tentar: a regra é que o
          # CLIENTE não tem porta de DELETE, não que ninguém no banco tenha.
          #
          # Foi o único defeito que a contagem contra o banco revelou — e é
          # exatamente por isso que os números vêm do banco, nunca de cabeça.
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='ap' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em ap ao cliente — cancelar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='ap' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em ap"; exit 1; }
          echo "ap.payables continua sem porta de DELETE."

      - name: nenhuma porta de DELETE em po.orders
        run: |
          G=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='po' and table_name='orders'
                              and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
          [ "$G" = "0" ] || { echo "::error::alguém concedeu DELETE em po.orders — cancelar é status"; exit 1; }
          P=$($PSQL -tAc "select count(*) from pg_policy p
                             join pg_class c on c.oid=p.polrelid
                             join pg_namespace n on n.oid=c.relnamespace
                            where n.nspname='po' and c.relname='orders' and p.polcmd='d';")
          [ "$P" = "0" ] || { echo "::error::apareceu policy de DELETE em po.orders"; exit 1; }
          echo "po.orders continua sem porta de DELETE."

      # ⛔ O SEED NÃO CONCEDE PERMISSÃO DE MÓDULO.
      #
      # Ele concedia, ao papel de SISTEMA `admin`, como ponte até o instalador
      # existir. Papel de sistema vale em TODO tenant: qualquer tenant novo já
      # nascia com os módulos, sem instalar e sem ocupar vaga no plano.
      #
      # O instalador nasceu e a ponte saiu. Esta guarda existe para que ela não
      # volte por conveniência — o sintoma seria invisível com um tenant só.
      - name: nenhuma permissão de módulo em papel de sistema
        run: |
          VAZOU=$($PSQL -tAc "
            select coalesce(string_agg(permission_key, ', '), '')
              from core.role_permissions
             where tenant_id is null and module_id <> 'core';")
          [ -z "$VAZOU" ] || {
            echo "::error::o seed concedeu permissão de módulo a papel de sistema: $VAZOU"
            echo "isso vaza o módulo para TODO tenant, sem instalar e sem ocupar vaga no plano"
            exit 1; }
          echo "nenhum vazamento: permissão de módulo só existe onde alguém instalou."

      - name: a visão de saúde da fila responde
        run: |
          $PSQL -c "select * from core.courier_health order by status;"
          VEREDITO=$($PSQL -tAc "select veredito from core.courier_status();")
          echo "veredito: $VEREDITO"
          case "$VEREDITO" in
            OK|ATRASADO|PARADO|ATENCAO) ;;
            *) echo "::error::core.courier_status() devolveu algo inesperado: $VEREDITO"; exit 1 ;;
          esac
          # Nem a visão nem a função podem estar abertas: operação é assunto
          # de quem opera, e `core.event_outbox` não tem policy nenhuma.
          ABERTO=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                                where grantee in ('anon','authenticated')
                                  and table_name = 'courier_health';")
          [ "$ABERTO" = "0" ] || { echo "::error::a visão de saúde está exposta a $ABERTO papel(is)"; exit 1; }

      # ⭐ E A LEITURA DO PAINEL É ESTREITA — a global CONTINUA fechada.
      #
      # O jeito de o Painel Executivo (Etapa 15) nascer errado é um `grant
      # execute on function core.courier_status() to authenticated` — uma linha
      # que resolveria a tela e vazaria o volume de negócio dos vizinhos: um
      # cliente saberia, pelo número de pendentes, quando outro está
      # importando um extrato grande. A resposta certa foi função NOVA.
      - name: a saúde global continua fechada; a do tenant é estreita
        run: |
          for FN in courier_status tenant_courier_view; do
            ABERTA=$($PSQL -tAc "
              select count(*) from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
               where n.nspname='core' and p.proname='$FN'
                 and (has_function_privilege('authenticated', p.oid, 'execute')
                   or has_function_privilege('anon', p.oid, 'execute'));")
            [ "$ABERTA" = "0" ] || { echo "::error::core.$FN() está concedida — ela conta a fila de TODOS"; exit 1; }
          done

          for FN in tenant_courier_summary tenant_plan_usage; do
            OK=$($PSQL -tAc "
              select count(*) from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
               where n.nspname='core' and p.proname='$FN'
                 and has_function_privilege('authenticated', p.oid, 'execute');")
            [ "$OK" = "1" ] || { echo "::error::core.$FN() não está disponível ao tenant — o Painel não carrega"; exit 1; }
          done

          # ⛔ E a checagem de vínculo é a PRIMEIRA linha das três: função
          # `security definer` que confia no uuid recebido é RLS desligada com
          # outro nome.
          for FN in tenant_courier_view tenant_plan_usage; do
            $PSQL -tAc "select prosrc from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                         where n.nspname='core' and p.proname='$FN';" \
              | grep -q 'is_tenant_member' \
              || { echo "::error::core.$FN() não confere o vínculo do chamador"; exit 1; }
          done
          echo "o tenant vê o veredito e os números dele. A fila do vizinho, não."

      # ⛔ NENHUMA FUNÇÃO CHAMÁVEL POR QUEM NÃO FEZ LOGIN.
      #
      # Tabela nasce fechada; **função nasce ABERTA a `PUBLIC`**. Toda função
      # criada depois do `revoke ... on all functions` do seu schema herda esse
      # privilégio e ninguém percebe, porque o `grant` escrito logo abaixo dá a
      # impressão de que ele é a autorização — quando na verdade é decoração.
      #
      # ⚠️ Esta guarda existe porque a de cima MENTIU: a sabotagem "apagar o
      # grant do consumo do plano" passou verde. Ver `0022_revoke_public_execute.sql`.
      - name: nenhuma função de negócio aberta a anon
        run: |
          ABERTAS=$($PSQL -tAc "
            select coalesce(string_agg(n.nspname||'.'||p.proname, ', ' order by p.proname), '')
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol','mall','lease','fund','park','sec','vendor','rfq','recv','vperf','reorder','dem','sop','dc','disp','logperf','proj','sched','kanban','alloc','pcost','scrum','gantt','risk','timesheet','pfolio','nc','audit','capa','iso','esg','idea','ip','fiscalcert','pdv','catalog','cashregister','loyalty','erisk','control','whistle','vuln','secincident','continuity','plant','subscription','genreading','creditbalance')
               and has_function_privilege('anon', p.oid, 'execute');")
          [ -z "$ABERTAS" ] || { echo "::error::função executável por anon: $ABERTAS"; exit 1; }

          # E o que o portal chama de verdade continua chamável — a guarda de
          # segurança não pode fechar a porta do cliente junto.
          for FN in install_module uninstall_module advance_order skip_stage send_back_order \
                    tenant_courier_summary tenant_plan_usage; do
            OK=$($PSQL -tAc "
              select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
               where p.proname = '$FN'
                 and n.nspname in ('core','recon','marketing','ap','crm','ar','po','ops','inv','quote','deal','evt','dun','ctr','cash','care','occ','mnt','pat','chk','spc','vis','lead','goal','comm','edcal','media','nps','cc','bud','bank','invest','dre','hr','shift','train','perf','pol','mall','lease','fund','park','sec','vendor','rfq','recv','vperf','reorder','dem','sop','dc','disp','logperf','proj','sched','kanban','alloc','pcost','scrum','gantt','risk','timesheet','pfolio','nc','audit','capa','iso','esg','idea','ip','fiscalcert','pdv','catalog','cashregister','loyalty','erisk','control','whistle','vuln','secincident','continuity','plant','subscription','genreading','creditbalance')
                 and has_function_privilege('authenticated', p.oid, 'execute');")
            [ "$OK" -ge 1 ] || { echo "::error::$FN() deixou de ser chamável pelo portal"; exit 1; }
          done
          echo "anon não executa nada; o portal continua executando o que precisa."

  correio:
    name: o correio contra Postgres de verdade
    runs-on: ubuntu-latest

    # ⭐ ESTE JOB EXISTE PORQUE MEMÓRIA NÃO PROVA CONCORRÊNCIA.
    #
    # Até a Etapa 7, todas as garantias do correio foram provadas contra um
    # `OutboxStore` de memória. Contra Postgres apareceram DOIS defeitos que o
    # mock não podia revelar:
    #
    #   1. a tomada não reivindicava nada — dois entregadores pegavam os
    #      mesmos eventos;
    #   2. um handler que falhava nunca era reexecutado, e o evento acabava
    #      gravado como `delivered` sem nunca ter sido entregue.
    #
    # Este job é o que impede que voltem.

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bos_correio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bos_correio
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bos_correio

    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: montar o banco
        run: |
          $PSQL -q -f supabase/tests/00_supabase_shim.sql
          $PSQL -q -f supabase/migrations/0001_core.sql
          $PSQL -q -f supabase/migrations/0002_recon.sql
          $PSQL -q -f supabase/migrations/0003_billing.sql
          $PSQL -q -f supabase/migrations/0004_marketing.sql
          $PSQL -q -f supabase/migrations/0005_courier_cron.sql
          $PSQL -q -f supabase/migrations/0006_install.sql
          $PSQL -q -f supabase/migrations/0007_ap.sql
          $PSQL -q -f supabase/migrations/0008_recon_ap_projection.sql
          $PSQL -q -f supabase/migrations/0009_crm.sql
          $PSQL -q -f supabase/migrations/0010_ar.sql
          $PSQL -q -f supabase/migrations/0011_recon_receivables.sql
          $PSQL -q -f supabase/migrations/0012_recon_match_decided.sql
          $PSQL -q -f supabase/migrations/0013_ar_apply_recon_match.sql
          $PSQL -q -f supabase/migrations/0014_ap_apply_recon_match.sql
          $PSQL -q -f supabase/migrations/0017_po.sql
          # ⚠️ **ESTA LISTA É A SEGUNDA, e foi ela que quebrou na Etapa 15.**
          #
          # O job de schema aplica a cadeia inteira; este monta o banco com
          # uma lista PRÓPRIA, porque só precisa do que os testes de `apps/api`
          # tocam. O problema é que "o que os testes tocam" cresce sem avisar:
          # a Etapa 14 acrescentou `forge-service.test.ts`, que grava em
          # `core.ai_generations` — e a tabela nasce no `0019`, que não estava
          # aqui. O CI reprovou com `relation "core.ai_generations" does not
          # exist`, repetido em cada teste.
          #
          # Migration nova que crie objeto do Core entra NAS DUAS listas.
          $PSQL -q -f supabase/migrations/0018_ops.sql
          $PSQL -q -f supabase/migrations/0019_forge.sql
          $PSQL -q -f supabase/migrations/0020_ops_machine_draft.sql
          $PSQL -q -f supabase/migrations/0021_tenant_panel.sql
          $PSQL -q -f supabase/migrations/0022_revoke_public_execute.sql
          $PSQL -q -f supabase/migrations/0023_inv.sql
          $PSQL -q -f supabase/migrations/0024_quote.sql
          $PSQL -q -f supabase/migrations/0025_deal.sql
          $PSQL -q -f supabase/migrations/0026_evt.sql
          $PSQL -q -f supabase/migrations/0027_dun.sql
          $PSQL -q -f supabase/migrations/0028_ctr.sql
          $PSQL -q -f supabase/migrations/0029_cash.sql
          $PSQL -q -f supabase/migrations/0030_care.sql
          $PSQL -q -f supabase/migrations/0031_occ.sql
          $PSQL -q -f supabase/migrations/0032_mnt.sql
          $PSQL -q -f supabase/migrations/0033_pat.sql
          $PSQL -q -f supabase/migrations/0034_chk.sql
          $PSQL -q -f supabase/migrations/0035_spc.sql
          $PSQL -q -f supabase/migrations/0036_vis.sql
          $PSQL -q -f supabase/migrations/0037_lead.sql
          $PSQL -q -f supabase/migrations/0038_goal.sql
          $PSQL -q -f supabase/migrations/0039_comm.sql
          $PSQL -q -f supabase/migrations/0040_edcal.sql
          $PSQL -q -f supabase/migrations/0041_media.sql
          $PSQL -q -f supabase/migrations/0042_nps.sql
          $PSQL -q -f supabase/migrations/0043_cc.sql
          $PSQL -q -f supabase/migrations/0044_bud.sql
          $PSQL -q -f supabase/migrations/0045_bank.sql
          $PSQL -q -f supabase/migrations/0046_invest.sql
          $PSQL -q -f supabase/migrations/0047_dre.sql
          $PSQL -q -f supabase/seed/0001_platform.sql

      # ⚠️ Sem `DATABASE_URL` os testes do store se PULAM — de propósito, para
      # que ninguém os veja "passar" sem banco. Aqui a variável existe, então
      # pular seria bug: este passo reprova se algum teste for pulado, ou se
      # nenhum rodar.
      - name: o correio contra Postgres (store, concorrência, composição)
        run: |
          set -o pipefail
          pnpm test:api 2>&1 | tee /tmp/api.log
          PULADOS=$(grep -oP '^# skipped \K\d+' /tmp/api.log | head -1)
          PASSOU=$(grep -oP '^# pass \K\d+' /tmp/api.log | head -1)
          echo "passaram=$PASSOU pulados=$PULADOS"
          [ "${PULADOS:-0}" = "0" ] || { echo "::error::$PULADOS teste(s) pulados — o job ficaria verde sem provar nada"; exit 1; }
          # O piso sobe quando a suíte cresce. Na Etapa 10 o bloco do triângulo
          # acrescentou 9 testes; deixar o piso em 15 faria o job ficar verde
          # com o arquivo do triângulo inteiro fora da coleta.
          # A Etapa 14 acrescentou os 21 testes da forja; o piso sobe junto,
          # senão um arquivo inteiro pode sair da coleta sem o job notar.
          [ "${PASSOU:-0}" -gt 45 ] || { echo "::error::só $PASSOU teste(s) rodaram; o arquivo não foi coletado"; exit 1; }

  contract:
    name: manifesto, tipos e domínio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ SEM `version:` aqui, de propósito.
      #
      # A versão do pnpm tem UMA fonte só: `packageManager` no package.json da
      # raiz. Declarar `version: 9` aqui também fazia a action abortar com
      # "Multiple versions of pnpm specified" — e o job morria no setup, antes
      # de instalar qualquer coisa. Sol Único vale para ferramenta também.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trava a divergência entre o ModuleManifest e o seed do catálogo:
      # se a Store passar a anunciar algo que o código não faz, quebra aqui.
      - run: pnpm typecheck
      - run: pnpm test

      # A Lei 7 com o sinal trocado: negar o que já existe.
      #
      # As Etapas 4, 5 e 6 construíram parser, telas, correio e contabilidade
      # de uso — e SEIS documentos continuaram dizendo que nada disso existia,
      # inclusive dois de leitura obrigatória no VERTEX. Nenhuma guarda pegou,
      # porque defasagem não exige que ninguém escreva nada: basta não apagar.
      #
      # `pnpm test:docs` roda o autoteste da guarda (ela ainda morde?);
      # `pnpm verificar:docs` varre o repositório de verdade.
      - run: pnpm test:docs
      - run: pnpm verificar:docs

      # É isto que a Vercel roda. Se passa aqui, passa lá.
      - run: pnpm build:portal

      # ⭐ A REGRA DE OURO, VERIFICADA (CLAUDE.md §5.3).
      # `apps/` é a PELE. Se alguém escrever regra de negócio numa tela
      # "porque era mais rápido", o build continuaria passando — e a dívida
      # entraria em silêncio. Este passo não deixa.
      - name: nenhuma cor fora do canon em apps/
        run: |
          SOLTO=$(grep -rInE '#[0-9a-fA-F]{3,8}\b' apps --include='*.tsx' --include='*.ts' || true)
          if [ -n "$SOLTO" ]; then
            echo "::error::HEX solto em apps/ — toda cor vem de var(--bos-*)"; echo "$SOLTO"; exit 1
          fi
          CRUA=$(grep -rInE '\b(bg|text|border)-(white|black|gray|slate|zinc|neutral|stone|red|blue|green|amber|yellow|purple|pink|indigo)-?[0-9]*\b' apps --include='*.tsx' || true)
          if [ -n "$CRUA" ]; then
            echo "::error::classe de cor crua do Tailwind em apps/ — use os tokens bos-*"; echo "$CRUA"; exit 1
          fi

      - name: o motor não foi reimplementado em apps/
        run: |
          # A tela CHAMA o domínio; se um dia ela declarar o próprio, o
          # coração terá migrado para a pele. Inclui o parser: ler extrato é
          # regra de negócio (decide sinal, arredondamento, fuso, duplicata).
          if grep -rInE 'function (suggestMatches|scorePair|unmatchedLines|summarizeStatement|parseOfx|parseCsv|parseStatement|parseAmountToCents|parseDate)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::motor de domínio redeclarado em apps/ — ele vive em packages/"; exit 1
          fi
          # Procura a CHAMADA no CÓDIGO, ignorando linhas de comentário.
          #
          # Duas versões anteriores desta guarda passaram na sabotagem: a
          # primeira casava o nome em qualquer lugar; a segunda exigia
          # `suggestMatches(` mas o próprio JSDoc da página tem essa string
          # com parêntese. Guarda que não é testada contra sabotagem não é
          # guarda — é decoração.
          CODIGO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/conciliacao/page.tsx)
          echo "$CODIGO" | grep -Eq 'suggestMatches\(' \
            || { echo "::error::a tela de conciliação deixou de chamar o motor do pacote"; exit 1; }
          echo "$CODIGO" | grep -Eq 'unmatchedLines\(' \
            || { echo "::error::a tela deixou de usar unmatchedLines do pacote"; exit 1; }

          FECHA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/fechamento/page.tsx)
          echo "$FECHA" | grep -Eq 'summarizeStatement\(' \
            || { echo "::error::a tela de fechamento deixou de usar summarizeStatement do pacote"; exit 1; }

          IMPORTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/actions.ts)
          echo "$IMPORTA" | grep -Eq 'parseStatement\(' \
            || { echo "::error::a importação deixou de usar o parser do pacote — ler extrato é regra de negócio"; exit 1; }

          # Módulo 2: a máquina de estados da campanha é DECISÃO, e decisão
          # mora no pacote. Escrever `if (status === 'draft')` numa Server
          # Action é o jeito mais provável de a regra migrar para a pele.
          if grep -rInE 'function (planTransition|canTransition|budgetStatusFor)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a máquina de estados da campanha foi redeclarada em apps/"; exit 1
          fi
          MKT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/marketing-actions.ts)
          echo "$MKT" | grep -Eq 'planTransition\(' \
            || { echo "::error::a ação de campanha deixou de chamar o motor do pacote"; exit 1; }
          echo "$MKT" | grep -Eq 'budgetStatusFor\(' \
            || { echo "::error::a ação deixou de consultar a projeção de verba do pacote"; exit 1; }

          # E a tela não pode reinventar a regra de verba com um `if` próprio.
          if grep -rInE "budgetStatus\s*===?\s*'approved'" \
               apps/portal/src/app apps/portal/src/lib --include='*.ts' --include='*.tsx'; then
            echo "::error::a regra de liberação de verba apareceu em apps/ — ela é settings do tenant, decidida no pacote"; exit 1
          fi

          # Módulo 3: validação do título, ciclo de vida e a conta do saldo são
          # DECISÃO. A forma mais provável de migrarem para a pele é alguém
          # escrever `if (amountCents <= 0)` no Server Action "porque era mais
          # rápido", ou `t.dueDate < hoje` no componente da lista.
          if grep -rInE 'function (validateNewPayable|statusForSettlement|nextStatuses|outstandingCents|isOverdue|canCancel)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contas a pagar foi redeclarado em apps/"; exit 1
          fi
          AP=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ap-actions.ts)
          echo "$AP" | grep -Eq 'validateNewPayable\(' \
            || { echo "::error::a ação de contas a pagar deixou de validar pelo pacote"; exit 1; }
          echo "$AP" | grep -Eq 'canTransition\(' \
            || { echo "::error::a ação deixou de consultar o ciclo de vida do pacote"; exit 1; }
          LISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/payable-list.tsx)
          echo "$LISTA" | grep -Eq 'isOverdue\(' \
            || { echo "::error::a lista deixou de perguntar ao pacote o que está vencido"; exit 1; }
          # O jeito mais provável de a conta de atraso migrar para a tela.
          # ⚠️ Lê CÓDIGO, não prosa — pela QUARTA vez neste repositório.
          #
          # A primeira versão desta guarda reprovou o comentário do próprio
          # componente, que diz "se alguém escrever `t.dueDate < hoje` aqui, a
          # regra passa a existir em dois lugares". A guarda mordeu a
          # documentação que ela existe para proteger.
          #
          # O padrão já é conhecido (§ máquina de estados, § tenant, § Store), e
          # a correção é sempre a mesma: descartar as linhas de comentário.
          ATRASO=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'dueDate\s*<\s*(hoje|today|now)' apps 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$ATRASO" ]; then
            echo "::error::a regra de vencimento apareceu em apps/ — ela é isOverdue(), no pacote"
            echo "$ATRASO"; exit 1
          fi

          # Módulo 4: a busca da carteira, o resumo e o ciclo de vida são
          # DECISÃO. A forma mais provável de migrarem para a pele é alguém
          # escrever `p.displayName.includes(busca)` no componente da lista
          # "porque era mais rápido" — e aí a mesma pergunta passa a ter duas
          # respostas no dia em que a busca também acontecer no servidor.
          if grep -rInE 'function (validateNewParty|validateNewInteraction|matchesQuery|summarizeParties|normalizeTags)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de relacionamentos foi redeclarado em apps/"; exit 1
          fi
          CRM=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/crm-actions.ts)
          for FN in validateNewParty validateNewInteraction canTransition; do
            echo "$CRM" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de relacionamentos deixou de chamar $FN() do pacote"; exit 1; }
          done
          PLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/party-list.tsx)
          echo "$PLISTA" | grep -Eq '\bmatchesQuery\(' \
            || { echo "::error::a lista deixou de usar a busca do pacote"; exit 1; }
          # E o jeito mais provável de a busca migrar para a tela.
          BUSCA=$(grep -rIn --include='*.tsx' --include='*.ts' -E '(displayName|display_name)[^;]{0,40}\.(includes|indexOf|match)\(' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$BUSCA" ]; then
            echo "::error::a busca da carteira apareceu em apps/ — ela é matchesQuery(), no pacote"
            echo "$BUSCA"; exit 1
          fi

          # ⛔ E a tela NÃO reimplementa a imutabilidade da interação com um
          # `if`. Ela não oferece o botão porque a operação não existe — três
          # camadas de banco a recusam. Um caminho de edição em apps/ seria a
          # tela prometendo o que o schema nega.
          EDITA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "from\('interactions'\)[^;]{0,60}\.(update|delete)\(|updateInteraction|deleteInteraction" apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$EDITA" ]; then
            echo "::error::apareceu caminho de editar/apagar interação em apps/ — fato consumado não se edita"
            echo "$EDITA"; exit 1
          fi

          # Módulo 5: saldo, excedente e ciclo de vida são DECISÃO. E aqui há
          # uma armadilha específica do espelho: a conta do saldo escrita à mão
          # (`amountCents - receivedAmountCents`) devolve NEGATIVO no caso de
          # recebimento a maior, que é exatamente o que o pacote evita — e o
          # negativo entraria somando no total em aberto da tela.
          if grep -rInE 'function (validateNewReceivable|statusForReceipt|outstandingCents|overpaidCents|summarizeReceivables)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contas a receber foi redeclarado em apps/"; exit 1
          fi
          AR=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ar-actions.ts)
          for FN in validateNewReceivable canTransition; do
            echo "$AR" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de contas a receber deixou de chamar $FN() do pacote"; exit 1; }
          done
          RLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/receivable-list.tsx)
          for FN in outstandingCents overpaidCents isOverdue; do
            echo "$RLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de recebíveis deixou de usar $FN() do pacote"; exit 1; }
          done
          SALDO=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'amountCents\s*-\s*receivedAmountCents' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SALDO" ]; then
            echo "::error::o saldo a receber foi calculado em apps/ — ele é outstandingCents(), que nunca devolve negativo"
            echo "$SALDO"; exit 1
          fi

          # Módulo 6: ciclo de vida, soma de itens e validação são DECISÃO.
          # Formulário com linhas dinâmicas não autoriza recalcular total na pele.
          if grep -rInE 'function (validateNewOrder|statusForReceipt|sumItems|lineTotalCents|canSubmit|canReceive|nextStatuses)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de compras/pedidos foi redeclarado em apps/"; exit 1
          fi
          PO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/po-actions.ts)
          for FN in validateNewOrder canTransition canCancel canSubmit canReceive; do
            echo "$PO" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de compras deixou de chamar $FN() do pacote"; exit 1; }
          done
          OLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/order-list.tsx)
          for FN in canCancel canSubmit canReceive; do
            echo "$OLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de pedidos deixou de usar $FN() do pacote"; exit 1; }
          done
          # Módulo 6: a esteira, o quadro e o versionamento são DECISÃO.
          #
          # ⭐ A armadilha específica deste módulo é a MAIS FÁCIL de todas: um
          # `orders.filter(o => o.currentStageId === stage.id)` escrito direto
          # na tela monta o quadro e parece certo — e esquece a regra "OS
          # concluída não entra em coluna nenhuma", empilhando para sempre na
          # última coluna tudo o que já foi entregue.
          if grep -rInE 'function (buildBoard|nextStage|stagesBefore|nextVersion|permissionToAdvance|whyCannotAdvance|whyCannotSkip|validateStages|orderedStages)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio da esteira foi redeclarado em apps/"; exit 1
          fi
          OPS=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ops-actions.ts)
          for FN in validateStages validateNewOrder orderedStages whyCannotAdvance whyCannotSkip canTransition nextVersion; do
            echo "$OPS" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação da esteira deixou de chamar $FN() do pacote"; exit 1; }
          done
          QUADRO=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/pipeline-board.tsx)
          echo "$QUADRO" | grep -Eq '\bbuildBoard\(' \
            || { echo "::error::o quadro deixou de usar buildBoard() — as colunas são as etapas do tenant"; exit 1; }
          COLUNA=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'currentStageId\s*===?\s*(stage|etapa)' apps 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$COLUNA" ]; then
            echo "::error::o quadro foi montado à mão em apps/ — é buildBoard(), que exclui OS fora da esteira"
            echo "$COLUNA"; exit 1
          fi

          # Módulo 8: o SALDO é a decisão. A armadilha específica é a mais
          # tentadora de todas: um `reduce` somando movimentos direto na tela
          # monta a lista e parece certo — e esquece o sinal do tipo, ou o
          # local, ou soma o arquivado. O saldo é buildBalances()/balanceFor(),
          # no pacote, e o sinal é signedQuantity().
          if grep -rInE 'function (buildBalances|balanceFor|balanceState|ledgerFor|signedQuantity|validateNewItem|validateNewMovement|permissionForMovement|summarizeInventory)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do estoque foi redeclarado em apps/"; exit 1
          fi
          INV=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/inv-actions.ts)
          for FN in validateNewItem validateNewMovement canTransition permissionForMovement; do
            echo "$INV" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do estoque deixou de chamar $FN() do pacote"; exit 1; }
          done
          IPAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/estoque/page.tsx)
          echo "$IPAGE" | grep -Eq '\bbuildBalances\(' \
            || { echo "::error::a tela do estoque deixou de usar buildBalances() do pacote"; exit 1; }
          IEXTRATO=$(grep -Ev '^\s*(\*|//|/\*)' 'apps/portal/src/app/estoque/[itemId]/page.tsx')
          for FN in ledgerFor balanceFor signedQuantity; do
            echo "$IEXTRATO" | grep -Eq "\b$FN\(" \
              || { echo "::error::o extrato deixou de usar $FN() do pacote"; exit 1; }
          done
          # O jeito mais provável de a soma migrar para a pele: o sinal do
          # tipo escrito à mão num componente.
          SOMA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "kind\s*===?\s*'out'\s*\?\s*-" apps 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SOMA" ]; then
            echo "::error::o sinal do movimento foi decidido em apps/ — ele é signedQuantity(), no pacote"
            echo "$SOMA"; exit 1
          fi

          # Módulo 9: o ciclo, a soma e a expiração são DECISÃO. A armadilha
          # específica: um `validUntil < hoje` escrito na tela decide a
          # expiração — e esquece que rascunho não expira e que sem validade
          # não expira nunca. É isExpirable(), no pacote.
          if grep -rInE 'function (validateNewProposal|canSend|canDecide|isExpirable|summarizeProposals|canEditContent)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de propostas foi redeclarado em apps/"; exit 1
          fi
          QT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/quote-actions.ts)
          for FN in validateNewProposal canSend canDecide canCancel canTransition isExpirable; do
            echo "$QT" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de propostas deixou de chamar $FN() do pacote"; exit 1; }
          done
          QLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/proposal-list.tsx)
          for FN in canSend canDecide canCancel isExpirable; do
            echo "$QLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de propostas deixou de usar $FN() do pacote"; exit 1; }
          done
          VALIDADE=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'validUntil\s*<\s*(hoje|today|now)' apps 2>/dev/null \
                     | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VALIDADE" ]; then
            echo "::error::a expiração foi decidida em apps/ — ela é isExpirable(), no pacote"
            echo "$VALIDADE"; exit 1
          fi

          # Módulo 10: o quadro e o forecast são DECISÃO. As armadilhas: montar
          # coluna à mão (a guarda de currentStageId === já cobre, herdada do
          # ops) e ponderar valor por probabilidade num componente.
          if grep -rInE 'function (buildFunnelBoard|weightedCents|validateNewOpportunity|validateFunnelStages|whyCannotLose|summarizeFunnel|isPastExpectedClose|activeFunnels)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do funil foi redeclarado em apps/"; exit 1
          fi
          DL=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/deal-actions.ts)
          for FN in validateNewOpportunity validateFunnelStages whyCannotLose canClose; do
            echo "$DL" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do funil deixou de chamar $FN() do pacote"; exit 1; }
          done
          DBOARD=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/funnel-board.tsx)
          echo "$DBOARD" | grep -Eq '\bbuildFunnelBoard\(' \
            || { echo "::error::o quadro do funil deixou de usar buildFunnelBoard()"; exit 1; }
          # ⚠️ `[a-zA-Z_.]*` antes de `prob`: a primeira versão exigia a
          # palavra logo após o `*`, e a sabotagem `o.valueCents *
          # o.probability` passou verde — o prefixo do objeto cegava a
          # guarda. Sabotada antes de entrar, corrigida antes de valer.
          PONDERA=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'valueCents\s*\*\s*[a-zA-Z_.]*prob' apps 2>/dev/null \
                    | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$PONDERA" ]; then
            echo "::error::o forecast foi ponderado em apps/ — ele é weightedCents(), no pacote"
            echo "$PONDERA"; exit 1
          fi

          # Módulo 11: a lotação e o calendário são DECISÃO. A armadilha: uma
          # conta de vagas escrita na tela (capacity - inscritos) esquece que
          # cancelada não ocupa vaga — e que sem teto NÃO HÁ conta.
          if grep -rInE 'function (remainingCapacity|isFull|canHold|canRegister|canAttend|validateNewEvent|validateNewRegistration|summarizeEvents|activeRegistrations)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de eventos foi redeclarado em apps/"; exit 1
          fi
          EV=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/evt-actions.ts)
          for FN in validateNewEvent validateNewRegistration canTransitionEvent canHold canRegister isFull; do
            echo "$EV" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de eventos deixou de chamar $FN() do pacote"; exit 1; }
          done
          ELISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/event-list.tsx)
          for FN in remainingCapacity isFull canHold canPublish canAttend; do
            echo "$ELISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a lista de eventos deixou de usar $FN() do pacote"; exit 1; }
          done
          VAGAS=$(grep -rIn --include='*.ts' --include='*.tsx' -E 'capacity\s*-\s*[a-zA-Z_.]*(regist|inscri)' apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VAGAS" ]; then
            echo "::error::as vagas foram contadas em apps/ — é remainingCapacity(), no pacote"
            echo "$VAGAS"; exit 1
          fi

          # Módulo 12: a fila, o atraso e o PRÓXIMO PASSO são DECISÃO. A
          # armadilha: um `dueDate < hoje` na tela decide quem está vencido —
          # a mesma do ap, agora na régua (a guarda de dueDate acima já cobre
          # o literal; esta confere as chamadas).
          if grep -rInE 'function (isInQueue|daysOverdue|dueSteps|nextStep|positionOf|validateRulerSteps|outstandingCentsOf|summarizeQueue)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio da régua foi redeclarado em apps/"; exit 1
          fi
          DN=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/dun-actions.ts)
          for FN in validateRulerSteps isInQueue nextStep; do
            echo "$DN" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação da régua deixou de chamar $FN() do pacote"; exit 1; }
          done
          DFILA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/dun-queue.tsx)
          for FN in isInQueue daysOverdue nextStep positionOf outstandingCentsOf; do
            echo "$DFILA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a fila da régua deixou de usar $FN() do pacote"; exit 1; }
          done

          # ⭐ E a Lei das Etapas na PELE: nenhum nome de etapa escrito em apps/.
          # A tela desenha o que o tenant desenhou; ela não conhece "briefing".
          #
          # ⚠️ A busca é pela COMPARAÇÃO com o literal, e não por
          # `stageName === '...'`. A primeira versão desta guarda exigia o
          # nome da variável e uma sabotagem passou por baixo dela escrevendo
          # `s.name === 'briefing'` — o defeito real não escolhe o nome da
          # variável. Comparar QUALQUER coisa com o nome de uma etapa é o que
          # está proibido.
          ETAPA=$(grep -rIn --include='*.ts' --include='*.tsx' -E "[=!]==?\s*['\"](briefing|criacao|criação|revisao|revisão|aprovacao|aprovação|veiculacao|veiculação)['\"]" apps 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$ETAPA" ]; then
            echo "::error::apareceu nome de etapa comparado em apps/ — a etapa é dado do tenant"
            echo "$ETAPA"; exit 1
          fi

          # Módulo 13: o TERMO VIGENTE e o calendário são DECISÃO. As
          # armadilhas: a tela escolher o "último reajuste" por conta própria,
          # ou comparar o fim de vigência com hoje num componente.
          if grep -rInE 'function (currentValueCents|currentEndsOn|daysToEnd|canEnd|canActivate|canAdjust|canRenew|whyCannotTerminate|whyCannotRenewTo|buildExpiryQueue|validateNewContract|summarizeContracts)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de contratos foi redeclarado em apps/"; exit 1
          fi
          CT=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/ctr-actions.ts)
          for FN in validateNewContract canActivate canEnd whyCannotTerminate whyCannotRenewTo canAdjust; do
            echo "$CT" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de contratos deixou de chamar $FN() do pacote"; exit 1; }
          done
          CLISTA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/contract-list.tsx)
          for FN in currentValueCents currentEndsOn daysToEnd canEnd canActivate canAdjust canRenew; do
            echo "$CLISTA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a carteira de contratos deixou de usar $FN() do pacote"; exit 1; }
          done
          # A armadilha do vigente: escolher o último reajuste/renovação na
          # tela. `sort`/`at` sobre os livros só existe no pacote (e no mock,
          # que simula o banco — por isso o grep mira componentes e ações).
          VIGENTE=$(grep -rIn -E '(adjustments|renewals)[^\n]*\.(sort|at)\(' \
                    apps/portal/src/components apps/portal/src/app 2>/dev/null \
                    | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VIGENTE" ]; then
            echo "::error::o termo vigente foi calculado na tela — ele é currentValueCents()/currentEndsOn(), no pacote"
            echo "$VIGENTE"; exit 1
          fi
          VENCE=$(grep -rIn -E '(endsOn|EndsOn)\s*[<>]=?\s*(hoje|today|now)' \
                  apps/portal/src/components apps/portal/src/app 2>/dev/null \
                  | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$VENCE" ]; then
            echo "::error::o vencimento do contrato foi decidido na tela — ele é daysToEnd()/canEnd(), no pacote"
            echo "$VENCE"; exit 1
          fi

          # Módulo 14: o SALDO é DECISÃO. A armadilha clássica de todo caixa:
          # a tela somando lançamentos (reduce sobre o livro) ou decidindo o
          # sinal (`kind === 'out' ? -`) por conta própria.
          if grep -rInE 'function (balancesByCurrency|totalsByCategory|monthlyFlow|signedAmountCents|validateNewEntry|validateNewCategory|summarizeEntries|permissionForEntry)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do caixa foi redeclarado em apps/"; exit 1
          fi
          CA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/cash-actions.ts)
          for FN in validateNewEntry validateNewCategory; do
            echo "$CA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do caixa deixou de chamar $FN() do pacote"; exit 1; }
          done
          CPAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/caixa/page.tsx)
          echo "$CPAGE" | grep -Eq '\bbalancesByCurrency\(' \
            || { echo "::error::a página do caixa deixou de usar balancesByCurrency()"; exit 1; }
          SOMA=$(grep -rIn -E "kind\s*===?\s*'out'\s*\?\s*-|reduce\([^)]*[Aa]mountCents" \
                 apps/portal/src/components apps/portal/src/app 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$SOMA" ]; then
            echo "::error::o saldo/sinal foi decidido na tela — é signedAmountCents()/balancesByCurrency(), no pacote"
            echo "$SOMA"; exit 1
          fi

          # Módulo 15: a ORDEM da fila e o atraso são DECISÃO. As armadilhas:
          # ordenar por prioridade na tela, ou um `dueAt <` comparado com
          # agora num componente.
          if grep -rInE 'function (orderTickets|isOverdue|canReopen|canResolve|canClose|canStart|canEditTicket|canInteract|validateNewTicket|validateInteraction|summarizeTickets)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio do atendimento foi redeclarado em apps/"; exit 1
          fi
          CR=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/care-actions.ts)
          for FN in validateNewTicket validateInteraction canResolve canClose canReopen canInteract; do
            echo "$CR" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação do atendimento deixou de chamar $FN() do pacote"; exit 1; }
          done
          CQ=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/care-queue.tsx)
          for FN in orderTickets isOverdue canResolve canReopen canClose; do
            echo "$CQ" | grep -Eq "\b$FN\(" \
              || { echo "::error::a fila do atendimento deixou de usar $FN() do pacote"; exit 1; }
          done
          FILA=$(grep -rIn -E 'dueAt\s*[<>]=?\s*(now|hoje|today)|sort\([^)]*position' \
                 apps/portal/src/components/care-queue.tsx apps/portal/src/app/atendimento 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$FILA" ]; then
            echo "::error::a fila/atraso foi decidida na tela — é orderTickets()/isOverdue(), no pacote"
            echo "$FILA"; exit 1
          fi

          # Módulo 16: a ORDEM do livro e a recusa do encerramento são
          # DECISÃO. A armadilha: ordenar por gravidade na tela, ou encerrar
          # sem passar por whyCannotClose().
          if grep -rInE 'function (orderOccurrences|whyCannotClose|canTreat|validateNewOccurrence|validateTreatment|summarizeOccurrences)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio de ocorrências foi redeclarado em apps/"; exit 1
          fi
          OA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/occ-actions.ts)
          for FN in validateNewOccurrence validateTreatment whyCannotClose canTreat; do
            echo "$OA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação de ocorrências deixou de chamar $FN() do pacote"; exit 1; }
          done
          OB=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/occ-book.tsx)
          for FN in orderOccurrences canTreat canClose; do
            echo "$OB" | grep -Eq "\b$FN\(" \
              || { echo "::error::o livro de ocorrências deixou de usar $FN() do pacote"; exit 1; }
          done
          GRAV=$(grep -rIn -E 'severit[a-z]*[^\n]*\.sort\(|sort\([^)]*severity' \
                 apps/portal/src/components/occ-book.tsx apps/portal/src/app/ocorrencias 2>/dev/null \
                 | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$GRAV" ]; then
            echo "::error::o livro foi ordenado na tela — é orderOccurrences(), no pacote"
            echo "$GRAV"; exit 1
          fi

          # Módulo 17: a PRÓXIMA DEVIDA e o quadro são DECISÃO. A armadilha
          # clássica: a tela somando completedAt + recurrenceDays.
          if grep -rInE 'function (buildPreventiveQueue|nextDueOn|orderBoard|whyCannotComplete|canReopen|validateNewOrder|summarizeOrders)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o domínio da manutenção foi redeclarado em apps/"; exit 1
          fi
          MA=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/mnt-actions.ts)
          for FN in validateNewOrder whyCannotComplete canStart canReopen canCancel; do
            echo "$MA" | grep -Eq "\b$FN\(" \
              || { echo "::error::a ação da manutenção deixou de chamar $FN() do pacote"; exit 1; }
          done
          MB=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/components/mnt-board.tsx)
          for FN in buildPreventiveQueue orderBoard canComplete canReopen; do
            echo "$MB" | grep -Eq "\b$FN\(" \
              || { echo "::error::o quadro da manutenção deixou de usar $FN() do pacote"; exit 1; }
          done
          DEVIDA=$(grep -rIn -E 'completedAt[^\n]*\+[^\n]*recurrenceDays|recurrenceDays[^\n]*\+[^\n]*completedAt' \
                   apps/portal/src/components apps/portal/src/app 2>/dev/null \
                   | grep -Ev '^[^:]+:[0-9]+:\s*(\*|//|/\*)' || true)
          if [ -n "$DEVIDA" ]; then
            echo "::error::a próxima devida foi calculada na tela — é nextDueOn()/buildPreventiveQueue(), no pacote"
            echo "$DEVIDA"; exit 1
          fi

      # ⭐⭐ A LEI DO LEGO, VERIFICADA (CLAUDE.md §5.5, regras 3 e 5).
      #
      # A Etapa 7 pôs dois módulos conversando. A tese inteira da plataforma é
      # que eles conversam **por contrato** e não **por código** — e a diferença
      # entre as duas coisas é literalmente um `import` que ninguém revisa.
      #
      # Um `import type` do outro módulo compilaria, passaria nos testes e
      # pareceria inofensivo. E aí desinstalar um módulo quebraria o outro, que
      # é exatamente o que a Store não pode permitir.
      - name: módulo não conhece módulo
        run: |
          FALHOU=0
          MODULOS="finance-reconciliation marketing accounts-payable crm accounts-receivable purchase-orders ops inventory quotes deals event-management dunning contracts cashflow care occurrences maintenance assets checklists spaces visits leads goals comms editorial media nps cost-centers budgets bank-accounts investments dre hr shift-scheduling training performance policies mall lease fund park sec vendor rfq recv vperf reorder dem sop dc disp logperf proj sched kanban alloc pcost scrum gantt risk timesheet pfolio non-conformities audits capa iso esg idea ip fiscalcert pdv catalog cashregister loyalty erisk control whistle vuln secincident continuity plant subscription genreading creditbalance"

          # 1. Nenhum módulo importa outro módulo, em nenhuma forma.
          for MOD in $MODULOS; do
            for OUTRO in $MODULOS; do
              [ "$MOD" = "$OUTRO" ] && continue
              if grep -rInE "from '@alsham/$OUTRO'|require\('@alsham/$OUTRO'\)" \
                   "packages/$MOD/src" 2>/dev/null; then
                echo "::error::@alsham/$MOD importa @alsham/$OUTRO — módulo não depende de módulo"
                FALHOU=1
              fi
            done
          done

          # 2. E nem pelo package.json: dependência declarada é dependência.
          #    `devDependencies` de teste também não vale — se o teste precisa
          #    do outro módulo, o acoplamento é real.
          for MOD in $MODULOS; do
            if grep -qE '"@alsham/(finance-reconciliation|marketing|accounts-payable|crm|accounts-receivable|purchase-orders|ops|inventory|quotes|deals|event-management|dunning|contracts|cashflow|care|occurrences|maintenance)"' \
                 <(grep -v "\"@alsham/$MOD\"" "packages/$MOD/package.json"); then
              echo "::error::packages/$MOD declara outro módulo como dependência"
              FALHOU=1
            fi
          done

          # 3. Nenhum schema de módulo toca o schema de outro no SQL.
          #    Lê CÓDIGO, não prosa: os comentários dos arquivos explicam
          #    justamente esta regra, e citam o nome do outro schema ao fazê-lo.
          #
          #    ⚠️ `0008_recon_ap_projection.sql` NÃO entra nesta lista, e não é
          #    exceção: ela é uma migration do `recon`, e o que ela cria é
          #    objeto `recon.*`. Por isso ela existe separada da `0007` — se a
          #    porta de projeção morasse dentro do arquivo do módulo de Contas
          #    a Pagar, esta guarda precisaria aprender a ignorar um caso. É
          #    justamente o que se evitou. Ela é conferida abaixo, no item 4.
          #
          #    ⚠️ **A MATRIZ É GERADA, não escrita à mão — e mudou na Etapa 11.**
          #
          #    Com três módulos eram 6 pares e dava para listar. Com quatro são
          #    12, e com cinco serão 20: uma lista escrita à mão é uma lista que
          #    um dia esquece um par, em silêncio, e justamente o par novo.
          #    Aqui os pares saem do produto cartesiano dos schemas, nos DOIS
          #    sentidos — acrescentar um módulo é acrescentar uma linha ao mapa.
          declare -A SCHEMA_DE=(
            [0002_recon.sql]=recon
            [0004_marketing.sql]=marketing
            [0007_ap.sql]=ap
            [0009_crm.sql]=crm
            [0010_ar.sql]=ar
            [0017_po.sql]=po
            [0018_ops.sql]=ops
            [0020_ops_machine_draft.sql]=ops
            [0023_inv.sql]=inv
            [0024_quote.sql]=quote
            [0025_deal.sql]=deal
            [0026_evt.sql]=evt
            [0027_dun.sql]=dun
            [0028_ctr.sql]=ctr
            [0029_cash.sql]=cash
            [0030_care.sql]=care
            [0031_occ.sql]=occ
            [0032_mnt.sql]=mnt
            [0033_pat.sql]=pat
            [0034_chk.sql]=chk
            [0035_spc.sql]=spc
            [0036_vis.sql]=vis
            [0037_lead.sql]=lead
            [0038_goal.sql]=goal
            [0039_comm.sql]=comm
            [0040_edcal.sql]=edcal
            [0041_media.sql]=media
            [0042_nps.sql]=nps
            [0043_cc.sql]=cc
            [0044_bud.sql]=bud
            [0045_bank.sql]=bank
            [0046_invest.sql]=invest
            [0047_dre.sql]=dre
            [0058_vendor.sql]=vendor
            [0059_rfq.sql]=rfq
            [0060_recv.sql]=recv
            [0061_vperf.sql]=vperf
            [0062_reorder.sql]=reorder
            [0063_dem.sql]=dem
            [0064_sop.sql]=sop
            [0065_dc.sql]=dc
            [0066_disp.sql]=disp
            [0067_logperf.sql]=logperf
            [0068_proj.sql]=proj
            [0069_sched.sql]=sched
            [0070_kanban.sql]=kanban
            [0071_alloc.sql]=alloc
            [0072_pcost.sql]=pcost
            [0073_scrum.sql]=scrum
            [0074_gantt.sql]=gantt
            [0075_risk.sql]=risk
            [0076_timesheet.sql]=timesheet
            [0077_pfolio.sql]=pfolio
            [0078_nc.sql]=nc
            [0079_audit.sql]=audit
            [0080_capa.sql]=capa
            [0081_iso.sql]=iso
            [0082_esg.sql]=esg
            [0083_idea.sql]=idea
            [0084_ip.sql]=ip
            [0085_fiscalcert.sql]=fiscalcert
            [0086_pdv.sql]=pdv
            [0087_catalog.sql]=catalog
            [0088_cashregister.sql]=cashregister
            [0089_loyalty.sql]=loyalty
            [0090_erisk.sql]=erisk
            [0091_control.sql]=control
            [0092_whistle.sql]=whistle
            [0093_vuln.sql]=vuln
            [0094_secincident.sql]=secincident
            [0095_continuity.sql]=continuity
            [0096_plant.sql]=plant
            [0097_subscription.sql]=subscription
            [0098_genreading.sql]=genreading
            [0099_creditbalance.sql]=creditbalance
          )
          for ARQUIVO in "${!SCHEMA_DE[@]}"; do
            DONO="${SCHEMA_DE[$ARQUIVO]}"
            CODIGO=$(sed 's/--.*//' "supabase/migrations/$ARQUIVO")
            for OUTRO in "${SCHEMA_DE[@]}"; do
              [ "$DONO" = "$OUTRO" ] && continue
              if echo "$CODIGO" | grep -qE "\b$OUTRO\."; then
                echo "::error::$ARQUIVO acessa o schema $OUTRO — projeção local, nunca join"
                echo "$CODIGO" | grep -nE "\b$OUTRO\." | head -5
                FALHOU=1
              fi
            done
          done

          # 4. E a porta de projeção do `recon` não pode ler o schema de quem
          #    produz o evento. Ela recebe TUDO por argumento, do payload — que
          #    o produtor monta autossuficiente exatamente por isso.
          PROJ=$(sed 's/--.*//' supabase/migrations/0008_recon_ap_projection.sql)
          if echo "$PROJ" | grep -qE "\b(ap|marketing|crm|ar|ops|inv|quote|deal|evt|dun|ctr|cash|care|occ|mnt)\."; then
            echo "::error::a projeção lê o schema de outro módulo — ela só pode ler o payload"
            FALHOU=1
          fi
          # ⭐ E não pode CHUMBAR a origem: a procedência vem do envelope. Com
          #    ela fixa, um segundo produtor entraria disfarçado do primeiro e a
          #    trilha mentiria sem nunca dar erro.
          if echo "$PROJ" | grep -qE "'(ap|accounts-payable)'"; then
            echo "::error::a projeção cita o nome do módulo produtor — a origem vem de producedBy"
            FALHOU=1
          fi
          CONS=$(grep -Ev '^\s*(\*|//|/\*)' packages/finance-reconciliation/src/external-payable.ts)
          if echo "$CONS" | grep -qE "sourceModuleId:\s*'"; then
            echo "::error::o consumidor chumbou a origem — ela tem de vir de envelope.producedBy"
            FALHOU=1
          fi
          echo "$CONS" | grep -qE 'envelope\.producedBy' \
            || { echo "::error::o consumidor deixou de ler a procedência do envelope"; FALHOU=1; }

          # ⭐ E o QUARTO consumidor (a régua) obedece às mesmas três leis: a
          #    projeção dele não lê schema de produtor, não chumba a origem, e
          #    o handler lê envelope.producedBy.
          PROJD=$(sed 's/--.*//' supabase/migrations/0027_dun.sql)
          if echo "$PROJD" | grep -qE "'(ar|accounts-receivable)'"; then
            echo "::error::a projeção da régua cita o nome do módulo produtor — a origem vem de producedBy"
            FALHOU=1
          fi
          DUNC=$(grep -Ev '^\s*(\*|//|/\*)' packages/dunning/src/dun-title.ts)
          if echo "$DUNC" | grep -qE "sourceModuleId:\s*'"; then
            echo "::error::o consumidor da régua chumbou a origem — ela tem de vir de envelope.producedBy"
            FALHOU=1
          fi
          echo "$DUNC" | grep -qE 'envelope\.producedBy' \
            || { echo "::error::o consumidor da régua deixou de ler a procedência do envelope"; FALHOU=1; }

          [ "$FALHOU" = "0" ] || exit 1
          # ⚠️ O número sai da própria lista, não de uma constante escrita à
          # mão. A frase dizia "cinco módulos" desde a Etapa 12 e continuou
          # dizendo depois que a matriz aprendeu o `po` e o `ops` — uma guarda
          # correta relatando um número errado, que é o jeito mais fácil de
          # alguém acreditar que a cobertura parou de crescer.
          N=$(echo $MODULOS | wc -w)
          echo "Lego intacto: $N módulos, $(( N * (N - 1) )) pares conferidos nos dois sentidos, zero dependência entre eles."

      # ⛔⛔ A FRONTEIRA DA CHAVE-MÃE (Etapa 8).
      #
      # `apps/api` roda com `service_role`: ela ignora toda a RLS e enxerga
      # todos os tenants. `apps/portal` é a interface do CLIENTE. As duas não
      # podem virar o mesmo deploy, e o jeito de isso acontecer sem ninguém
      # notar é um `import` inocente.
      #
      # A guarda de bundle que já existe pega a string `service_role` no
      # JavaScript compilado. Esta pega um passo antes: a dependência.
      - name: a chave-mãe não encosta no app do cliente
        run: |
          FALHOU=0

          if grep -rInE "from '@alsham/api'|require\('@alsham/api'\)" apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal importa @alsham/api — a composição roda com service_role"; FALHOU=1
          fi
          if grep -qE '"(@alsham/api|pg)"' apps/portal/package.json; then
            echo "::error::apps/portal declara a composição ou um driver de banco como dependência"; FALHOU=1
          fi
          # Driver de Postgres no app do cliente significa conexão direta —
          # o portal fala com o banco pela chave publicável, sob RLS.
          if grep -rInE "from 'pg'|require\('pg'\)" apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal importa um driver de Postgres direto"; FALHOU=1
          fi
          # E os segredos do correio não podem ser lidos de lá.
          if grep -rInE 'process\.env\.(DATABASE_URL|COURIER_SECRET)' apps/portal 2>/dev/null; then
            echo "::error::apps/portal lê um segredo que é do servidor de composição"; FALHOU=1
          fi
          # O caminho inverso: a composição não pode virar tela.
          if grep -rInE "from 'next|from 'react" apps/api/src 2>/dev/null; then
            echo "::error::apps/api importou framework de UI — ele é servidor, não tela"; FALHOU=1
          fi

          [ "$FALHOU" = "0" ] || exit 1
          echo "fronteira intacta: a chave-mãe fica do lado do servidor."

      # ⭐ A COMPOSIÇÃO É A ÚNICA — e não pode reimplementar a entrega.
      #
      # Se alguém escrever a lógica de tomada, backoff ou idempotência dentro
      # de `apps/api` "porque era mais rápido", passamos a ter DUAS
      # implementações da mesma garantia. Este repositório já pagou para saber
      # o que isso custa: o defeito da Etapa 6 foi corrigido num lugar só
      # porque só existia um.
      - name: a composição chama o correio, não o reescreve
        run: |
          if grep -rInE 'function (deliverDue|entregarUm|backoffDelayMs|isExhausted|nextAttemptAt)' \
               apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a lógica de entrega foi redeclarada em apps/ — ela vive em packages/workflow"; exit 1
          fi
          COMP=$(grep -Ev '^\s*(\*|//|/\*)' apps/api/src/composition.ts)

          # ⚠️ `\b` NA FRENTE DE CADA NOME, e não é detalhe de regex.
          #
          # Sem a fronteira de palavra, a busca casa por SUBSTRING: trocar a
          # chamada por `noop_handleExternalPayable(` deixava a guarda verde,
          # porque o nome original continuava contido no novo. A sabotagem da
          # Etapa 10 pegou exatamente isso, e a fraqueza valia para as quatro
          # verificações antigas também — foram corrigidas junto.
          for FN in deliverDue eventUsageHook handleSpendDecision auditSubscription handleExternalPayable handleDunTitle; do
            echo "$COMP" | grep -Eq "\b$FN\(" \
              || { echo "::error::a composição deixou de chamar $FN() do pacote"; exit 1; }
          done
          # A quinta da lista é a terceira ponta do triângulo (Etapa 10). Sem
          # ela, o título registrado no Módulo 3 nunca chega ao Módulo 1 — e
          # ninguém veria erro nenhum, porque o evento seria entregue e
          # ignorado.

      # ⭐ A STORE NÃO DECIDE — nem o que mostra, nem quem instala.
      #
      # Dois jeitos de a Store apodrecer, e os dois são um `if` inocente:
      #   1. filtrar `status = 'published'` na tela. A policy já faz isso, e
      #      depender dela é o ponto — no dia em que alguém escrever uma
      #      segunda consulta sem o filtro, a tela mostraria rascunho.
      #   2. checar permissão ou teto de plano no app. Essas regras vivem em
      #      `core.install_module()`, e só lá.
      - name: a Store consome a decisão, não a reescreve
        run: |
          APP=$(grep -rEv '^\s*(\*|//|/\*)' apps/portal/src/app/store apps/portal/src/app/store-actions.ts apps/portal/src/components/store-shelf.tsx apps/portal/src/lib/data/store-supabase.ts)

          if echo "$APP" | grep -Eq "eq\(\s*'status'\s*,\s*'published'\s*\)"; then
            echo "::error::a Store filtra 'published' na tela — quem filtra é a policy do banco"; exit 1
          fi
          # ⚠️ A COMPARAÇÃO, não a leitura.
          #
          # A primeira versão proibia a string `limit_value` e reprovou o
          # `loadModuleLimit()`, que só LÊ o número para a tela mostrar
          # "3 de 5". A segunda proibia qualquer comparação e reprovou
          # `limite !== null`, que é checagem de nulo para exibir.
          #
          # O que a tela não pode fazer é comparar a CONTAGEM DE INSTALADOS com
          # o teto — que é literalmente a decisão de `core.install_module()`.
          if echo "$APP" | grep -Eq '(installed|instalados|count|length)[^;]{0,20}(>=|<=|>|<)[^;]{0,20}(limite|limit_value|moduleLimit)|(limite|limit_value|moduleLimit)[^;]{0,20}(>=|<=|>|<)[^;]{0,20}(installed|instalados|count|length)'; then
            echo "::error::a Store passou a DECIDIR o teto do plano — a regra vive em core.install_module()"; exit 1
          fi
          if grep -rInE 'function (buildShelf|summarizeShelf|producerOf)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a visão de catálogo foi redeclarada em apps/ — ela vive em packages/permissions"; exit 1
          fi
          PAGE=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/app/store/page.tsx)
          echo "$PAGE" | grep -Eq 'buildShelf\(' \
            || { echo "::error::a Store deixou de usar buildShelf do pacote"; exit 1; }

          # E o instalador é chamado, não reimplementado.
          ADAPTER=$(grep -Ev '^\s*(\*|//|/\*)' apps/portal/src/lib/data/store-supabase.ts)
          echo "$ADAPTER" | grep -Eq "rpc\('install_module'" \
            || { echo "::error::a Store não chama core.install_module — quem decide é o banco"; exit 1; }
          if echo "$ADAPTER" | grep -Eq "from\('role_permissions'\)[^;]*insert|insert.*role_permissions"; then
            echo "::error::a Store concede permissão direto — isso é ato do instalador"; exit 1
          fi
          echo "a Store consome a decisão do banco."

      # ⚠️ LEI 7 — BILLING CONTA USO, NÃO DINHEIRO.
      #
      # No dia em que alguém escrever um preço em reais em `packages/billing`
      # ou no schema de uso, terá inventado um número que o dono não decidiu.
      # Preço é etapa própria, com valores medidos.
      - name: billing não tem preço inventado
        run: |
          # -i e [_a-zA-Z0-9]* de propósito: a primeira versão desta guarda era
          # sensível a caixa e passou batido em `const PRECO_MENSAL = 4900`,
          # que é justamente a forma mais provável de uma constante de preço.
          # O `[^;]{0,40}` cobre a anotação de tipo entre o nome e o valor:
          # `const fee: number = 250` escapou das duas primeiras versões desta
          # guarda, e é a forma que um TypeScript real usaria.
          PRECO=$(grep -rInEi '(price|preco|preço|amount_cents|valor|tarifa|fee)[_a-zA-Z0-9]*[^;]{0,40}[:=][[:space:]]*[0-9]' \
                    packages/billing/src supabase/migrations/0003_billing.sql 2>/dev/null || true)
          if [ -n "$PRECO" ]; then
            echo "::error::preço/valor monetário em billing — Lei 7: preço é decisão do dono"
            echo "$PRECO"; exit 1
          fi
          if grep -rInE '\b(BRL|USD|EUR|R\$)\b' packages/billing/src 2>/dev/null; then
            echo "::error::moeda em packages/billing — este pacote conta uso, não dinheiro"; exit 1
          fi

      # ⛔ A CHAVE-MÃE NÃO PODE CHEGAR AO NAVEGADOR.
      #
      # `service_role` ignora toda a RLS: quem a tem enxerga todos os tenants.
      # O painel fala com o banco como o USUÁRIO. Esta guarda olha o bundle de
      # cliente já compilado — não o código-fonte —, que é onde a chave
      # apareceria de verdade se alguém a importasse por engano.
      - name: a service_role não chega ao bundle de cliente
        run: |
          DIR=apps/portal/.next/static
          [ -d "$DIR" ] || { echo "::error::bundle de cliente não encontrado — o build rodou?"; exit 1; }
          if grep -rl "service_role" "$DIR" 2>/dev/null; then
            echo "::error::a string service_role chegou ao bundle de CLIENTE"; exit 1
          fi
          # E nenhum JWT literal em lugar nenhum do build.
          if grep -rhoE "eyJ[A-Za-z0-9_-]{30,}" apps/portal/.next 2>/dev/null | head -1 | grep -q .; then
            echo "::error::um token com cara de JWT foi embutido no build"; exit 1
          fi
          echo "bundle de cliente limpo."

      # O tenant nunca pode vir do cliente.
      - name: o tenant vem da sessão, não do ambiente nem da URL
        run: |
          # Procura o USO, não a menção.
          #
          # A primeira versão desta guarda casava `NEXT_PUBLIC_TENANT` em
          # qualquer lugar — e reprovava o próprio `.env.example`, cujo
          # comentário explica justamente por que essa variável não existe.
          # É a terceira vez neste repositório que uma guarda tropeça na
          # documentação que ela deveria proteger; por isso agora é sempre
          # "leia código, não prosa".
          if grep -rInE 'process\.env\.NEXT_PUBLIC_TENANT' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::tenant lido de variável pública — ele tem de vir da sessão + memberships"; exit 1
          fi
          if grep -rInE '^[[:space:]]*NEXT_PUBLIC_TENANT' apps --include='*.example'; then
            echo "::error::variável pública de tenant declarada no .env.example"; exit 1
          fi
          grep -q 'resolveSession' apps/portal/src/lib/data/index.ts \
            || { echo "::error::a porta de dados deixou de resolver o tenant pela sessão"; exit 1; }

      # =====================================================================
      # ⚖️ A LEI DO MOTOR — O FORNECEDOR É RECEITA INTERNA (Etapa 14)
      # =====================================================================
      #
      # O cliente vê o produto e o **motor ALSHAM**. Se ele lê "powered by
      # <fornecedor>" numa tela, conclui que pode ir direto na ferramenta e
      # dispensar a ALSHAM — e a orquestração, que é o que vendemos, vira
      # detalhe. O nome do fornecedor é permitido **só em código não-visível**:
      # `apps/api/src/forge-adapters.ts`, env vars e docs de engenharia.
      #
      # ⭐ A defesa principal NÃO é esta guarda: é o TIPO. `EngineLabel`, em
      # `@alsham/ai`, não tem campo para fornecedor — a tela não teria onde
      # colocá-lo mesmo querendo. Esta guarda é a segunda camada, para o dia em
      # que alguém escrever o nome à mão numa string de UI.
      - name: nenhum nome de fornecedor no que o cliente vê
        run: |
          FORNECEDORES='anthropic|openai|chatgpt|gpt-[0-9]|gemini|google ai|vertex ai|llama|mistral|deepseek|ideogram|midjourney|stable diffusion|fal\.ai|opus clip|runway|elevenlabs'
          FALHOU=0

          # ⚠️ `CLAUDE.md` é o arquivo de instruções DESTE repositório e o nome
          # dele contém o de um fornecedor. Uma versão anterior desta guarda
          # reprovou o próprio arquivo que a manda existir. Escopo é código de
          # tela e de domínio — nunca a documentação de engenharia.
          ALVOS=$(find apps/portal/src packages/ai/src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.test.ts' ! -name '*.test.tsx')

          for F in $ALVOS; do
            if grep -InEi "$FORNECEDORES" "$F"; then
              echo "::error file=$F::nome de fornecedor em código visível ao cliente (Lei do Motor)"
              FALHOU=1
            fi
          done

          # E no bundle já compilado, que é onde ele chegaria de verdade.
          if [ -d apps/portal/.next/static ]; then
            if grep -rlEi "$FORNECEDORES" apps/portal/.next/static 2>/dev/null; then
              echo "::error::nome de fornecedor chegou ao bundle de CLIENTE"; FALHOU=1
            fi
          fi

          # ⭐ E o TIPO continua sem onde guardá-lo — a defesa principal.
          #
          # ⚠️ **DUAS correções aqui, e a segunda foi o CI que deu.**
          #
          # 1. O escopo era `forge.ts` só, e a sabotagem "acrescentar
          #    `readonly provider: string` a `EngineLabel`" passou verde: o
          #    tipo vive em `types.ts`. Guarda que olha o arquivo errado é
          #    guarda que não existe.
          # 2. Ao corrigir, alarguei o escopo para `$ALVOS` — que inclui
          #    `apps/portal/src`. **O CI reprovou cinco arquivos legítimos**,
          #    e com razão: em português, *fornecedor* é **quem fornece
          #    mercadoria** — a etiqueta do CRM, o nome no Contas a Pagar, o
          #    do pedido de Compras. Não tem nada a ver com fornecedor de
          #    motor de IA. Confundir as duas palavras proibiria o produto de
          #    falar o idioma do negócio dele.
          #
          # O escopo certo é `packages/ai/src`: é lá que o rótulo do motor
          # mora, e é lá que um campo com esse nome seria o defeito.
          #
          # ⚠️ E o filtro de comentário precisa de `/\*` junto: um bloco JSDoc
          # abre com `/**`, que não casa `\*` nem `//` — a linha 3 de
          # `forge-port.ts` foi reprovada por ser um comentário.
          for A in $(find packages/ai/src -type f -name '*.ts' ! -name '*.test.ts'); do
            if grep -InE 'provider|vendor|fornecedor' "$A" | grep -vE '^[0-9]+:[[:space:]]*(\*|//|/\*)' | grep -q .; then
              echo "::error file=$A::campo de fornecedor em @alsham/ai — o rótulo do motor não tem esse campo"
              grep -InE 'provider|vendor|fornecedor' "$A" | grep -vE '^[0-9]+:[[:space:]]*(\*|//|/\*)'
              FALHOU=1
            fi
          done

          [ "$FALHOU" = "0" ] || exit 1
          echo "o cliente vê o motor ALSHAM, e só."

      # ⛔ A CHAVE DO MOTOR É DO SERVIDOR — a mesma fronteira da chave-mãe.
      #
      # ⚠️ **Há duas coisas diferentes aqui, e confundi-las foi o primeiro erro
      # desta guarda.**
      #
      #   · `FORGE_SECRET` é a CHAVE DA PORTA entre `apps/portal` e `apps/api`.
      #     O portal **tem** de tê-la — é com ela que ele se identifica no
      #     endpoint. Proibi-la aqui reprovaria `getForgePort()`, que é
      #     justamente a fronteira funcionando.
      #   · `ALSHAM_*_API_KEY` e os endpoints do fornecedor são a CHAVE DO
      #     MOTOR. Essas o portal nunca vê, em nenhuma hipótese: quem chama o
      #     fornecedor é `apps/api`, e quem paga a conta é quem apresenta a
      #     chave.
      #
      # ⚠️ E o escopo é `src` + `.env.example`, **não a pasta inteira**: o
      # `.next/` já existe quando este job roda (o build precede a guarda de
      # bundle), e os *source maps* de lá contêm o código-fonte inteiro em
      # forma de string. Grepar a pasta do build é grepar o próprio código
      # duas vezes, e a segunda dá falso positivo.
      - name: a chave do motor não encosta no portal
        run: |
          FALHOU=0
          if grep -rInE 'process\.env\.(ALSHAM_TEXT_API_KEY|ALSHAM_IMAGE_API_KEY|ALSHAM_TEXT_ENDPOINT|ALSHAM_IMAGE_ENDPOINT|ALSHAM_TEXT_MODEL)' \
               apps/portal/src apps/portal/.env.example 2>/dev/null; then
            echo "::error::apps/portal leu uma chave/endpoint de motor — isso é de apps/api"; FALHOU=1
          fi
          if grep -rInE 'NEXT_PUBLIC_[A-Z_]*(API_KEY|SECRET|TOKEN)' \
               apps/portal/src apps/api/src --include='*.ts' --include='*.tsx' 2>/dev/null; then
            echo "::error::segredo declarado como variável PÚBLICA — isso vai para o navegador"; FALHOU=1
          fi
          if grep -rInE '^[[:space:]]*NEXT_PUBLIC_[A-Z_]*(API_KEY|SECRET|TOKEN)' apps/*/.env.example 2>/dev/null; then
            echo "::error::segredo público declarado no .env.example"; FALHOU=1
          fi
          # E o portal não chama fornecedor nenhum direto: ele fala com apps/api.
          if grep -rInE "fetch\(\s*['\"]https://api\." apps/portal/src 2>/dev/null; then
            echo "::error::apps/portal chama uma API externa direto — a fronteira é apps/api"; FALHOU=1
          fi
          # E nenhum dos dois segredos chega ao navegador.
          if [ -d apps/portal/.next/static ]; then
            if grep -rlE 'FORGE_SECRET|ALSHAM_(TEXT|IMAGE)_API_KEY' apps/portal/.next/static 2>/dev/null; then
              echo "::error::nome de segredo no bundle de CLIENTE"; FALHOU=1
            fi
          fi
          [ "$FALHOU" = "0" ] || exit 1
          echo "a chave da porta é do portal; a chave do motor, só do servidor."

      # ⛔ SEM MEDIÇÃO, SEM GERAÇÃO.
      #
      # É a regra que impede o produto de queimar dinheiro sem saber: uma
      # geração que não vira linha no `usage_ledger` é custo invisível. A
      # cadeia inteira depende de `checkLimit()` negar por omissão, e o modo
      # de quebrá-la em silêncio é gerar ANTES de medir.
      - name: geração sem medição não passa
        run: |
          SVC=$(grep -Ev '^\s*(\*|//|/\*)' apps/api/src/forge-service.ts)
          for FN in checkLimit canGenerate; do
            echo "$SVC" | grep -Eq "\b$FN\(" \
              || { echo "::error::forge-service deixou de chamar $FN() do pacote"; exit 1; }
          done
          # ⚠️ `insert into`, não a menção. A primeira versão procurava só
          # `usage_ledger` — e o serviço LÊ a tabela para somar o consumo do
          # mês, algumas linhas antes de escrever. Trocar o `insert` de tabela
          # deixava a guarda verde: a leitura sozinha a satisfazia. Uma geração
          # que consulta a conta e não a debita é exatamente o custo invisível
          # que esta guarda existe para impedir.
          echo "$SVC" | grep -Eq 'insert into core\.usage_ledger' \
            || { echo "::error::a geração deixou de LANÇAR consumo no usage_ledger"; exit 1; }

          # ⭐ A ORDEM IMPORTA: a checagem vem ANTES da chamada ao adaptador.
          # Medir depois de gastar é medir o prejuízo, não evitá-lo.
          L_CHECK=$(echo "$SVC" | grep -nE '\bcanGenerate\(' | head -1 | cut -d: -f1)
          L_CALL=$(echo "$SVC"  | grep -nE '\badapter\.(generate|run)\(|adapterFor\(' | head -1 | cut -d: -f1)
          if [ -n "$L_CHECK" ] && [ -n "$L_CALL" ] && [ "$L_CHECK" -gt "$L_CALL" ]; then
            echo "::error::a checagem de cota ficou DEPOIS da chamada ao motor"; exit 1
          fi

          # E a decisão não foi reescrita na tela.
          if grep -rInE 'function (canGenerate|engineState|whyCannotGenerate|composePrompt)' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::a decisão da forja foi redeclarada em apps/ — ela vive em packages/ai"; exit 1
          fi
          echo "sem medição, sem geração."

      # ⭐ O PAINEL EXECUTIVO NÃO DECIDE, E NÃO INVENTA NÚMERO (Etapa 15).
      - name: o painel lê, e cada número tem fonte
        run: |
          PAGE=$(grep -Ev '^\s*(\*|//|/\*|\{/\*)' apps/portal/src/app/page.tsx)
          FALHOU=0

          # A faixa de consumo é decisão de produto e vive no pacote.
          echo "$PAGE" | grep -Eq '\busageBand\(' \
            || { echo "::error::o Painel deixou de usar usageBand() de @alsham/billing"; FALHOU=1; }
          if grep -rInE 'function usageBand|USAGE_WARNING_RATIO\s*=' apps --include='*.ts' --include='*.tsx'; then
            echo "::error::o limiar de aviso foi redeclarado em apps/ — ele vive em packages/billing"; FALHOU=1
          fi

          # Os atalhos são o MESMO menu — não uma segunda lista para manter.
          echo "$PAGE" | grep -Eq '\bvisibleMenu\(' \
            || { echo "::error::o Painel montou lista própria de atalhos em vez de usar visibleMenu()"; FALHOU=1; }

          # ⛔ E ele NÃO pode ler a saúde global do correio.
          if echo "$PAGE" | grep -Eq "courier_status|courier_health"; then
            echo "::error::o Painel leu a fila GLOBAL — o tenant vê tenant_courier_summary()"; FALHOU=1
          fi
          if grep -rInE "rpc\('courier_status'|from\('courier_health'\)" apps/portal/src 2>/dev/null; then
            echo "::error::o portal chamou a saúde global da fila"; FALHOU=1
          fi
          # ⚠️ A CHAMADA, não a palavra. A primeira versão fazia
          # `grep -q tenant_courier_summary` no arquivo — e o cabeçalho dele
          # explica, em prosa, justamente por que a leitura é essa. Trocar o
          # `rpc()` por `courier_status` deixava a guarda verde, satisfeita
          # pelo próprio comentário que documenta a regra violada. É a quarta
          # vez neste repositório que uma guarda tropeça na documentação que
          # deveria proteger: leia código, nunca prosa.
          grep -Eq "rpc\('tenant_courier_summary'" apps/portal/src/lib/data/panel-supabase.ts \
            || { echo "::error::a porta do Painel deixou de CHAMAR a leitura estreita do tenant"; FALHOU=1; }

          [ "$FALHOU" = "0" ] || exit 1
          echo "o painel lê; quem decide é o banco e o pacote."
