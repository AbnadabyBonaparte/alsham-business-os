                             and ccu.table_name='template_items';")
          [ "$F" = "0" ] || { echo "::error::apareceu FK da prancheta para o item de origem — a cópia é por valor"; exit 1; }
          D=$($PSQL -tAc "select count(*) from information_schema.role_table_grants
                            where table_schema='chk' and privilege_type='DELETE'
                              and grantee in ('anon','authenticated','PUBLIC');")
